                                    :viewMode==='seated'
                                    ?'・お客様の左側面から背面カメラで撮影<br>・椅子に座った普段通りの姿勢で撮影<br>・両手は膝の上か自然な位置に<br>・頭頂部から腰まで映るように調整'
                                    :'・お客様の左側面から背面カメラで撮影<br>・両腕は自然に体の横に下ろしてもらう<br>・普段通りの姿勢でリラックス<br>・頭頂部から足先まで全身が映るように調整'
                                }}/>
                            </div>
                        )}
                    </div>

                    {/* 論文根拠モーダル */}
                    {refModal && (
                        <div className="fixed inset-0 bg-black/50 z-[9999] flex items-center justify-center p-4" onClick={() => setRefModal(null)}>
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-5 animate-scale-in" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="font-bold text-teal-800 text-base">{refModal.label}</h3>
                                    <button onClick={() => setRefModal(null)} className="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
                                </div>
                                <div className="space-y-3">
                                    <div className="flex items-center gap-2 mb-2">
                                        <div className="min-w-[44px] h-7 rounded-full flex items-center justify-center text-white text-sm font-bold" style={{background:postureScoreColor(refModal.score)}}>{refModal.score}</div>
                                        <span className="text-sm text-gray-600">{refModal.detail} — {refModal.value}{refModal.valueCm ? '（約' + refModal.valueCm + '）' : ''}</span>
                                    </div>
                                    <div className="bg-teal-50 rounded-xl p-4 border border-teal-100">
                                        <div className="text-xs font-bold text-teal-700 mb-2">📚 査読付き学術論文</div>
                                        <div className="space-y-2 text-xs text-gray-600">
                                            <div>
                                                <span className="font-bold text-gray-700">著者: </span>
                                                {refModal.reference.authors}
                                            </div>
                                            <div>
                                                <span className="font-bold text-gray-700">年: </span>
                                                {refModal.reference.year}
                                            </div>
                                            <div>
                                                <span className="font-bold text-gray-700">ジャーナル: </span>
                                                {refModal.reference.journal}
                                            </div>
                                            {refModal.reference.doi && (
                                                <div>
                                                    <span className="font-bold text-gray-700">DOI: </span>
                                                    <a href={`https://doi.org/${refModal.reference.doi}`} target="_blank" rel="noopener noreferrer" className="text-teal-600 underline break-all">{refModal.reference.doi}</a>
                                                </div>
                                            )}
                                            {refModal.reference.pmid && (
                                                <div>
                                                    <span className="font-bold text-gray-700">PubMed: </span>
                                                    <a href={`https://pubmed.ncbi.nlm.nih.gov/${refModal.reference.pmid}/`} target="_blank" rel="noopener noreferrer" className="text-teal-600 underline">PMID: {refModal.reference.pmid}</a>
                                                </div>
                                            )}
                                            <div className="pt-2 border-t border-teal-200">
                                                <span className="font-bold text-gray-700">知見: </span>
                                                {refModal.reference.finding}
                                            </div>
                                        </div>
                                    </div>
                                    <p className="text-[10px] text-gray-400 text-center mt-3">
                                        本スコアリングは上記のPeer-Reviewed論文に基づいています
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* LINE送信モーダル */}
                    {lineModalOpen && (
                        <div className="fixed inset-0 bg-black/50 z-[9999] flex items-center justify-center p-4" onClick={()=>lineSendStatus!=='sending'&&setLineModalOpen(false)}>
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md max-h-[80vh] flex flex-col overflow-hidden" onClick={e=>e.stopPropagation()}>
                                <div className="p-4 border-b text-white flex items-center justify-between rounded-t-2xl" style={{background:'#06C755'}}>
                                    <div className="flex items-center gap-2">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/></svg>
                                        <span className="font-bold">姿勢分析をLINEで送信</span>
                                    </div>
                                    <button onClick={()=>setLineModalOpen(false)} className="text-white/80 hover:text-white text-xl">&times;</button>
                                </div>
                                {lineChatHook && (() => { const ls = lineChatHook.allowedLineStores || []; return ls.length > 1 ? (
                                    <div className="px-4 pt-3 flex gap-2 flex-wrap">
                                        {ls.map(s=>(
                                            <button key={s.id} onClick={()=>{lineChatHook.setLineStoreId(s.id);lineChatHook.fetchThreads(s.id);setLineSelectedUser(null);}}
                                                className={`text-xs px-3 py-1 rounded-full border transition ${lineChatHook.lineStoreId===s.id?'bg-green-600 text-white border-green-600':'bg-white text-gray-600 border-gray-300'}`}>{s.name}</button>
                                        ))}
                                    </div>
                                ) : null; })()}
                                <div className="px-4 pt-3">
                                    <input type="text" value={lineSearchQuery} onChange={e=>setLineSearchQuery(e.target.value)} placeholder="ユーザー名で検索..."
                                        className="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-green-500 outline-none"/>
                                </div>
                                <div className="flex-1 overflow-y-auto px-4 py-3 space-y-1">
                                    {lineChatHook && lineChatHook.threads.length===0 && (
                                        lineChatHook.loading
                                            ? <SkeletonRow count={3} />
                                            : <EmptyState icon="message-circle" title="LINEスレッドがありません" message="お客様からのメッセージがあると表示されます" compact />
                                    )}
                                    {lineChatHook && lineChatHook.threads
                                        .filter(t => {
                                            const pr = lineChatHook.profiles[t.userId] || {};
                                            const name = resolveDisplayName(pr, t.userId).toLowerCase();
                                            return !lineSearchQuery || name.includes(lineSearchQuery.toLowerCase());
                                        })
                                        .map(t=>{
                                            const pr=lineChatHook.profiles[t.userId]||{};
                                            const name = resolveDisplayName(pr, t.userId, lineChatHook.refreshingUserIds);
                                            const sel=lineSelectedUser&&lineSelectedUser.userId===t.userId;
                                            return (
                                                <button key={t.userId} onClick={()=>setLineSelectedUser({userId:t.userId,displayName:name})}
                                                    className={`w-full flex items-center gap-3 p-3 rounded-xl text-left transition ${sel?'bg-green-50 border-2 border-green-500':'hover:bg-gray-50 border-2 border-transparent'}`}>
                                                    <LineAvatar profile={pr} userId={t.userId} name={name} size={40} />
                                                    <div className="flex-1 min-w-0">
                                                        <p className="font-bold text-sm truncate">{name}</p>
                                                        {t.lastMessage&&<p className="text-xs text-gray-400 truncate">{previewForMessage(t.lastMessage)}</p>}
                                                    </div>
                                                    {sel&&<svg className="w-5 h-5 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd"/></svg>}
                                                </button>
                                            );
                                        })}
                                </div>
                                <div className="p-4 border-t bg-gray-50">
                                    {lineSelectedUser&&(() => {
                                        // プロフィール更新で名前が変わっても表示先が古い名前にならないよう、
                                        // 現在の profiles/refreshingUserIds から毎回導出する。
                                        const liveName = resolveDisplayName(
                                            (lineChatHook && lineChatHook.profiles && lineChatHook.profiles[lineSelectedUser.userId]) || {},
                                            lineSelectedUser.userId,
                                            lineChatHook && lineChatHook.refreshingUserIds
                                        );
                                        return <p className="text-xs text-gray-500 mb-2 text-center">送信先: <span className="font-bold text-gray-700">{liveName}</span></p>;
                                    })()}
                                    {lineSendStatus==='sent'&&<div className="flex items-center justify-center gap-2 text-green-600 font-bold text-sm py-2"><svg className="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd"/></svg>送信完了！</div>}
                                    {lineSendStatus==='error'&&<p className="text-center text-red-500 text-sm mb-2 font-bold">送信に失敗しました。</p>}
                                    {lineSendStatus!=='sent'&&(
                                        <button onClick={handleLineSend} disabled={!lineSelectedUser||lineSendStatus==='sending'}
                                            className={`w-full py-3 rounded-xl font-bold text-white text-sm transition shadow-lg ${lineSelectedUser&&lineSendStatus!=='sending'?'bg-[#06C755] hover:bg-[#05b34c]':'bg-gray-300 cursor-not-allowed'}`}>
                                            {lineSendStatus==='sending'?'送信中...':hasAnyPair?'比較レポートをLINEで送信':'姿勢分析をLINEで送信'}
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ============================================================
        // 元コードのコピーここまで
        // ============================================================

        // スタンドアロン版エントリーポイント
        // lineChatHook を渡さないことで LINE 連携モーダルは無効化される
        const _root = ReactDOM.createRoot(document.getElementById('root'));
        _root.render(React.createElement(PostureAnalysisView, { lineChatHook: null }));
    </script>
</body>
</html>
