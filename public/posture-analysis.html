<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0F6E56">
    <title>姿勢分析ツール — Posture Analysis</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React 18 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel (for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        html, body { font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; background: #f8f7f4; margin: 0; padding: 0; min-height: 100vh; }
        #root { min-height: 100vh; }
        /* skeleton placeholder（互換性のため保持） */
        .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        /* 論文根拠モーダルのアニメーション */
        @keyframes scale-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-scale-in { animation: scale-in 0.2s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        // ============================================================
        // 姿勢分析スタンドアロンツール
        //
        // public/index.html L15569-L18695 から PostureAnalysisView と関連
        // コードを無改変でコピーしている。
        // ロジック・UI・コメントすべて元コードのまま。
        //
        // このラッパー部分のみ追加要素：
        //  - React フック分割代入（元ファイルでは L1814 にある）
        //  - todayLocalYMD（元ファイル L1850）
        //  - hapticSuccess（元ファイル L1885）
        //  - showToast（元ファイル L2327 — スタンドアロン用に簡略化）
        //
        // 注意:
        //  - lineChatHook=null で起動するため LINE 送信モーダルは開かない
        //    （openLineModal が alert を出して return する）
        //  - /api/photos/upload, /api/claude/advice はサーバー側がないと
        //    エラー応答になるが、元コードに従って graceful にハンドルされる
        // ============================================================
        const { useState, useEffect, useMemo, useCallback, useRef, useLayoutEffect } = React;

        // ローカル時刻ヘルパー（index.html L1850 と同一）
        const todayLocalYMD = () => {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };

        // 触覚フィードバック（index.html L1885 と同一の動作）
        const _hapticEnabled = () => {
            if (typeof navigator === 'undefined' || typeof navigator.vibrate !== 'function') return false;
            return true;
        };
        const hapticSuccess = () => {
            if (_hapticEnabled()) { try { navigator.vibrate([8, 30, 8]); } catch (_) {} }
        };

        // トースト通知（スタンドアロン用簡易版 — alert / console にフォールバック）
        const showToast = (message, type = 'info', duration = 3500) => {
            console.log('[' + type + ']', message);
            try {
                const div = document.createElement('div');
                div.textContent = message;
                div.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99999;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,0.18);color:#fff;background:' + (type==='error'?'#dc2626':type==='success'?'#059669':type==='warning'?'#d97706':'#0F6E56');
                document.body.appendChild(div);
                setTimeout(() => { div.style.opacity='0'; div.style.transition='opacity .25s'; }, Math.max(0, duration - 250));
                setTimeout(() => { try { document.body.removeChild(div); } catch (_) {} }, duration);
            } catch (_) {}
        };

        // ============================================================
        // 以下、public/index.html L15569-L18695 を完全コピー（無改変）
        // ============================================================
        // ==========================================
        // 姿勢分析LINE Flexメッセージビルダー
        // ==========================================
        const buildPostureFlexMessage = ({ customerName, visitDate, viewMode, analysis, totalScore, staffName }) => {
            const displayName = customerName ? (customerName.includes('様') ? customerName : customerName + ' 様') : '様';
            const displayDate = visitDate ? visitDate.replace(/-/g, '.') : new Date().toISOString().split('T')[0].replace(/-/g, '.');
            const displayStaff = staffName ? staffName + ' より' : '担当より';
            const viewLabel = viewMode === 'front' ? '正面' : viewMode === 'back' ? '背面' : viewMode === 'seated' ? '座位' : '側面';

            const scoreColor = (s) => s >= 80 ? '#0F6E56' : s >= 60 ? '#639922' : s >= 40 ? '#EF9F27' : '#E24B4A';
            const scoreLabel = (s) => s >= 80 ? '良好' : s >= 60 ? 'やや注意' : s >= 40 ? '要改善' : '要施術';
            const barFill = (s) => {
                const pct = Math.max(5, s);
                return { type: 'box', layout: 'vertical', height: '8px', cornerRadius: '4px', backgroundColor: '#e8e8e8',
                    contents: [{ type: 'box', layout: 'vertical', height: '8px', cornerRadius: '4px',
                        backgroundColor: scoreColor(s), width: pct + '%', contents: [{ type: 'filler' }] }] };
            };

            const scoreRows = analysis.items.map(item => ({
                type: 'box', layout: 'vertical', spacing: 'xs', margin: 'lg',
                contents: [
                    { type: 'box', layout: 'horizontal', contents: [
                        { type: 'text', text: item.label, size: 'xs', weight: 'bold', color: '#333333', flex: 5 },
                        { type: 'text', text: String(item.score), size: 'xs', weight: 'bold', color: scoreColor(item.score), flex: 1, align: 'end' },
                    ]},
                    barFill(item.score),
                    { type: 'text', text: item.detail + ' — ' + item.value, size: 'xxs', color: '#888888', margin: 'xs' },
                    ...(item.reference ? [{
                        type: 'text',
                        text: '📚 ' + item.reference.authors + ' (' + item.reference.year + ')',
                        size: 'xxs',
                        color: '#aaaaaa',
                        margin: 'xs',
                    }] : []),
                ],
            }));

            const adviceItems = analysis.items.filter(i => i.score < 70).map(item => ({
                type: 'box', layout: 'horizontal', spacing: 'sm', margin: 'sm',
                contents: [
                    { type: 'text', text: item.score < 40 ? '⚠' : '▸', size: 'xs', color: scoreColor(item.score), flex: 0 },
                    { type: 'text', text: item.label + '：' + item.detail, size: 'xs', color: '#555555', wrap: true, flex: 1 },
                ],
            }));

            const totalColor = scoreColor(totalScore);

            const bubble = {
                type: 'bubble', size: 'mega',
                header: {
                    type: 'box', layout: 'vertical', paddingAll: '20px',
                    backgroundColor: '#04342C',
                    contents: [
                        { type: 'text', text: "si'se 姿勢分析レポート", size: 'sm', weight: 'bold', color: '#5DCAA5', align: 'center' },
                        { type: 'text', text: 'Posture Analysis Report', size: 'xxs', color: '#5DCAA580', align: 'center', margin: 'xs' },
                        { type: 'separator', color: '#5DCAA530', margin: 'lg' },
                        { type: 'text', text: displayName, size: 'xl', weight: 'bold', color: '#ffffff', align: 'center', margin: 'md' },
                        { type: 'box', layout: 'horizontal', justifyContent: 'center', spacing: 'lg', margin: 'md', contents: [
                            { type: 'text', text: '📅 ' + displayDate, size: 'xxs', color: '#5DCAA5' },
                            { type: 'text', text: '📐 ' + viewLabel + '分析', size: 'xxs', color: '#5DCAA5' },
                        ]},
                    ],
                },
                body: {
                    type: 'box', layout: 'vertical', spacing: 'lg', paddingAll: '20px',
                    contents: [
                        { type: 'box', layout: 'vertical', cornerRadius: 'xl', backgroundColor: totalScore >= 60 ? '#E1F5EE' : '#FAEEDA', paddingAll: '16px', alignItems: 'center',
                            contents: [
                                { type: 'text', text: viewLabel + '総合スコア', size: 'xs', weight: 'bold', color: '#666666' },
                                { type: 'text', text: String(totalScore), size: '3xl', weight: 'bold', color: totalColor, margin: 'sm' },
                                { type: 'text', text: scoreLabel(totalScore), size: 'sm', weight: 'bold', color: totalColor, margin: 'xs' },
                            ],
                        },
                        { type: 'separator', color: '#e8e8e8', margin: 'lg' },
                        { type: 'text', text: '各部位の分析結果', size: 'xs', weight: 'bold', color: '#04342C', margin: 'md' },
                        ...scoreRows,
                        ...(adviceItems.length > 0 ? [
                            { type: 'separator', color: '#e8e8e8', margin: 'lg' },
                            { type: 'text', text: '改善ポイント', size: 'xs', weight: 'bold', color: '#BA7517', margin: 'md' },
                            ...adviceItems,
                        ] : []),
                    ],
                },
                footer: {
                    type: 'box', layout: 'vertical', paddingAll: '16px', backgroundColor: '#f8f7f4',
                    contents: [
                        { type: 'text', text: displayStaff, size: 'xxs', color: '#888888', align: 'end' },
                        { type: 'separator', color: '#e8e8e8', margin: 'md' },
                        { type: 'text', text: '定期的な姿勢チェックで改善を実感しましょう', size: 'xxs', color: '#aaaaaa', align: 'center', margin: 'md' },
                        { type: 'text', text: '※スコアは査読付き学術論文の基準に基づいています', size: 'xxs', color: '#bbbbbb', align: 'center', margin: 'sm' },
                    ],
                },
            };

            return { type: 'flex', altText: `姿勢分析レポート（${viewLabel}）— ${displayName}`, contents: bubble };
        };

        // ==========================================
        // 姿勢分析: PostureAnalysisView コンポーネント
        // ==========================================
        const POSTURE_LM = {
            NOSE:0,LEFT_EYE:1,RIGHT_EYE:2,LEFT_EAR:3,RIGHT_EAR:4,
            LEFT_SHOULDER:11,RIGHT_SHOULDER:12,LEFT_HIP:23,RIGHT_HIP:24,
            LEFT_KNEE:25,RIGHT_KNEE:26,LEFT_ANKLE:27,RIGHT_ANKLE:28,
            LEFT_ELBOW:13,RIGHT_ELBOW:14,LEFT_WRIST:15,RIGHT_WRIST:16,
        };
        const POSTURE_CONNECTIONS = [
            [11,12],[11,13],[13,15],[12,14],[14,16],
            [11,23],[12,24],[23,24],[23,25],[24,26],[25,27],[26,28],
        ];

        function postureCalcAngle(a,b,c){
            const ab={x:a.x-b.x,y:a.y-b.y},cb={x:c.x-b.x,y:c.y-b.y};
            const dot=ab.x*cb.x+ab.y*cb.y;
            const m1=Math.sqrt(ab.x**2+ab.y**2),m2=Math.sqrt(cb.x**2+cb.y**2);
            if(!m1||!m2) return 0;
            return Math.acos(Math.min(1,Math.max(-1,dot/(m1*m2))))*(180/Math.PI);
        }
        function postureMid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
        // A3: ランドマーク群の平均visibility（信頼度）を算出
        function postureLmConfidence(...lms){ const vs = lms.filter(l=>l&&l.visibility!=null).map(l=>l.visibility); return vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : 0; }
        function postureScoreColor(s){return s>=80?'#0F6E56':s>=60?'#639922':s>=40?'#EF9F27':'#E24B4A';}
        function postureScoreLabel(s){return s>=80?'良好':s>=60?'やや注意':s>=40?'要改善':'要施術';}
        function postureScoreBg(s){return s>=80?'#E1F5EE':s>=60?'#EAF3DE':s>=40?'#FAEEDA':'#FCEBEB';}

        // 推定実寸変換用の基準値（cm）
        const POSTURE_REF_SHOULDER_WIDTH_CM = 38; // 成人平均肩幅(cm)
        const POSTURE_REF_SH_HIP_DIST_CM = 42;   // 成人平均肩-腰間距離(cm)

        function postureAnalyzeFront(lm){
            const L=POSTURE_LM, ls=lm[L.LEFT_SHOULDER],rs=lm[L.RIGHT_SHOULDER];
            const lh=lm[L.LEFT_HIP],rh=lm[L.RIGHT_HIP],nose=lm[L.NOSE];
            const sMid=postureMid(ls,rs), hMid=postureMid(lh,rh);
            // A4: 肩幅を基準長として正規化（カメラ距離に依存しない）
            const shoulderWidth = Math.sqrt((rs.x-ls.x)**2 + (rs.y-ls.y)**2);
            const refLen = shoulderWidth > 0.01 ? shoulderWidth : 0.2; // fallback
            // 肩の傾斜角（度数に変換: MediaPipeのy差 → 近似角度）
            const shoulderDx = rs.x - ls.x;
            const shoulderDy = rs.y - ls.y;
            const shoulderAngle = Math.abs(Math.atan2(shoulderDy, shoulderDx) * (180/Math.PI));
            const shoulderTilt = Math.abs(shoulderAngle - 180); // 0°が水平
            // 論文ベース閾値（Fortin et al. 2011: 15°以上で側弯症兆候）
            const shoulderScore =
                shoulderTilt <= 2 ? Math.round(100 - shoulderTilt * 5) :
                shoulderTilt <= 5 ? Math.round(90 - (shoulderTilt-2) * 6.7) :
                shoulderTilt <= 10 ? Math.round(70 - (shoulderTilt-5) * 6) :
                Math.round(Math.max(0, 40 - (shoulderTilt-10) * 4));
            // 骨盤の傾斜角
            const hipDx = rh.x - lh.x;
            const hipDy = rh.y - lh.y;
            const hipAngle = Math.abs(Math.atan2(hipDy, hipDx) * (180/Math.PI));
            const hipTilt = Math.abs(hipAngle - 180);
            const hipScore =
                hipTilt <= 2 ? Math.round(100 - hipTilt * 5) :
                hipTilt <= 5 ? Math.round(90 - (hipTilt-2) * 6.7) :
                hipTilt <= 10 ? Math.round(70 - (hipTilt-5) * 6) :
                Math.round(Math.max(0, 40 - (hipTilt-10) * 4));
            // A4: 頭部の傾き（肩幅基準で正規化した偏位 %）
            const headOffsetRaw = Math.abs(nose.x - sMid.x);
            const headOffset = (headOffsetRaw / refLen) * 6; // 肩幅の1/6=約1.5%相当に正規化
            const headScore =
                headOffset <= 1.5 ? Math.round(100 - headOffset * 6.7) :
                headOffset <= 3 ? Math.round(90 - (headOffset-1.5) * 13.3) :
                headOffset <= 5 ? Math.round(70 - (headOffset-3) * 15) :
                Math.round(Math.max(0, 40 - (headOffset-5) * 8));
            // A4: 重心の左右ズレ（肩幅基準で正規化）
            const centerOffsetRaw = Math.abs(sMid.x - hMid.x);
            const centerOffset = (centerOffsetRaw / refLen) * 6;
            const centerScore =
                centerOffset <= 1.5 ? Math.round(100 - centerOffset * 6.7) :
                centerOffset <= 3 ? Math.round(90 - (centerOffset-1.5) * 13.3) :
                centerOffset <= 5 ? Math.round(70 - (centerOffset-3) * 15) :
                Math.round(Math.max(0, 40 - (centerOffset-5) * 8));
            // cm推定: 肩幅基準で実寸換算
            const cmPerUnit = POSTURE_REF_SHOULDER_WIDTH_CM / refLen;
            const shoulderDisplacementCm = Math.abs(shoulderDy) * cmPerUnit;
            const hipDisplacementCm = Math.abs(hipDy) * cmPerUnit;
            const headDisplacementCm = headOffsetRaw * cmPerUnit;
            const centerDisplacementCm = centerOffsetRaw * cmPerUnit;
            return {items:[
                {
                    key:'shoulder', label:'肩の左右バランス',
                    score: shoulderScore,
                    confidence: postureLmConfidence(ls, rs),
                    detail: shoulderTilt < 1 ? '均等' : ls.y < rs.y ? '左肩が高い' : '右肩が高い',
                    value: shoulderTilt.toFixed(1) + '°',
                    valueCm: shoulderDisplacementCm.toFixed(1) + 'cm',
                    reference: {
                        authors: 'Fortin C, Feldman DE, Cheriet F, Labelle H',
                        year: 2011,
                        journal: 'Disability and Rehabilitation, 33(5):367-383',
                        doi: '10.3109/09638288.2010.492066',
                        pmid: '20568973',
                        finding: 'フォトグラメトリーによる肩傾斜角の測定は高い信頼性（ICC>0.90）。2°以内が正常範囲、15°以上で側弯症の兆候。'
                    }
                },
                {
                    key:'hip', label:'骨盤の左右バランス',
                    score: hipScore,
                    confidence: postureLmConfidence(lh, rh),
                    detail: hipTilt < 1 ? '均等' : lh.y < rh.y ? '左が高い' : '右が高い',
                    value: hipTilt.toFixed(1) + '°',
                    valueCm: hipDisplacementCm.toFixed(1) + 'cm',
                    reference: {
                        authors: 'Herrington L',
                        year: 2011,
                        journal: 'Manual Therapy, 16(6):646-648',
                        doi: '10.1016/j.math.2011.04.006',
                        pmid: '21658988',
                        finding: '無症状者120名で骨盤傾斜角の正常値を報告。PALM法で左右差2°以内が正常範囲。骨盤の左右非対称は全身の歪み指標となる。'
                    }
                },
                {
                    key:'head', label:'頭部の傾き',
                    score: headScore,
                    confidence: postureLmConfidence(nose, ls, rs),
                    detail: headOffset < 1 ? '正中' : nose.x < sMid.x ? '左に傾斜' : '右に傾斜',
                    value: headOffset.toFixed(1) + '%偏位',
                    valueCm: headDisplacementCm.toFixed(1) + 'cm',
                    reference: {
                        authors: 'Singla D, Veqar Z',
                        year: 2017,
                        journal: 'J Chiropractic Medicine, 16(2):131-138',
                        doi: '10.1016/j.jcm.2017.01.005',
                        pmid: '28559753',
                        finding: 'フォトグラメトリーによる冠状面の頭部傾斜評価は中〜高の検者内信頼性（ICC=0.82-0.95）。1.5%以内の偏位が正常範囲。'
                    }
                },
                {
                    key:'center', label:'重心の左右ズレ',
                    score: centerScore,
                    confidence: postureLmConfidence(ls, rs, lh, rh),
                    detail: centerOffset < 1 ? '正中' : sMid.x < hMid.x ? '左にズレ' : '右にズレ',
                    value: centerOffset.toFixed(1) + '%偏位',
                    valueCm: centerDisplacementCm.toFixed(1) + 'cm',
                    reference: {
                        authors: 'Ferreira EA, Duarte M, Maldonado EP, Burke TN, Marques AP',
                        year: 2010,
                        journal: 'Clinics (São Paulo), 65(7):675-681',
                        doi: '10.1590/S1807-59322010000700005',
                        pmid: '20668624',
                        finding: '姿勢評価ソフトウェアSAPOの妥当性・信頼性を検証。角度・距離ともに高い検者間・検者内信頼性を確認（ICC=0.90-0.98）。'
                    }
                },
            ]};
        }
        // 背面の姿勢分析（背面特有の評価項目を含む）
        function postureAnalyzeBack(lm){
            const L=POSTURE_LM, ls=lm[L.LEFT_SHOULDER],rs=lm[L.RIGHT_SHOULDER];
            const lh=lm[L.LEFT_HIP],rh=lm[L.RIGHT_HIP],nose=lm[L.NOSE];
            const sMid=postureMid(ls,rs), hMid=postureMid(lh,rh);
            // A4: 肩幅を基準長として正規化
            const shoulderWidth = Math.sqrt((rs.x-ls.x)**2 + (rs.y-ls.y)**2);
            const refLen = shoulderWidth > 0.01 ? shoulderWidth : 0.2;
            // 1. 肩の左右バランス（正面と同じ）
            const shoulderDx = rs.x - ls.x;
            const shoulderDy = rs.y - ls.y;
            const shoulderAngle = Math.abs(Math.atan2(shoulderDy, shoulderDx) * (180/Math.PI));
            const shoulderTilt = Math.abs(shoulderAngle - 180);
            const shoulderScore =
                shoulderTilt <= 2 ? Math.round(100 - shoulderTilt * 5) :
                shoulderTilt <= 5 ? Math.round(90 - (shoulderTilt-2) * 6.7) :
                shoulderTilt <= 10 ? Math.round(70 - (shoulderTilt-5) * 6) :
                Math.round(Math.max(0, 40 - (shoulderTilt-10) * 4));
            // 2. 骨盤の左右バランス（正面と同じ）
            const hipDx = rh.x - lh.x;
            const hipDy = rh.y - lh.y;
            const hipAngle = Math.abs(Math.atan2(hipDy, hipDx) * (180/Math.PI));
            const hipTilt = Math.abs(hipAngle - 180);
            const hipScore =
                hipTilt <= 2 ? Math.round(100 - hipTilt * 5) :
                hipTilt <= 5 ? Math.round(90 - (hipTilt-2) * 6.7) :
                hipTilt <= 10 ? Math.round(70 - (hipTilt-5) * 6) :
                Math.round(Math.max(0, 40 - (hipTilt-10) * 4));
            // 3. 脊柱の左右偏位（肩幅基準で正規化）
            const spineDeviation = (function(){
                if (!nose || nose.visibility < 0.5) return 0;
                const vx = sMid.x - hMid.x, vy = sMid.y - hMid.y;
                const len = Math.sqrt(vx*vx + vy*vy);
                if (len < 0.001) return 0;
                const hx = nose.x - sMid.x, hy = nose.y - sMid.y;
                const cross = (vx * hy - vy * hx) / len;
                return (Math.abs(cross) / refLen) * 6; // 肩幅基準で正規化
            })();
            const spineScore =
                spineDeviation <= 1 ? Math.round(100 - spineDeviation * 5) :
                spineDeviation <= 2.5 ? Math.round(95 - (spineDeviation-1) * 10) :
                spineDeviation <= 5 ? Math.round(80 - (spineDeviation-2.5) * 12) :
                Math.round(Math.max(0, 50 - (spineDeviation-5) * 6));
            // 4. 体幹の左右傾斜（肩幅基準で正規化）
            const trunkLateral = (Math.abs(sMid.x - hMid.x) / refLen) * 6;
            const trunkScore =
                trunkLateral <= 1.5 ? Math.round(100 - trunkLateral * 6.7) :
                trunkLateral <= 3 ? Math.round(90 - (trunkLateral-1.5) * 13.3) :
                trunkLateral <= 5 ? Math.round(70 - (trunkLateral-3) * 15) :
                Math.round(Math.max(0, 40 - (trunkLateral-5) * 8));
            // cm推定: 肩幅基準で実寸換算

        function postureAnalyzeSide(lm){

            // A4: 肩-腰間距離を基準長として正規化（側面）

            // 3. 骨盤前後傾（肩-腰-膝の角度）
            const hipAngle = postureCalcAngle(sh, hip, knee);

                    }
                },
            ]};
        }
        // 座位側面の姿勢分析
        function postureAnalyzeSeated(lm){

            // A4: 肩-腰間距離を基準長として正規化（座位）

                estimatedCVA >= 40 ? Math.round(35 + (estimatedCVA-40)*5) :
                Math.round(Math.max(0, estimatedCVA * 0.88));

            const shAngle = postureCalcAngle(ear, sh, hip);
            const shoulderScore =
                shAngle >= 155 ? Math.round(Math.min(100, 85 + (shAngle-155)*3)) :
                shAngle >= 145 ? Math.round(60 + (shAngle-145)*2.5) :
                shAngle >= 135 ? Math.round(35 + (shAngle-135)*2.5) :
                Math.round(Math.max(0, shAngle * 0.26));
            // A4: 体幹の傾き（肩-腰基準で正規化）
            const trunkTilt = (Math.abs(sh.x - hip.x) / refLenSeated) * 6;
            const trunkScore =
                trunkTilt <= 2 ? Math.round(100 - trunkTilt * 5) :
                trunkTilt <= 4 ? Math.round(90 - (trunkTilt-2) * 10) :
                trunkTilt <= 7 ? Math.round(70 - (trunkTilt-4) * 10) :

            // A4: 座位姿勢バランス（肩-腰基準で正規化）

        // A3: 信頼度が極低（<0.5）の項目は除外して総合スコアを算出
        function postureGetTotal(a){
            const valid = a.items.filter(i => i.confidence == null || i.confidence >= 0.5);

        // Canvas上に骨格を描画する関数
        function postureDrawSkeletonOnCanvas(ctx, w, h, landmarks, analysis, viewMode) {
            if (!landmarks) return;
            ctx.lineCap = 'round';
            const L = POSTURE_LM;
            const lineW = Math.max(2, Math.round(w / 200));
            const r = Math.max(4, Math.round(w / 120));

            if (viewMode === 'back') {
                // === 背面ビュー: 三角形パターン + 脊柱ライン ===
                const ls = landmarks[L.LEFT_SHOULDER], rs = landmarks[L.RIGHT_SHOULDER];
                const lh = landmarks[L.LEFT_HIP], rh = landmarks[L.RIGHT_HIP];
                const nose = landmarks[L.NOSE];
                if (!ls || !rs || !lh || !rh) return;
                const sm = postureMid(ls, rs);
                const hm = postureMid(lh, rh);

                ctx.strokeStyle = 'rgba(15,110,86,0.85)';
                ctx.lineWidth = lineW;

                // 肩の三角形: 左肩→肩中点→右肩→左肩
                ctx.beginPath();
                ctx.moveTo(ls.x * w, ls.y * h);
                ctx.lineTo(sm.x * w, sm.y * h);
                ctx.lineTo(rs.x * w, rs.y * h);
                ctx.stroke();
                // 肩中点から左右肩への補助線（三角形の底辺）
                ctx.beginPath();
                ctx.moveTo(ls.x * w, ls.y * h);
                ctx.lineTo(rs.x * w, rs.y * h);
                ctx.stroke();

                // 骨盤の三角形: 左腰→腰中点→右腰→左腰
                ctx.beginPath();
                ctx.moveTo(lh.x * w, lh.y * h);
                ctx.lineTo(hm.x * w, hm.y * h);
                ctx.lineTo(rh.x * w, rh.y * h);
                ctx.stroke();
                // 骨盤三角形の底辺
                ctx.beginPath();
                ctx.moveTo(lh.x * w, lh.y * h);
                ctx.lineTo(rh.x * w, rh.y * h);
                ctx.stroke();

                // 脊柱ライン: 頭頂→肩中点→腰中点（実線）
                ctx.strokeStyle = 'rgba(15,110,86,0.9)';
                ctx.lineWidth = Math.max(2.5, Math.round(w / 180));
                ctx.beginPath();
                if (nose && nose.visibility >= 0.5) {
                    ctx.moveTo(nose.x * w, nose.y * h);
                    ctx.lineTo(sm.x * w, sm.y * h);
                } else {
                    ctx.moveTo(sm.x * w, sm.y * h);
                }
                ctx.lineTo(hm.x * w, hm.y * h);
                ctx.stroke();

                // 関節点: 5つのランドマーク + 肩中点・腰中点
                const allPts = [];
                if (nose && nose.visibility >= 0.5) allPts.push({ x: nose.x, y: nose.y });
                if (ls.visibility >= 0.5) allPts.push({ x: ls.x, y: ls.y });
                if (rs.visibility >= 0.5) allPts.push({ x: rs.x, y: rs.y });
                if (lh.visibility >= 0.5) allPts.push({ x: lh.x, y: lh.y });
                if (rh.visibility >= 0.5) allPts.push({ x: rh.x, y: rh.y });
                // 中点も描画
                allPts.push({ x: sm.x, y: sm.y });
                allPts.push({ x: hm.x, y: hm.y });

                allPts.forEach(p => {
                    ctx.fillStyle = '#0F6E56';
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = Math.max(1.5, Math.round(w / 400));
                    ctx.beginPath();
                    ctx.arc(p.x * w, p.y * h, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                });
                return; // back専用描画完了
            }

            // === front / side / seated ビュー（既存ロジック） ===
            const conns = viewMode === 'front' ? [[11,12],[11,23],[12,24],[23,24]]
                : viewMode === 'side' ? [[11,23],[23,25],[25,27]]
                : [[11,23],[11,13]];
            conns.forEach(([a,b]) => {
                const la = landmarks[a], lb = landmarks[b];
                if (!la || !lb || la.visibility < 0.5 || lb.visibility < 0.5) return;
                ctx.strokeStyle = 'rgba(15,110,86,0.8)';
                ctx.lineWidth = lineW;
                ctx.beginPath();
                ctx.moveTo(la.x * w, la.y * h);
                ctx.lineTo(lb.x * w, lb.y * h);
                ctx.stroke();
            });
            // 関節点
            const pts = viewMode === 'front' ? [L.NOSE, L.LEFT_SHOULDER, L.RIGHT_SHOULDER, L.LEFT_HIP, L.RIGHT_HIP]
                : viewMode === 'side' ? [L.LEFT_EAR, L.LEFT_SHOULDER, L.LEFT_HIP, L.LEFT_KNEE, L.LEFT_ANKLE]
                : [L.NOSE, L.LEFT_EAR, L.LEFT_SHOULDER, L.LEFT_HIP, L.LEFT_ELBOW];
            pts.forEach(idx => {
                const l = landmarks[idx];
                if (!l || l.visibility < 0.5) return;
                ctx.fillStyle = '#0F6E56';
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = Math.max(1.5, Math.round(w / 400));
                ctx.beginPath();
                ctx.arc(l.x * w, l.y * h, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });
            // 体軸（front のみ破線）
            if (viewMode === 'front') {
                const ls = landmarks[11], rs = landmarks[12], lh = landmarks[23], rh = landmarks[24];
                if (ls && rs && lh && rh) {
                    const sm = postureMid(ls, rs), hm = postureMid(lh, rh);
                    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                    ctx.lineWidth = Math.max(2, Math.round(w / 250));
                    ctx.setLineDash([6, 4]);
                    ctx.beginPath();
                    ctx.moveTo(sm.x * w, sm.y * h);
                    ctx.lineTo(hm.x * w, hm.y * h);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
        }

        // Canvas上にスコア情報を部位別に描画する関数
        function postureDrawScoreOnCanvas(ctx, w, h, analysis, viewMode, landmarks) {
            if (!analysis || !landmarks) return;
            const total = postureGetTotal(analysis);
            if (total === null) return;
            const scale = Math.max(1, w / 400);
            const L = POSTURE_LM;
            // 各項目の表示位置をランドマーク座標から算出
            const getItemPos = (item) => {
                const ls = landmarks[L.LEFT_SHOULDER], rs = landmarks[L.RIGHT_SHOULDER];
                const lh = landmarks[L.LEFT_HIP], rh = landmarks[L.RIGHT_HIP];
                const nose = landmarks[L.NOSE], ear = landmarks[L.LEFT_EAR];
                const knee = landmarks[L.LEFT_KNEE];
                const sh = landmarks[L.LEFT_SHOULDER], hip = landmarks[L.LEFT_HIP];
                if (viewMode === 'front') {
                    if (item.key === 'shoulder' && ls && rs) return { x: (ls.x+rs.x)/2, y: Math.min(ls.y,rs.y) - 0.035, align: 'center' };
                    if (item.key === 'hip' && lh && rh) return { x: (lh.x+rh.x)/2, y: Math.min(lh.y,rh.y) - 0.025, align: 'center' };
                    if (item.key === 'head' && nose) return { x: nose.x, y: nose.y - 0.045, align: 'center' };
                    if (item.key === 'center' && ls && rs && lh && rh) { const sm=postureMid(ls,rs), hm=postureMid(lh,rh); return { x: (sm.x+hm.x)/2+0.13, y: (sm.y+hm.y)/2, align: 'left' }; }
                } else if (viewMode === 'back') {
                    if (item.key === 'shoulder' && ls && rs) return { x: (ls.x+rs.x)/2, y: Math.min(ls.y,rs.y) - 0.035, align: 'center' };
                    if (item.key === 'hip' && lh && rh) return { x: (lh.x+rh.x)/2, y: Math.min(lh.y,rh.y) - 0.025, align: 'center' };
                    if (item.key === 'spine' && nose && ls && rs) { const sm=postureMid(ls,rs); return { x: (nose.x+sm.x)/2+0.13, y: (nose.y+sm.y)/2, align: 'left' }; }
                    if (item.key === 'trunk' && ls && rs && lh && rh) { const sm=postureMid(ls,rs), hm=postureMid(lh,rh); return { x: (sm.x+hm.x)/2+0.13, y: (sm.y+hm.y)/2, align: 'left' }; }
                } else if (viewMode === 'side') {
                    if (item.key === 'head' && ear) return { x: ear.x, y: ear.y - 0.045, align: 'center' };
                    if (item.key === 'shoulder' && sh) return { x: sh.x + 0.09, y: sh.y, align: 'left' };
                    if (item.key === 'hip' && hip) return { x: hip.x + 0.09, y: hip.y, align: 'left' };
                    if (item.key === 'knee' && knee) return { x: knee.x + 0.09, y: knee.y, align: 'left' };
                } else {
                    if (item.key === 'head' && ear) return { x: ear.x, y: ear.y - 0.045, align: 'center' };
                    if (item.key === 'shoulder' && sh) return { x: sh.x + 0.09, y: sh.y, align: 'left' };
                    if (item.key === 'trunk' && sh && hip) return { x: (sh.x+hip.x)/2+0.11, y: (sh.y+hip.y)/2, align: 'left' };
                    if (item.key === 'posture' && hip) return { x: hip.x + 0.09, y: hip.y, align: 'left' };
                }
                return null;
            };
            const pad = Math.round(8 * scale);
            // 総合スコアバッジ（左上）
            const badgeW = Math.round(w * 0.3);
            const badgeH = Math.round(28 * scale);
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            const cr = Math.round(6 * scale);
            ctx.beginPath();
            ctx.moveTo(pad+cr, pad); ctx.lineTo(pad+badgeW-cr, pad); ctx.quadraticCurveTo(pad+badgeW, pad, pad+badgeW, pad+cr);
            ctx.lineTo(pad+badgeW, pad+badgeH-cr); ctx.quadraticCurveTo(pad+badgeW, pad+badgeH, pad+badgeW-cr, pad+badgeH);
            ctx.lineTo(pad+cr, pad+badgeH); ctx.quadraticCurveTo(pad, pad+badgeH, pad, pad+badgeH-cr);
            ctx.lineTo(pad, pad+cr); ctx.quadraticCurveTo(pad, pad, pad+cr, pad);
            ctx.fill();
            const circleR = Math.round(10 * scale);
            const cx = pad + pad + circleR;
            const cy = pad + badgeH / 2;
            ctx.beginPath(); ctx.arc(cx, cy, circleR, 0, Math.PI*2);
            ctx.strokeStyle = postureScoreColor(total); ctx.lineWidth = Math.round(2 * scale); ctx.stroke();
            ctx.fillStyle = postureScoreColor(total);
            ctx.font = `bold ${Math.round(10*scale)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(total, cx, cy);
            ctx.textAlign = 'left';
            ctx.fillStyle = postureScoreColor(total);
            ctx.font = `bold ${Math.round(8*scale)}px sans-serif`;
            ctx.fillText(postureScoreLabel(total), cx + circleR + Math.round(4*scale), cy - Math.round(4*scale));
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = `${Math.round(6*scale)}px sans-serif`;
            const viewLabel = viewMode==='front'?'正面':viewMode==='back'?'背面':viewMode==='seated'?'座位':'側面';
            ctx.fillText(viewLabel, cx + circleR + Math.round(4*scale), cy + Math.round(6*scale));
            // 各部位にラベル描画
            analysis.items.forEach(item => {
                const isLow = item.confidence != null && item.confidence < 0.5;
                if (isLow) return;
                const pos = getItemPos(item);
                if (!pos) return;
                const px = pos.x * w;
                const py = pos.y * h;
                const color = postureScoreColor(item.score);
                const labelText = item.label;
                const scoreText = String(item.score);
                const detailText = item.value + (item.valueCm ? ' / ' + item.valueCm : '');
                const fontLabel = Math.round(7 * scale);
                const fontScore = Math.round(10 * scale);
                const fontDetail = Math.round(6 * scale);
                const borderW = Math.round(3 * scale);
                ctx.font = `${fontLabel}px sans-serif`;
                const labelW = ctx.measureText(labelText).width;
                ctx.font = `bold ${fontScore}px sans-serif`;
                const scoreW = ctx.measureText(scoreText).width;
                ctx.font = `${fontDetail}px sans-serif`;
                const detailW = ctx.measureText(detailText).width;
                const boxW = Math.max(labelW + scoreW + Math.round(8*scale), detailW) + Math.round(12*scale) + borderW;
                const boxH = Math.round(22 * scale);
                const bx = pos.align === 'center' ? px - boxW/2 : px;
                const by = pos.align === 'center' ? py - boxH : py - boxH/2;
                // 背景
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.beginPath();
                const r = Math.round(4*scale);
                ctx.moveTo(bx+borderW+r, by); ctx.lineTo(bx+boxW-r, by); ctx.quadraticCurveTo(bx+boxW, by, bx+boxW, by+r);
                ctx.lineTo(bx+boxW, by+boxH-r); ctx.quadraticCurveTo(bx+boxW, by+boxH, bx+boxW-r, by+boxH);
                ctx.lineTo(bx+borderW+r, by+boxH); ctx.quadraticCurveTo(bx+borderW, by+boxH, bx+borderW, by+boxH-r);
                ctx.lineTo(bx+borderW, by+r); ctx.quadraticCurveTo(bx+borderW, by, bx+borderW+r, by);
                ctx.fill();
                // 左ボーダー
                ctx.fillStyle = color;
                ctx.fillRect(bx, by, borderW, boxH);
                // ラベル＋スコア
                const tx = bx + borderW + Math.round(5*scale);
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.font = `${fontLabel}px sans-serif`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                ctx.fillText(labelText, tx, by + boxH * 0.32);
                ctx.fillStyle = color;
                ctx.font = `bold ${fontScore}px sans-serif`; ctx.textAlign = 'left';
                ctx.fillText(scoreText, tx + labelW + Math.round(4*scale), by + boxH * 0.32);
                // 詳細
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = `${fontDetail}px sans-serif`; ctx.textAlign = 'left';
                ctx.fillText(detailText, tx, by + boxH * 0.72);
            });
        }

        // 写真+骨格を合成した画像を生成
        function postureComposeImage(imageDataUrl, landmarks, analysis, viewMode, drawScore) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    try {
                        const c = document.createElement('canvas');
                        c.width = img.width; c.height = img.height;
                        const ctx = c.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        postureDrawSkeletonOnCanvas(ctx, img.width, img.height, landmarks, analysis, viewMode);
                        if (drawScore) postureDrawScoreOnCanvas(ctx, img.width, img.height, analysis, viewMode, landmarks);
                        resolve(c.toDataURL('image/jpeg', 0.92));
                    } catch (e) { reject(e); }
                };
                img.onerror = () => reject(new Error('画像の読み込みに失敗'));
                img.src = imageDataUrl;
            });
        }

        // ビフォーアフター比較画像を生成（横並び）
        function postureCreateComparisonImage(beforeDataUrl, afterDataUrl, viewLabel) {
            return new Promise((resolve, reject) => {
                const imgB = new Image();
                const imgA = new Image();
                let loaded = 0;
                let failed = false;
                const onError = () => { if (!failed) { failed = true; reject(new Error('比較画像の読み込みに失敗')); } };
                const onLoad = () => {
                    if (failed) return;
                    loaded++;
                    if (loaded < 2) return;
                    try {
                        // 両画像のアスペクト比を合わせて横��び
                        const maxH = Math.max(imgB.height, imgA.height);
                        const wB = Math.round(imgB.width * (maxH / imgB.height));
                        const wA = Math.round(imgA.width * (maxH / imgA.height));
                        const gap = 4;
                        const headerH = 48;
                        const labelH = 36;
                        const totalW = wB + gap + wA;
                        const totalH = headerH + maxH + labelH;
                        const c = document.createElement('canvas');
                        c.width = totalW; c.height = totalH;
                        const ctx = c.getContext('2d');
                        // 背景
                        ctx.fillStyle = '#04342C';
                        ctx.fillRect(0, 0, totalW, totalH);
                        // ヘッダー
                        ctx.fillStyle = '#5DCAA5';
                        ctx.font = `bold ${Math.round(headerH * 0.5)}px sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.fillText(`${viewLabel} ビフォーアフター比較`, totalW / 2, headerH * 0.7);
                        // Before画像
                        ctx.drawImage(imgB, 0, headerH, wB, maxH);
                        // After画像
                        ctx.drawImage(imgA, wB + gap, headerH, wA, maxH);
                        // ラベル
                        ctx.fillStyle = 'rgba(0,0,0,0.6)';
                        ctx.fillRect(0, headerH + maxH, totalW, labelH);
                        ctx.fillStyle = '#ffffff';
                        ctx.font = `bold ${Math.round(labelH * 0.55)}px sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.fillText('BEFORE', wB / 2, headerH + maxH + labelH * 0.7);
                        ctx.fillText('AFTER', wB + gap + wA / 2, headerH + maxH + labelH * 0.7);
                        resolve(c.toDataURL('image/jpeg', 0.90));
                    } catch (e) { if (!failed) { failed = true; reject(e); } }
                };
                imgB.onload = onLoad;
                imgA.onload = onLoad;
                imgB.onerror = onError;
                imgA.onerror = onError;
                imgB.src = beforeDataUrl;
                imgA.src = afterDataUrl;
            });
        }

        const PostureAnalysisView = ({ lineChatHook }) => {

            const LM_BUFFER_SIZE = 5;

            const stopCam = useCallback(() => {
                if (animRef.current) cancelAnimationFrame(animRef.current);

                if (videoRef.current) videoRef.current.srcObject = null;

                if (orientationRef.current) {
                    window.removeEventListener('deviceorientation', orientationRef.current);
                    window.removeEventListener('deviceorientationabsolute', orientationRef.current);
                    orientationRef.current = null;

            }, []);

            const startCamera = useCallback(async () => {
                setPhase('loading'); setErrorMsg(''); setAnalysis(null); setLandmarks(null); lmBufferRef.current = [];
                setCapturedImage(null);
                // iOS: ジャイロのパーミッション要求はユーザージェスチャの同期コンテキスト内で実行する必要あり（awaitの前）
                let orientationPermitted = true;
                try {
                    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                        const perm = await DeviceOrientationEvent.requestPermission();
                        orientationPermitted = (perm === 'granted');
                    }
                } catch (oe) { orientationPermitted = false; }
                try {
                    // 超広角レンズを優先的に選択し、zoom を最小にして最大画角を確保
                    const s = await navigator.mediaDevices.getUserMedia({
                        video: { width:{ideal:1280}, height:{ideal:960}, facingMode:{ideal:'environment'},
                            zoom: {ideal: 0.5},
                            advanced: [{ zoom: {min: 0.5, ideal: 0.5} }] }
                    });
                    // zoom を最小値に強制設定（対応デバイスのみ）
                    const track = s.getVideoTracks()[0];
                    if (track) {
                        try {
                            const caps = track.getCapabilities ? track.getCapabilities() : {};
                            if (caps.zoom) { await track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] }); }
                        } catch(e) { /* zoom 非対応デバイスは無視 */ }
                    }
                    streamRef.current = s;
                    const v = videoRef.current;
                    v.srcObject = s; await v.play();

                    if (!window.Pose) {
                        await new Promise((res, rej) => {
                            const sc = document.createElement('script');
                            sc.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js';
                            sc.onload = res; sc.onerror = () => rej(new Error('MediaPipe読み込み失敗'));
                            document.head.appendChild(sc);
                        });
                        await new Promise(r => setTimeout(r, 500));
                    }
                    if (!poseRef.current) {
                        const pose = new window.Pose({
                            locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${f}`,
                        });
                        pose.setOptions({ modelComplexity:2, smoothLandmarks:true, enableSegmentation:false,
                            minDetectionConfidence:0.7, minTrackingConfidence:0.7 });
                        pose.onResults(r => {
                            if (r.poseLandmarks) {
                                // A2: バッファに追加（リアルタイム表示用にそのままsetLandmarks）
                                lmBufferRef.current.push(r.poseLandmarks.map(lm => ({x:lm.x, y:lm.y, z:lm.z, visibility:lm.visibility})));
                                if (lmBufferRef.current.length > LM_BUFFER_SIZE) lmBufferRef.current.shift();
                                setLandmarks(r.poseLandmarks);
                            }
                        });
                        await pose.initialize();
                        poseRef.current = pose;
                    }
                    setPhase('live');
                    const detect = async () => {
                        if (!streamRef.current) return;
                        try { await poseRef.current.send({ image: v }); } catch(e){}
                        animRef.current = requestAnimationFrame(detect);

                    detect();
                    // カメラ傾きセンサーを起動（パーミッションは事前取得済み）
                    if (orientationPermitted) {
                        const onOrientation = (e) => {
                            if (e.beta == null && e.gamma == null) return;
                            setCameraTilt({ beta: Math.round(e.beta ?? 0), gamma: Math.round(e.gamma ?? 0) });
                        };
                        orientationRef.current = onOrientation;
                        window.addEventListener('deviceorientation', onOrientation);
                        window.addEventListener('deviceorientationabsolute', onOrientation);
                    }
                } catch (e) {
                    setPhase('idle'); setErrorMsg(e.message || 'カメラ起動失敗');
                }
            }, []);

            // A2: 複数フレーム平均化 — バッファ内のランドマークを平均化
            const getAveragedLandmarks = useCallback(() => {
                const buf = lmBufferRef.current;
                if (buf.length === 0) return null;
                if (buf.length === 1) return buf[0];
                const numLm = buf[0].length;
                const averaged = [];
                for (let i = 0; i < numLm; i++) {
                    let sx=0, sy=0, sz=0, sv=0, count=0;
                    // 外れ値除去: visibilityが最低のフレームを除外（3フレーム以上ある場合）
                    let frames = buf;
                    if (buf.length >= 3) {
                        const sorted = [...buf].sort((a,b) => a[i].visibility - b[i].visibility);
                        frames = sorted.slice(1); // 最低visibility除外
                    }
                    for (const f of frames) {
                        sx += f[i].x; sy += f[i].y; sz += f[i].z; sv += f[i].visibility; count++;
                    }
                    averaged.push({ x: sx/count, y: sy/count, z: sz/count, visibility: sv/count });
                }
                return averaged;
            }, []);

            const capture = useCallback(() => {
                const v = videoRef.current;
                const c = document.createElement('canvas');
                c.width = v.videoWidth; c.height = v.videoHeight;
                c.getContext('2d').drawImage(v, 0, 0);
                const imgData = c.toDataURL('image/jpeg', 0.92);
                setCapturedImage(imgData);
                // A2: 平均化したランドマークで確定
                const avgLm = getAveragedLandmarks();
                if (avgLm) setLandmarks(avgLm);
                stopCam();
                setPhase('captured');
            }, [stopCam, getAveragedLandmarks]);

            // 手書き注釈: 描画関数
            const redrawPaths = useCallback((paths) => {
                const canvas = drawCanvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                paths.forEach(path => {
                    if (path.points.length < 2) return;
                    ctx.beginPath();
                    ctx.strokeStyle = path.color;
                    ctx.lineWidth = path.width;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.moveTo(path.points[0].x, path.points[0].y);
                    for (let i = 1; i < path.points.length; i++) ctx.lineTo(path.points[i].x, path.points[i].y);
                    ctx.stroke();
                });
            }, []);

            const getDrawPos = useCallback((e) => {
                const canvas = drawCanvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches ? e.touches[0] : e;
                return {
                    x: (touch.clientX - rect.left) * (canvas.width / rect.width),
                    y: (touch.clientY - rect.top) * (canvas.height / rect.height),
                };
            }, []);

            const onDrawStart = useCallback((e) => {
                e.preventDefault();

            }, [getDrawPos, drawColor, drawLineWidth]);

            const onDrawMove = useCallback((e) => {

                if (!isDrawing.current) return;

                setDrawPaths(prev => {
                    const updated = [...prev];
                    const last = { ...updated[updated.length - 1] };
                    last.points = [...last.points, pos];
                    updated[updated.length - 1] = last;
                    redrawPaths(updated);
                    return updated;
                });
            }, [getDrawPos, redrawPaths]);

            const onDrawEnd = useCallback(() => { isDrawing.current = false; }, []);

            const undoDraw = useCallback(() => {

            useEffect(() => {

            // ビュー別の表示用接続線（分析対象のみ）
            const viewConnections = useMemo(() => {
                if (viewMode === 'front') return [[11,12],[11,23],[12,24],[23,24]]; // 肩ライン,体幹,腰ライン

            const viewPoints = useMemo(() => {

            const [vpSize, setVpSize] = useState({ w: 0, h: 0 });
            useEffect(() => {

            }, []);

            useEffect(() => {
                if (!landmarks || !svgRef.current || !vpRef.current) return;
                const svg = svgRef.current;
                const w = vpRef.current.clientWidth, h = vpRef.current.clientHeight;

                let html = '';

                if (viewMode === 'back') {

                    const ls = landmarks[11], rs = landmarks[12], lh = landmarks[23], rh = landmarks[24], nose = landmarks[0];
                    if (ls && rs && lh && rh) {
                        const sm = postureMid(ls, rs), hm = postureMid(lh, rh);
                        const lineColor = 'rgba(15,110,86,0.85)';
                        // 肩の三角形

                        html += `<line x1="${rs.x*w}" y1="${rs.y*h}" x2="${sm.x*w}" y2="${sm.y*h}" stroke="${lineColor}" stroke-width="2.5" stroke-linecap="round"/>`;
                        html += `<line x1="${ls.x*w}" y1="${ls.y*h}" x2="${rs.x*w}" y2="${rs.y*h}" stroke="${lineColor}" stroke-width="2.5" stroke-linecap="round"/>`;
                        // 骨盤の三角形
                        html += `<line x1="${lh.x*w}" y1="${lh.y*h}" x2="${hm.x*w}" y2="${hm.y*h}" stroke="${lineColor}" stroke-width="2.5" stroke-linecap="round"/>`;
                        html += `<line x1="${rh.x*w}" y1="${rh.y*h}" x2="${hm.x*w}" y2="${hm.y*h}" stroke="${lineColor}" stroke-width="2.5" stroke-linecap="round"/>`;
                        html += `<line x1="${lh.x*w}" y1="${lh.y*h}" x2="${rh.x*w}" y2="${rh.y*h}" stroke="${lineColor}" stroke-width="2.5" stroke-linecap="round"/>`;
                        // 脊柱ライン
                        const spineColor = 'rgba(15,110,86,0.9)';
                        if (nose && nose.visibility >= 0.5) {
                            html += `<line x1="${nose.x*w}" y1="${nose.y*h}" x2="${sm.x*w}" y2="${sm.y*h}" stroke="${spineColor}" stroke-width="3" stroke-linecap="round"/>`;
                        }
                        html += `<line x1="${sm.x*w}" y1="${sm.y*h}" x2="${hm.x*w}" y2="${hm.y*h}" stroke="${spineColor}" stroke-width="3" stroke-linecap="round"/>`;
                        // 関節点
                        const pts = [];
                        if (nose && nose.visibility >= 0.5) pts.push({x:nose.x,y:nose.y});
                        if (ls.visibility >= 0.5) pts.push({x:ls.x,y:ls.y});
                        if (rs.visibility >= 0.5) pts.push({x:rs.x,y:rs.y});
                        if (lh.visibility >= 0.5) pts.push({x:lh.x,y:lh.y});
                        if (rh.visibility >= 0.5) pts.push({x:rh.x,y:rh.y});
                        pts.push({x:sm.x,y:sm.y}); // 肩中点
                        pts.push({x:hm.x,y:hm.y}); // 腰中点
                        pts.forEach(p => {
                            html += `<circle cx="${p.x*w}" cy="${p.y*h}" r="5" fill="#0F6E56" stroke="#fff" stroke-width="1.5"/>`;
                        });
                    }
                } else {
                    // === front / side / seated ===
                    viewConnections.forEach(([a,b]) => {
                        const la = landmarks[a], lb = landmarks[b];
                        if (!la || !lb || la.visibility < 0.5 || lb.visibility < 0.5) return;
                        const color = phase === 'captured' && analysis ? postureScoreColor(
                            (analysis.items.find(i => {
                                if (viewMode==='front') { if(i.key==='shoulder'&&(a===11||b===12)) return true; if(i.key==='hip'&&(a===23||b===24)) return true; }
                                else { if(i.key==='shoulder'&&a===11&&b===23) return true; if(i.key==='hip'&&a===23&&b===25) return true; if(i.key==='knee'&&a===25&&b===27) return true; }
                                return false;
                            }) || {score:80}).score
                        ) : 'rgba(15,110,86,0.7)';
                        html += `<line x1="${la.x*w}" y1="${la.y*h}" x2="${lb.x*w}" y2="${lb.y*h}" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/>`;
                    });
                    viewPoints.forEach(idx => {
                        const l = landmarks[idx];
                        if (!l || l.visibility < 0.5) return;
                        html += `<circle cx="${l.x*w}" cy="${l.y*h}" r="5" fill="#0F6E56" stroke="#fff" stroke-width="1.5"/>`;
                    });
                    // 体軸（front のみ破線）
                    if (viewMode === 'front') {
                        const ls=landmarks[11],rs=landmarks[12],lh=landmarks[23],rh=landmarks[24];
                        if(ls&&rs&&lh&&rh){
                            const sm=postureMid(ls,rs), hm=postureMid(lh,rh);
                            html += `<line x1="${sm.x*w}" y1="${sm.y*h}" x2="${hm.x*w}" y2="${hm.y*h}" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-dasharray="6 4"/>`;
                        }
                    }
                }
                svg.innerHTML = html;
            }, [landmarks, analysis, phase, viewMode, overlayOn, viewConnections, viewPoints, vpSize]);

            // 比較データの有効ペア判定
            const hasFrontPair = compData.before_front && compData.after_front;
            const hasBackPair = compData.before_back && compData.after_back;
            const hasSidePair = compData.before_side && compData.after_side;
            const hasSeatedPair = compData.before_seated && compData.after_seated;
            const hasAnyPair = hasFrontPair || hasBackPair || hasSidePair || hasSeatedPair;

            // 分析に使うランドマークインデックス（viewMode別）
            const editableIndices = useMemo(() => {
                const L = POSTURE_LM;
                if (viewMode === 'front') return [
                    {idx:L.NOSE, label:'鼻'},
                    {idx:L.LEFT_SHOULDER, label:'左肩'},
                    {idx:L.RIGHT_SHOULDER, label:'右肩'},
                    {idx:L.LEFT_HIP, label:'左腰'},
                    {idx:L.RIGHT_HIP, label:'右腰'},
                ];
                if (viewMode === 'back') return [
                    {idx:L.NOSE, label:'頭頂'},
                    {idx:L.LEFT_SHOULDER, label:'左肩'},
                    {idx:L.RIGHT_SHOULDER, label:'右肩'},
                    {idx:L.LEFT_HIP, label:'左腰'},
                    {idx:L.RIGHT_HIP, label:'右腰'},
                ];
                if (viewMode === 'side') return [
                    {idx:L.LEFT_EAR, label:'左耳'},
                    {idx:L.LEFT_SHOULDER, label:'左肩'},
                    {idx:L.LEFT_HIP, label:'大転子'},
                    {idx:L.LEFT_KNEE, label:'左膝'},
                    {idx:L.LEFT_ANKLE, label:'左足首'},
                ];
                // seated
                return [
                    {idx:L.NOSE, label:'鼻'},
                    {idx:L.LEFT_EAR, label:'左耳'},
                    {idx:L.LEFT_SHOULDER, label:'左肩'},
                    {idx:L.LEFT_HIP, label:'左腰'},
                    {idx:L.LEFT_ELBOW, label:'左肘'},
                ];
            }, [viewMode]);

            // ドラッグ操作でランドマーク位置を更新
            const getPointerPos = useCallback((e) => {
                const container = editContainerRef.current;
                if (!container) return null;
                const rect = container.getBoundingClientRect();
                const touch = e.touches ? e.touches[0] : e;
                const x = (touch.clientX - rect.left) / rect.width;
                const y = (touch.clientY - rect.top) / rect.height;
                return { x: Math.max(0, Math.min(1, x)), y: Math.max(0, Math.min(1, y)) };
            }, []);

            const handleEditPointerDown = useCallback((e, lmIdx) => {
                e.preventDefault(); e.stopPropagation();
                setDraggingIdx(lmIdx);
            }, []);

            const handleEditPointerMove = useCallback((e) => {
                if (draggingIdx === null || !landmarks) return;
                e.preventDefault();
                const pos = getPointerPos(e);
                if (!pos) return;
                const newLm = landmarks.map((lm, i) => i === draggingIdx ? { ...lm, x: pos.x, y: pos.y } : lm);
                setLandmarks(newLm);
                // リアルタイム再計算
                const a = viewMode === 'front' ? postureAnalyzeFront(newLm) : viewMode === 'seated' ? postureAnalyzeSeated(newLm) : postureAnalyzeSide(newLm);
                setAnalysis(a);
            }, [draggingIdx, landmarks, viewMode, getPointerPos]);

            const handleEditPointerUp = useCallback(() => {
                setDraggingIdx(null);
            }, []);

            // 編集モード開始・確定
            const startEdit = useCallback(() => { setEditMode(true); setOverlayOn(true); }, []);
            const confirmEdit = useCallback(() => { setEditMode(false); }, []);

            // Blob upload helper
            const uploadToBlob = useCallback(async (base64Data, fileName) => {
                try {
                    const resp = await fetch('/api/photos/upload', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ imageData: base64Data, fileName, folder: 'posture-comparison' }),
                    });
                    const result = await resp.json();
                    if (!resp.ok) throw new Error(result.message || 'アップロード失敗');
                    return result.url;
                } catch (e) {
                    // 以前は silent null を返して呼び出し側が気づけなかった。
                    // LINE 送信時に画像が欠落するなど重大な影響があるため明示的にトースト通知する。
                    console.error('Blob upload error:', e);
                    showToast('画像のアップロードに失敗しました: ' + (e.message || '通信エラー'), 'error');
                    return null;
                }
            }, []);

            // LINE送信
            const openLineModal = useCallback(() => {
                if (!lineChatHook || !lineChatHook.lineConfig?.configured) {
                    alert('LINE連携が設定されていません。設定画面からLINE APIを設定してください。'); return;
                }
                const allowedStores = lineChatHook.allowedLineStores || [];
                const isAllowed = (sid) => allowedStores.some(s => s.id === sid);
                if (lineChatHook.lineStoreId && isAllowed(lineChatHook.lineStoreId)) {
                    lineChatHook.fetchThreads(lineChatHook.lineStoreId);
                } else if (allowedStores.length > 0) {
                    const fs = allowedStores[0].id;
                    lineChatHook.setLineStoreId(fs); lineChatHook.fetchThreads(fs);
                }
                setLineSelectedUser(null); setLineSearchQuery(''); setLineSendStatus('');
                setLineModalOpen(true);
            }, [lineChatHook]);

            const handleLineSend = useCallback(async () => {
                if (!lineSelectedUser || !lineChatHook) return;
                setLineSendStatus('sending');
                try {
                    let sendOk = false;
                    if (hasAnyPair) {
                        // ビフォーアフター比較送信
                        let frontImageUrl = null, backImageUrl = null, sideImageUrl = null, seatedImageUrl = null;
                        try {
                            if (hasFrontPair) {
                                const bComp = await postureComposeImage(compData.before_front.image, compData.before_front.landmarks, compData.before_front.analysis, 'front', scoreOverlayOn);
                                const aComp = await postureComposeImage(compData.after_front.image, compData.after_front.landmarks, compData.after_front.analysis, 'front', scoreOverlayOn);
                                const compImg = await postureCreateComparisonImage(bComp, aComp, '正面');
                                frontImageUrl = await uploadToBlob(compImg, 'comparison_front_' + Date.now() + '.jpg');
                            }
                            if (hasBackPair) {
                                const bComp = await postureComposeImage(compData.before_back.image, compData.before_back.landmarks, compData.before_back.analysis, 'back', scoreOverlayOn);
                                const aComp = await postureComposeImage(compData.after_back.image, compData.after_back.landmarks, compData.after_back.analysis, 'back', scoreOverlayOn);
                                const compImg = await postureCreateComparisonImage(bComp, aComp, '背面');
                                backImageUrl = await uploadToBlob(compImg, 'comparison_back_' + Date.now() + '.jpg');
                            }
                            if (hasSidePair) {
                                const bComp = await postureComposeImage(compData.before_side.image, compData.before_side.landmarks, compData.before_side.analysis, 'side', scoreOverlayOn);
                                const aComp = await postureComposeImage(compData.after_side.image, compData.after_side.landmarks, compData.after_side.analysis, 'side', scoreOverlayOn);
                                const compImg = await postureCreateComparisonImage(bComp, aComp, '側面');
                                sideImageUrl = await uploadToBlob(compImg, 'comparison_side_' + Date.now() + '.jpg');
                            }
                            if (hasSeatedPair) {
                                const bComp = await postureComposeImage(compData.before_seated.image, compData.before_seated.landmarks, compData.before_seated.analysis, 'seated', scoreOverlayOn);
                                const aComp = await postureComposeImage(compData.after_seated.image, compData.after_seated.landmarks, compData.after_seated.analysis, 'seated', scoreOverlayOn);
                                const compImg = await postureCreateComparisonImage(bComp, aComp, '座位');
                                seatedImageUrl = await uploadToBlob(compImg, 'comparison_seated_' + Date.now() + '.jpg');
                            }
                        } catch (imgErr) {
                            console.warn('比較画像の生成に失敗（テキストのみ送信）:', imgErr);
                        }
                        const flexMsg = buildPostureComparisonFlexMessage({
                            customerName, visitDate, staffName,
                            frontBefore: compData.before_front, frontAfter: compData.after_front,
                            backBefore: compData.before_back, backAfter: compData.after_back,
                            sideBefore: compData.before_side, sideAfter: compData.after_side,
                            seatedBefore: compData.before_seated, seatedAfter: compData.after_seated,
                            frontImageUrl, backImageUrl, sideImageUrl, seatedImageUrl,
                        });
                        sendOk = await lineChatHook.sendFlexMessage(lineSelectedUser.userId, flexMsg);
                    } else if (analysis) {
                        // 通常の単発送信
                        const total = postureGetTotal(analysis);
                        const flexMsg = buildPostureFlexMessage({ customerName, visitDate, viewMode, analysis, totalScore: total, staffName });
                        sendOk = await lineChatHook.sendFlexMessage(lineSelectedUser.userId, flexMsg);
                    } else {
                        console.error('LINE送信エラー: 送信可能な分析データがありません', { flowPhase, hasAnyPair, analysis: !!analysis });
                    }
                    setLineSendStatus(sendOk ? 'sent' : 'error');
                    if (sendOk) {
                        setTimeout(() => { setLineModalOpen(false); setLineSendStatus(''); }, 2000);
                    }
                } catch (e) {
                    console.error('LINE送信エラー:', e);
                    setLineSendStatus('error');
                }
            }, [lineSelectedUser, lineChatHook, analysis, hasAnyPair, hasFrontPair, hasBackPair, hasSidePair, hasSeatedPair, compData, customerName, visitDate, viewMode, staffName, uploadToBlob, scoreOverlayOn]);

            // ビフォーアフター比較画像ダウンロード
            const [compDownloading, setCompDownloading] = useState(false);
            const [singleDownloading, setSingleDownloading] = useState(false);
            // base64 dataURL → File オブジェクト変換ヘルパー
            const dataUrlToFile = useCallback((dataUrl, fileName) => {
                const [header, b64] = dataUrl.split(',');
                const mime = header.match(/:(.*?);/)?.[1] || 'image/jpeg';
                const bin = atob(b64);
                const arr = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
                return new File([arr], fileName, { type: mime });
            }, []);

            // 単発キャプチャを端末に保存（写真+分析JSON）
            const downloadCurrentCapture = useCallback(async () => {
                if (!capturedImage || !analysis || !landmarks || singleDownloading) return;
                setSingleDownloading(true);
                try {
                    const viewLabel = viewMode === 'front' ? '正面' : viewMode === 'back' ? '背面' : viewMode === 'seated' ? '座位' : '側面';
                    const phaseLabel = flowPhase === 'after' ? 'After' : flowPhase === 'before' ? 'Before' : '分析';
                    const name = customerName ? customerName.replace(/\s+/g, '_') : 'posture';
                    const date = (visitDate || todayLocalYMD()).replace(/-/g, '');
                    const baseName = `Posture_${name}_${date}_${viewLabel}_${phaseLabel}`;

                    // 1. 合成画像（骨格+スコア）
                    let composed;
                    try {
                        composed = await postureComposeImage(capturedImage, landmarks, analysis, viewMode, scoreOverlayOn);
                    } catch (e) {
                        console.error('画像合成エラー:', e);
                        alert('画像の合成に失敗しました: ' + (e.message || e));
                        return;
                    }

                    // 2. 分析JSON
                    const analysisJson = JSON.stringify({
                        customerName, visitDate, staffName,
                        viewMode, viewLabel, flowPhase,
                        totalScore: postureGetTotal(analysis),
                        analysis,
                        exportedAt: new Date().toISOString()
                    }, null, 2);
                    const jsonBlob = new Blob([analysisJson], { type: 'application/json' });

                    // 3. iOS/Android: Web Share APIで写真アプリに保存（画像のみ）
                    // iOS Safari は navigator.share あっても canShare({files}) が
                    // false を返すケースがあるため、両方チェックしてフォールバック。
                    const ua = navigator.userAgent || '';
                    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
                    let shared = false;
                    let shareAttempted = false;
                    if (navigator.share && navigator.canShare) {
                        try {
                            const imageFile = dataUrlToFile(composed, baseName + '.jpg');
                            if (navigator.canShare({ files: [imageFile] })) {
                                shareAttempted = true;
                                await navigator.share({ files: [imageFile], title: baseName });
                                shared = true;
                                hapticSuccess();
                            }
                        } catch (e) {
                            if (e.name === 'AbortError') return; // ユーザーがキャンセル
                            console.warn('Web Share失敗、ダウンロードにフォールバック:', e);
                        }
                    }

                    // 4. フォールバック（PC or Web Share非対応）: 画像をダウンロードリンクで保存
                    if (!shared) {
                        const imgLink = document.createElement('a');
                        imgLink.download = baseName + '.jpg';
                        imgLink.href = composed;
                        document.body.appendChild(imgLink);
                        imgLink.click();
                        document.body.removeChild(imgLink);
                        // iOS ユーザーはダウンロード先が分かりにくいので誘導を表示
                        if (isIOS) {
                            showToast('「ファイル」アプリのダウンロードに保存されました', 'info', 4000);
                        } else if (!shareAttempted) {
                            showToast('画像をダウンロードしました', 'success', 2000);
                        }
                    }

                    // 5. JSONは常にダウンロードリンクで保存（Web Shareで送れない環境が多いため）
                    const jsonUrl = URL.createObjectURL(jsonBlob);
                    const jsonLink = document.createElement('a');
                    jsonLink.download = baseName + '.json';
                    jsonLink.href = jsonUrl;
                    document.body.appendChild(jsonLink);
                    jsonLink.click();
                    document.body.removeChild(jsonLink);
                    setTimeout(() => URL.revokeObjectURL(jsonUrl), 2000);
                } catch (e) {
                    console.error('保存エラー:', e);
                    alert('保存に失敗しました: ' + (e.message || e));
                } finally {
                    setSingleDownloading(false);
                }
            }, [capturedImage, analysis, landmarks, viewMode, flowPhase, customerName, visitDate, staffName, scoreOverlayOn, dataUrlToFile, singleDownloading]);

            const downloadComparisonImages = useCallback(async () => {
                if (!hasAnyPair || compDownloading) return;
                setCompDownloading(true);
                try {
                    const pairs = [];
                    if (hasFrontPair) pairs.push({ before: compData.before_front, after: compData.after_front, label: '正面', vm: 'front' });
                    if (hasBackPair) pairs.push({ before: compData.before_back, after: compData.after_back, label: '背面', vm: 'back' });
                    if (hasSidePair) pairs.push({ before: compData.before_side, after: compData.after_side, label: '側面', vm: 'side' });
                    if (hasSeatedPair) pairs.push({ before: compData.before_seated, after: compData.after_seated, label: '座位', vm: 'seated' });

                    const name = customerName ? customerName.replace(/\s+/g, '_') : 'posture';
                    const date = visitDate ? visitDate.replace(/-/g, '') : todayLocalYMD().replace(/-/g, '');
                    const files = [];
                    const analysisReport = { customerName, visitDate, staffName, pairs: [], exportedAt: new Date().toISOString() };

                    for (const p of pairs) {
                        const bComp = await postureComposeImage(p.before.image, p.before.landmarks, p.before.analysis, p.vm, scoreOverlayOn);
                        const aComp = await postureComposeImage(p.after.image, p.after.landmarks, p.after.analysis, p.vm, scoreOverlayOn);
                        const compImg = await postureCreateComparisonImage(bComp, aComp, p.label);
                        const fileName = `BeforeAfter_${name}_${date}_${p.label}.jpg`;
                        files.push({ dataUrl: compImg, fileName });
                        analysisReport.pairs.push({
                            viewMode: p.vm, viewLabel: p.label,
                            before: { totalScore: postureGetTotal(p.before.analysis), analysis: p.before.analysis },
                            after: { totalScore: postureGetTotal(p.after.analysis), analysis: p.after.analysis }
                        });
                    }

                    const jsonBlob = new Blob([JSON.stringify(analysisReport, null, 2)], { type: 'application/json' });
                    const jsonFileName = `BeforeAfter_${name}_${date}.json`;
                    const jsonFile = new File([jsonBlob], jsonFileName, { type: 'application/json' });

                    const ua2 = navigator.userAgent || '';
                    const isIOS2 = /iPad|iPhone|iPod/.test(ua2) && !window.MSStream;

                    // iOS/モバイル: Web Share APIで写真アプリに直接保存可能
                    if (navigator.share && navigator.canShare) {
                        const shareFiles = [...files.map(f => dataUrlToFile(f.dataUrl, f.fileName)), jsonFile];
                        const shareData = { files: shareFiles };
                        if (navigator.canShare(shareData)) {
                            await navigator.share(shareData);
                            hapticSuccess();
                            setCompDownloading(false);
                            return;
                        }
                        // JSONが共有不可な環境: 画像のみ
                        const imgOnlyData = { files: files.map(f => dataUrlToFile(f.dataUrl, f.fileName)) };
                        if (navigator.canShare(imgOnlyData)) {
                            await navigator.share(imgOnlyData);
                            hapticSuccess();
                            setCompDownloading(false);
                            return;
                        }
                    }
                    // フォールバック: 従来のダウンロード（PC等、または iOS Share 非対応）
                    for (const f of files) {
                        const link = document.createElement('a');
                        link.download = f.fileName;
                        link.href = f.dataUrl;
                        link.click();
                    }
                    const jsonUrl = URL.createObjectURL(jsonBlob);
                    const jsonLink = document.createElement('a');
                    jsonLink.download = jsonFileName;
                    jsonLink.href = jsonUrl;
                    jsonLink.click();
                    setTimeout(() => URL.revokeObjectURL(jsonUrl), 1000);
                    // iOS ユーザーはダウンロード先が分かりにくいので誘導
                    if (isIOS2) {
                        showToast('「ファイル」アプリのダウンロードに保存されました', 'info', 4000);
                    } else {
                        showToast(`${files.length + 1}件のファイルをダウンロードしました`, 'success', 2000);
                    }
                } catch (e) {
                    // ユーザーがShareシートをキャンセルした場合はAbortErrorになる（正常）
                    if (e.name !== 'AbortError') {
                        console.error('比較画像ダウンロードエラー:', e);
                        alert('画像の生成に失敗しました。');
                    }
                } finally {
                    setCompDownloading(false);
                }
            }, [hasAnyPair, hasFrontPair, hasBackPair, hasSidePair, hasSeatedPair, compData, customerName, visitDate, staffName, compDownloading, dataUrlToFile, scoreOverlayOn]);

            // B3: AIアドバイス生成
            const generateAdvice = useCallback(async () => {
                if (!analysis || aiAdviceLoading) return;
                setAiAdviceLoading(true); setAiAdviceError(''); setAiAdvice('');
                try {
                    const resp = await fetch('/api/claude/advice', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ analysisData: analysis, viewMode, customerName }),
                    });
                    if (!resp.ok) throw new Error(`API error: ${resp.status}`);
                    const data = await resp.json();
                    setAiAdvice(data.advice || '');
                } catch (e) {
                    console.error('AI advice error:', e);
                    setAiAdviceError('アドバイスの生成に失敗しました。');
                } finally {
                    setAiAdviceLoading(false);
                }
            }, [analysis, viewMode, customerName, aiAdviceLoading]);

            // ビュー切替時にアドバイスをリセット
            useEffect(() => { setAiAdvice(''); setAiAdviceError(''); }, [viewMode]);

            const total = analysis ? postureGetTotal(analysis) : null;

            return (
                <div className="h-[calc(100vh-3.5rem)] md:h-[calc(100vh-4rem)] overflow-y-auto" style={{background:'linear-gradient(135deg,#f8f7f4 0%,#f0efeb 100%)', WebkitOverflowScrolling:'touch'}}>
                    <div className="max-w-xl md:max-w-2xl lg:max-w-3xl mx-auto p-4 pb-24 space-y-4">
                        {/* Header */}
                        <div className="rounded-2xl p-5 text-white" style={{background:'linear-gradient(135deg,#085041 0%,#0F6E56 50%,#1D9E75 100%)'}}>
                            <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-xl bg-white/15 flex items-center justify-center">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                                        <path d="M12 2a4 4 0 014 4v1a4 4 0 01-8 0V6a4 4 0 014-4z"/><path d="M16 12v1a4 4 0 01-8 0v-1"/>
                                        <line x1="12" y1="17" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/>
                                    </svg>
                                </div>
