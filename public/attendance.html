                err => reject(new Error(err.code === 1 ? '位置情報の許可が必要です' : err.code === 2 ? '位置情報を取得できません' : '位置情報取得タイムアウト')),
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        });

        const calcDistanceM = (lat1, lng1, lat2, lng2) => {
            const R = 6371e3;
            const p = Math.PI / 180;
            const a = 0.5 - Math.cos((lat2 - lat1) * p) / 2 + Math.cos(lat1 * p) * Math.cos(lat2 * p) * (1 - Math.cos((lng2 - lng1) * p)) / 2;
            return R * 2 * Math.asin(Math.sqrt(a));
        };

        const ATTENDANCE_RADIUS_M = 300;

        // ============================================================
        // 勤怠管理 本体（本体 index.html から無改変で移植）
        // ============================================================
        const useAttendance = () => {
            const [records, setRecords] = useState([]);
            const [loading, setLoading] = useState(false);
            const [saving, setSaving] = useState(false);
            const [todayRecord, setTodayRecord] = useState(null);

            const fetchRecords = useCallback(async (params = {}) => {
                setLoading(true);
                try {
                    const q = {};
                    if (params.store) q.store = params.store;
                    if (params.month) q.month = params.month;
                    if (params.staffId) q.staffId = params.staffId;
                    if (params.date) q.date = params.date;
                    const data = await dbGet('attendance', q);
                    if (data && data.records) setRecords(data.records);
                } catch (e) {
                    console.error('[勤怠] 取得エラー:', e);
                } finally { setLoading(false); }
            }, []);

            // 今日の自分の出勤状態を取得
            const checkTodayStatus = useCallback(async (staffId) => {
                if (!staffId) return;
                try {
                    const today = todayLocalYMD();
                    const data = await dbGet('attendance', { staffId, date: today });
                    if (data && data.records && data.records.length > 0) {
                        const latest = data.records.find(r => !r.clockOut) || data.records[0];
                        setTodayRecord(latest);
                    } else {
                        setTodayRecord(null);
                    }
                } catch (e) { console.error('[勤怠] ステータス取得エラー:', e); }
            }, []);

            const clockIn = useCallback(async (staffId, staffName, storeId, lat, lng, method, qrToken) => {
                if (!staffId || !storeId) {
                    showToast('スタッフIDと店舗の両方が必要です', 'error');
                    return null;
                }
                setSaving(true);
                try {
                    // サーバが UTC でしか時刻を取れないため、クライアントの
                    // ローカル日時を body に載せる。サーバはこれを採用し、
                    // 無ければ UTC にフォールバック（旧クライアント互換）。
                    const body = {
                        action: 'clockIn', staffId, staffName, storeId, lat, lng,
                        method: method || 'gps',
                        date: todayLocalYMD(),
                        time: nowLocalHM(),
                    };
                    if (qrToken) body.qrToken = qrToken;
                    const data = await dbPost('attendance', body);
                    if (!data || data.error) {
                        showToast((data && data.error) || '出勤記録に失敗しました', 'error');
                        return null;
                    }
                    if (data.success) {
                        showToast('出勤を記録しました', 'success');
                        setTodayRecord(data.record);
                        return data.record;
                    }
                    // success/error のいずれでもないレスポンス → 想定外、明示的にエラー表示
                    showToast('サーバから予期しない応答が返りました', 'error');
                    return null;
                } catch (e) {
                    showToast('出勤記録に失敗しました（通信エラー）', 'error');
                    return null;
                } finally {
                    setSaving(false);
                }
            }, []);

            const clockOut = useCallback(async (staffId, lat, lng) => {
                setSaving(true);
                try {
                    // todayRecord.id を recordId として使う
                    const recordId = (todayRecord && todayRecord.id) || null;
                    if (!recordId) {
                        showToast('出勤記録が見つかりません。リフレッシュしてからお試しください', 'error');
                        return null;
                    }
                    const data = await dbPost('attendance', {
                        action: 'clockOut', recordId, lat, lng,
                        time: nowLocalHM(),
                    });
                    if (!data || data.error) {
                        showToast((data && data.error) || '退勤記録に失敗しました', 'error');
                        return null;
                    }
                    if (data.success) {
                        showToast('退勤を記録しました', 'success');
                        setTodayRecord(prev => prev ? { ...prev, clockOut: data.record.clockOut, workMinutes: data.record.workMinutes } : null);
                        return data.record;
                    }
                    showToast('サーバから予期しない応答が返りました', 'error');
                    return null;
                } catch (e) {
                    showToast('退勤記録に失敗しました（通信エラー）', 'error');
                    return null;
                } finally {
                    setSaving(false);
                }
            }, [todayRecord]);

            // QRトークン生成（店舗端末用）
            const generateQrToken = useCallback(async (storeId) => {
                try {
                    return await dbPost('qrToken', { action: 'generate', storeId });
                } catch (e) { return { error: 'QR生成失敗' }; }
            }, []);

            // QRトークン取得（有効なものがあればそれを返す）
            const getQrToken = useCallback(async (storeId) => {
                try {
                    return await dbGet('qrToken', { store: storeId });
                } catch (e) { return { error: 'QR取得失敗' }; }
            }, []);

            // QRトークン検証
            const validateQrToken = useCallback(async (token, storeId) => {
                try {
                    return await dbPost('qrToken', { action: 'validate', token, storeId });
                } catch (e) { return { valid: false, error: '検証失敗' }; }
            }, []);

            // 店舗座標更新
            const updateStoreCoordinates = useCallback(async (storeId, lat, lng) => {
                try {
                    const data = await dbPost('stores', { action: 'updateCoordinates', storeId, lat, lng });
                    if (data.success) showToast('店舗座標を保存しました', 'success');
                    else showToast(data.error || '保存失敗', 'error');
                    return data;
                } catch (e) { showToast('座標保存に失敗しました', 'error'); return { error: e.message }; }
            }, []);

            // 勤怠レコード編集（管理者・本部用）
            const updateRecord = useCallback(async (recordId, updates) => {
                if (!recordId) return null;
                setSaving(true);
                try {
                    const data = await dbPost('attendance', { action: 'update', recordId, updates });
                    if (!data || data.error) {
                        showToast((data && data.error) || '更新に失敗しました', 'error');
                        return null;
                    }
                    // ローカル records を更新
                    setRecords(prev => prev.map(r => {
                        if (r.id !== recordId) return r;
                        const next = { ...r };
                        if (updates.clockIn !== undefined) next.clockIn = updates.clockIn;
                        if (updates.clockOut !== undefined) next.clockOut = updates.clockOut;
                        if (updates.notes !== undefined) next.notes = updates.notes;
                        if (updates.method !== undefined) next.method = updates.method;
                        // 労働時間を再計算（clockIn / clockOut が両方ある場合のみ）
                        if (next.clockIn && next.clockOut) {
                            const [ih, im] = next.clockIn.split(':').map(Number);
                            const [oh, om] = next.clockOut.split(':').map(Number);
                            let mins = (oh * 60 + om) - (ih * 60 + im);
                            if (mins < 0) mins += 24 * 60;
                            next.workMinutes = mins;
                        } else {
                            next.workMinutes = 0;
                        }
                        return next;
                    }));
                    showToast('勤怠記録を更新しました', 'success');
                    return data;
                } catch (e) {
                    showToast('更新に失敗しました（通信エラー）', 'error');
                    return null;
                } finally { setSaving(false); }
            }, []);

            // 勤怠レコード削除（管理者・本部用）
            const deleteRecord = useCallback(async (recordId) => {
                if (!recordId) return null;
                setSaving(true);
                try {
                    const data = await dbPost('attendance', { action: 'delete', recordId });
                    if (!data || data.error) {
                        showToast((data && data.error) || '削除に失敗しました', 'error');
                        return null;
                    }
                    setRecords(prev => prev.filter(r => r.id !== recordId));
                    showToast('勤怠記録を削除しました', 'success');
                    return data;
                } catch (e) {
                    showToast('削除に失敗しました（通信エラー）', 'error');
                    return null;
                } finally { setSaving(false); }
            }, []);

            return {
                records, loading, saving, todayRecord,
                fetchRecords, checkTodayStatus, clockIn, clockOut,
                generateQrToken, getQrToken, validateQrToken, updateStoreCoordinates,
                updateRecord, deleteRecord
            };
        };

        // 勤怠ビュー
        // ========================================

        const AttendanceView = ({ attendanceHook, activeStoreId, memberData }) => {
            const { records, loading, saving, todayRecord, fetchRecords, checkTodayStatus,
                    clockIn, clockOut, generateQrToken, getQrToken, validateQrToken, updateStoreCoordinates,
                    updateRecord, deleteRecord } = attendanceHook;
            // 勤怠レコードの編集権限（管理者・本部のみ）
            const canEditAttendance = !currentAccess || currentAccess.role === 'headquarter';
            // 編集モーダル状態
            const [editingRecord, setEditingRecord] = useState(null);
            const [editForm, setEditForm] = useState({ clockIn: '', clockOut: '', notes: '' });
            // 店舗の lat/lng は Supabase stores テーブルが正本。
            // serverStores (Square config) には座標が含まれないため、
            // GPS 距離判定・座標エディタともに supabaseStores を優先する。
            const [supabaseStores, setSupabaseStores] = useState([]);
            const reloadSupabaseStores = useCallback(async () => {
                const data = await dbGet('stores', { includeInactive: 'true' });
                if (data && Array.isArray(data.stores)) setSupabaseStores(data.stores);
            }, []);
            useEffect(() => { reloadSupabaseStores(); }, [reloadSupabaseStores]);
            const stores = useMemo(() => {
                // supabaseStores が読めていればそれを使う。未ロード時のみ
                // serverStores へフォールバック (店舗名表示が空にならないように)。
                const base = supabaseStores.length > 0 ? supabaseStores : serverStores;
                const filtered = base
                    .filter(s => s.status !== 'inactive')
                    // 管理者・本部は全店舗、それ以外は割当店舗のみ
                    .filter(s => hasFullStoreAccess() || currentAccess.storeIds.includes(s.id));

                // 重複排除: 同名の店舗（手動追加した行と Square 連携で
                // 自動生成された行が重複しているケース）は 1 つにまとめる。
                // 優先度:
                //   1. 緯度経度が入っている行
                //   2. Square id (数字 "1"〜"20" または "default")
                //   3. それ以外は最初に見つかった行
                const isSquareId = (id) => id === 'default' || /^([1-9]|1[0-9]|20)$/.test(String(id));
                const score = (s) => {
                    let n = 0;
                    if (s.lat != null && s.lng != null) n += 100;
                    if (isSquareId(s.id)) n += 10;
                    return n;
                };
                const groups = new Map();
                for (const s of filtered) {
                    const key = String(s.name || '').trim().toLowerCase() || `__id_${s.id}`;
                    const cur = groups.get(key);
                    if (!cur || score(s) > score(cur)) groups.set(key, s);
                }
                return Array.from(groups.values());
            }, [supabaseStores]);
            // 座標保存後は UI を最新化するため再取得を挟む
            const handleSaveCoordinates = useCallback(async (storeId, lat, lng) => {
                const data = await updateStoreCoordinates(storeId, lat, lng);
                if (data && data.success) await reloadSupabaseStores();
                return data;
            }, [updateStoreCoordinates, reloadSupabaseStores]);
            // ローカル月（UTC toISOString はタイムゾーンずれを起こす）
            const [viewMonth, setViewMonth] = useState(thisMonthLocalYM);
            const [gpsStatus, setGpsStatus] = useState(null); // null | 'checking' | {ok, dist, lat, lng, store} | {error}
            const [showQrScanner, setShowQrScanner] = useState(false);
            const [qrInput, setQrInput] = useState('');
            const [showQrDisplay, setShowQrDisplay] = useState(false);
            const [qrDisplayData, setQrDisplayData] = useState(null);
            const [qrDisplayStore, setQrDisplayStore] = useState('');
            const [attTab, setAttTab] = useState('clock'); // clock | today | history | qr | settings
            // 今日タブ用: 全スタッフの本日の打刻状況
            const [todayRecords, setTodayRecords] = useState([]);
            const [allStaff, setAllStaff] = useState([]);
            const [todayLoading, setTodayLoading] = useState(false);

            const staffId = currentAccess ? currentAccess.staffId : '';
            const staffName = currentAccess ? currentAccess.name : '';

            // 初回: 今日のステータス + 履歴取得
            useEffect(() => {
                if (staffId) checkTodayStatus(staffId);
                fetchRecords({ month: viewMonth, store: activeStoreId !== 'all' ? activeStoreId : '' });
            }, [staffId, viewMonth, activeStoreId]);

            // 今日の出退勤状況を取得（全スタッフ + 本日のレコード）
            const fetchTodayData = useCallback(async () => {
                setTodayLoading(true);
                try {
                    const today = todayLocalYMD();
                    const params = { date: today };
                    if (activeStoreId && activeStoreId !== 'all') params.store = activeStoreId;
                    const [recData, staffResult] = await Promise.all([
                        dbGet('attendance', params),
                        fetchStaffFromDb(false),
                    ]);
                    setTodayRecords((recData && recData.records) || []);
                    if (staffResult && staffResult.ok) setAllStaff(staffResult.staff || []);
                } catch (e) {
                    console.error('[勤怠] 今日の状況取得エラー:', e);
                } finally { setTodayLoading(false); }
            }, [activeStoreId]);

            // 今日タブを開いた時 / 店舗切替時に再取得
            useEffect(() => {
                if (attTab === 'today') fetchTodayData();
            }, [attTab, fetchTodayData]);

            // 今日のスタッフ別ステータスを集計
            const todayStatus = useMemo(() => {
                // 表示対象スタッフ: 権限・店舗フィルタ
                const filteredStaff = (allStaff || [])
                    .filter(s => s.status !== 'inactive')
                    .filter(s => {
                        if (activeStoreId && activeStoreId !== 'all') {
                            return (s.storeIds || []).includes(activeStoreId);
                        }
                        if (currentAccess && !hasFullStoreAccess()) {
                            return (s.storeIds || []).some(sid => currentAccess.storeIds.includes(sid));
                        }
                        return true;
                    });

                // スタッフ毎に最新（clockIn の遅い）レコードを採用
                const latestByStaff = new Map();
                for (const r of todayRecords) {
                    if (!r.staffId) continue;
                    const cur = latestByStaff.get(r.staffId);
                    if (!cur || (r.clockIn || '') > (cur.clockIn || '')) latestByStaff.set(r.staffId, r);
                }

                const clockedIn = [];
                const clockedOut = [];
                const notYet = [];
                const seen = new Set();

                for (const s of filteredStaff) {
                    const rec = latestByStaff.get(s.id);
                    if (!rec) {
                        notYet.push({ id: s.id, name: s.name, storeIds: s.storeIds || [] });
                    } else {
                        seen.add(rec.id);
                        const item = { ...rec, staffName: rec.staffName || s.name };
                        if (rec.clockOut) clockedOut.push(item);
                        else clockedIn.push(item);
                    }
                }
                // スタッフ表に無い記録（削除済みスタッフ等）も漏らさず表示
                for (const r of todayRecords) {
                    if (seen.has(r.id)) continue;
                    const item = { ...r, staffName: r.staffName || '不明' };
                    if (r.clockOut) clockedOut.push(item);
                    else clockedIn.push(item);
                }

                clockedIn.sort((a, b) => (a.clockIn || '').localeCompare(b.clockIn || ''));
                clockedOut.sort((a, b) => (b.clockOut || '').localeCompare(a.clockOut || ''));
                notYet.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ja'));

                return { clockedIn, clockedOut, notYet };
            }, [allStaff, todayRecords, activeStoreId]);

            // GPS位置チェック
            const checkGPS = useCallback(async () => {
                setGpsStatus({ checking: true });
                try {
                    const pos = await getGPSPosition();
                    // 全店舗との距離チェック
                    let nearest = null;
                    for (const store of stores) {
                        if (!store.lat || !store.lng) continue;
                        const dist = calcDistanceM(pos.lat, pos.lng, store.lat, store.lng);
                        if (!nearest || dist < nearest.dist) nearest = { store, dist };
                    }
                    if (!nearest) {
                        setGpsStatus({ error: '店舗の座標が登録されていません。設定画面から登録してください。' });
                    } else if (nearest.dist <= ATTENDANCE_RADIUS_M) {
                        setGpsStatus({ ok: true, dist: Math.round(nearest.dist), lat: pos.lat, lng: pos.lng, store: nearest.store, accuracy: pos.accuracy });
                    } else {
                        setGpsStatus({ ok: false, dist: Math.round(nearest.dist), lat: pos.lat, lng: pos.lng, store: nearest.store, accuracy: pos.accuracy });
                    }
                } catch (e) {
                    setGpsStatus({ error: e.message });
                }
            }, [stores]);

            // 出勤処理
            const handleClockIn = useCallback(async (method) => {
                if (saving) return; // 二重送信防止
                if (!staffId) { showToast('ログインが必要です', 'error'); return; }
                // 既にクロックイン済み（未退勤レコードあり）なら押しても無駄なので案内を出す
                if (todayRecord && todayRecord.clockIn && !todayRecord.clockOut) {
                    showToast('すでに出勤中です。退勤ボタンから操作してください', 'info');
                    return;
                }
                // 店舗特定ロジック:
                //   1. GPS で範囲内の店舗が取れた場合はそれを使う
                //   2. activeStoreId が具体的な ID ならそれを使う
                //   3. それ以外（'all'/未選択）で単一店舗権限ならその店舗を使う
                //   4. どれも該当しなければエラー
                let storeId = gpsStatus?.ok ? gpsStatus.store.id : null;
                if (!storeId && activeStoreId && activeStoreId !== 'all') storeId = activeStoreId;
                if (!storeId && currentAccess && currentAccess.storeIds.length === 1) storeId = currentAccess.storeIds[0];
                if (!storeId) {
                    showToast('店舗を特定できません。GPSで位置確認するか、店舗を選択してください', 'error');
                    return;
                }
                // 権限外店舗の防止（アクセストークンの storeIds に無いものは拒否、本部・管理者は全店舗OK）
                if (!isStoreIdAllowed(storeId)) {
                    showToast('この店舗への出勤権限がありません', 'error');
                    return;
                }
                const result = await clockIn(staffId, staffName, storeId, gpsStatus?.lat, gpsStatus?.lng, method);
                if (result) {
                    checkTodayStatus(staffId);
                }
            }, [staffId, staffName, gpsStatus, activeStoreId, clockIn, checkTodayStatus, saving, todayRecord]);

            // 退勤処理
            const handleClockOut = useCallback(async () => {
                if (saving) return;
                if (!staffId) return;
                if (!todayRecord || !todayRecord.clockIn) {
                    showToast('本日の出勤記録が見つかりません', 'error');
                    return;
                }
                if (todayRecord.clockOut) {
                    showToast('本日は既に退勤済みです', 'info');
                    return;
                }
                let lat, lng;
                try { const pos = await getGPSPosition(); lat = pos.lat; lng = pos.lng; } catch(e) { /* GPS 拒否でも退勤自体は続行 */ }
                const result = await clockOut(staffId, lat, lng);
                if (result) {
                    checkTodayStatus(staffId);
                }
            }, [staffId, clockOut, checkTodayStatus, saving, todayRecord]);

            // QRスキャン → バリデート → 出勤
            const handleQrClockIn = useCallback(async (token) => {
                if (saving) return;
                if (!token) return;
                if (!staffId) { showToast('ログインが必要です', 'error'); return; }
                if (todayRecord && todayRecord.clockIn && !todayRecord.clockOut) {
                    showToast('すでに出勤中です', 'info');
                    return;
                }
                const result = await validateQrToken(token);
                if (!result.valid) { showToast(result.error || 'QRコードが無効です', 'error'); return; }
                const storeId = result.storeId;
                if (!storeId) {
                    showToast('QRコードから店舗を特定できませんでした', 'error');
                    return;
                }
                // 権限外店舗の QR を拒否（店舗間アクセス防止、本部・管理者は全店舗OK）
                if (!isStoreIdAllowed(storeId)) {
                    showToast('この店舗への出勤権限がありません', 'error');
                    return;
                }
                let lat, lng;
                try { const pos = await getGPSPosition(); lat = pos.lat; lng = pos.lng; } catch(e) { /* GPS 失敗でも QR による店舗特定が済んでいるので続行 */ }
                const r = await clockIn(staffId, staffName, storeId, lat, lng, 'qr');
                if (r) {
                    checkTodayStatus(staffId);
                    setShowQrScanner(false);
                    setQrInput('');
                }
            }, [staffId, staffName, validateQrToken, clockIn, checkTodayStatus, saving, todayRecord]);

            // QR表示（店舗端末用）- 5分ごと自動更新
            const startQrDisplay = useCallback(async (storeId) => {
                setQrDisplayStore(storeId);
                setShowQrDisplay(true);
                setQrDisplayData(null);
                // まず既存の有効トークンを再利用。無ければ即時生成。
                let data = await getQrToken(storeId);
                if (!data || !data.token || data.error) {
                    data = await generateQrToken(storeId);
                }
                if (!data || !data.token || data.error) {
                    showToast((data && data.error) || 'QRトークンの生成に失敗しました', 'error');
                }
                setQrDisplayData(data);
            }, [getQrToken, generateQrToken]);

            useEffect(() => {
                if (!showQrDisplay || !qrDisplayStore) return;
                const interval = setInterval(async () => {
                    const data = await generateQrToken(qrDisplayStore);
                    setQrDisplayData(data);
                }, 4.5 * 60 * 1000); // 4.5分ごとに新しいトークン
                return () => clearInterval(interval);
            }, [showQrDisplay, qrDisplayStore, generateQrToken]);

            // 月別フィルタ済み記録
            const monthRecords = useMemo(() => {
                return records.filter(r => r.date && r.date.startsWith(viewMonth));
            }, [records, viewMonth]);

            // 月の合計労働時間
            const monthTotalMinutes = useMemo(() => {
                return monthRecords.reduce((s, r) => s + (r.workMinutes || 0), 0);
            }, [monthRecords]);

            const formatMinutes = (m) => Math.floor(m / 60) + '時間' + (m % 60) + '分';
            const getStoreName = (id) => { const s = stores.find(st => st.id === id); return s ? s.name : id; };

            const changeMonth = (d) => {
                setViewMonth(prev => shiftMonthLocalYM(prev, d));
            };

            const isClockedIn = todayRecord && todayRecord.clockIn && !todayRecord.clockOut;
            const isClockedOut = todayRecord && todayRecord.clockOut;

            return (
                <div className="space-y-5 md:space-y-6 animate-fade-in">
                    <SectionHeader title="勤怠管理" subtitle="ATTENDANCE" icon="clock">
                        <div className="flex items-center gap-2">
                            <button onClick={() => { checkTodayStatus(staffId); fetchRecords({ month: viewMonth }); }} disabled={loading}
                                className="flex items-center px-3 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-xl text-xs font-medium transition-all active:scale-95 disabled:opacity-50">
                                <Icon name="refresh-cw" size={14} className={`mr-1 ${loading ? 'animate-spin' : ''}`} />最新取得
                            </button>
                        </div>
                    </SectionHeader>

                    {/* タブ */}
                    <div className="flex items-center gap-1 bg-slate-100 rounded-xl p-1">
                        {[
                            { id: 'clock', label: '打刻', icon: 'log-in' },
                            { id: 'today', label: '今日の状況', icon: 'users' },
                            { id: 'history', label: '勤怠履歴', icon: 'calendar' },
                            { id: 'qr', label: 'QR表示', icon: 'qr-code' },
                        ].map(t => (
                            <button key={t.id} onClick={() => setAttTab(t.id)}
                                className={`flex-1 flex items-center justify-center gap-1 px-3 py-2 rounded-lg text-xs font-semibold transition-all ${attTab === t.id ? 'bg-white text-sise-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                                <Icon name={t.icon} size={13} />{t.label}
                            </button>
                        ))}
                    </div>

                    {/* ===== 打刻タブ ===== */}
                    {attTab === 'clock' && (
                        <div className="space-y-4">
                            {/* 今日のステータス */}
                            <Card className={isClockedIn ? '!border-green-300 !bg-green-50/30' : isClockedOut ? '!border-blue-300 !bg-blue-50/30' : ''}>
                                <div className="text-center py-4">
                                    <p className="text-xs text-slate-400 font-medium mb-1">{new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' })}</p>
                                    <p className="text-sm font-bold text-slate-600 mb-3">{staffName || 'ゲスト'}</p>

                                    {!todayRecord && !isClockedIn && (
                                        <div className="space-y-3">
                                            <div className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-100 text-slate-500 text-sm font-medium">
                                                <Icon name="clock" size={16} /> 未出勤
                                            </div>
                                            {/* GPS チェック */}
                                            <div>
                                                <button onClick={checkGPS} disabled={gpsStatus?.checking}
                                                    className="px-5 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-sm font-bold transition-all active:scale-95 disabled:opacity-50">
                                                    <Icon name="map-pin" size={16} className="inline mr-1.5 -mt-0.5" />
                                                    {gpsStatus?.checking ? 'GPS確認中...' : '位置情報を確認'}
                                                </button>
                                            </div>
                                            {gpsStatus && !gpsStatus.checking && !gpsStatus.error && (
                                                <div className={`inline-block px-4 py-2 rounded-xl text-xs font-bold ${gpsStatus.ok ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                                    <Icon name={gpsStatus.ok ? 'check-circle' : 'x-circle'} size={14} className="inline mr-1 -mt-0.5" />
                                                    {gpsStatus.ok
                                                        ? `${gpsStatus.store.name}から${gpsStatus.dist}m（範囲内）`
                                                        : `最寄り店舗: ${gpsStatus.store.name}（${gpsStatus.dist}m — 範囲外）`
                                                    }
                                                    {gpsStatus.accuracy && <span className="ml-1 text-[10px] opacity-60">精度: {Math.round(gpsStatus.accuracy)}m</span>}
                                                </div>
                                            )}
                                            {gpsStatus?.error && (
                                                <p className="text-xs text-red-500 font-medium">{gpsStatus.error}</p>
                                            )}
                                            {/* 出勤ボタン */}
                                            <div className="flex items-center justify-center gap-3 pt-2">
                                                <button onClick={() => handleClockIn('gps')}
                                                    disabled={saving || !gpsStatus?.ok || isClockedIn}
                                                    aria-busy={saving || undefined}
                                                    className="inline-flex items-center px-8 py-4 rounded-2xl text-white font-extrabold text-base shadow-lg transition-all active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed"
                                                    style={{background: gpsStatus?.ok ? 'linear-gradient(135deg, #0d9488, #14b8a6)' : '#94a3b8'}}>
                                                    {saving ? <Spinner size={18} /> : <Icon name="log-in" size={20} className="inline mr-2 -mt-0.5" />}
                                                    <span className="ml-2">{saving ? '記録中...' : 'GPS出勤'}</span>
                                                </button>
                                                <button onClick={() => setShowQrScanner(true)}
                                                    disabled={saving || isClockedIn}
                                                    className="inline-flex items-center px-6 py-4 rounded-2xl bg-white border-2 border-slate-200 text-slate-700 font-extrabold text-base shadow-sm hover:border-sise-300 transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                                                    <Icon name="qr-code" size={20} className="inline mr-2 -mt-0.5" />QR出勤
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {isClockedIn && (
                                        <div className="space-y-3">
                                            <div className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-green-100 text-green-700 text-sm font-bold">
                                                <div className="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse" /> 勤務中
                                            </div>
                                            <p className="text-lg font-extrabold text-slate-800">出勤: {todayRecord.clockIn}</p>
                                            <button onClick={handleClockOut} disabled={saving}
                                                aria-busy={saving || undefined}
                                                className="inline-flex items-center px-8 py-4 rounded-2xl text-white font-extrabold text-base shadow-lg transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
                                                style={{background: 'linear-gradient(135deg, #ef4444, #f87171)'}}>
                                                {saving ? <Spinner size={18} /> : <Icon name="log-out" size={20} className="inline mr-2 -mt-0.5" />}
                                                <span className="ml-2">{saving ? '記録中...' : '退勤する'}</span>
                                            </button>
                                        </div>
                                    )}

                                    {isClockedOut && (
                                        <div className="space-y-2">
                                            <div className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-blue-100 text-blue-700 text-sm font-bold">
                                                <Icon name="check-circle" size={16} /> 勤務完了
                                            </div>
                                            <div className="flex items-center justify-center gap-6 text-slate-700">
                                                <div className="text-center">
                                                    <p className="text-[10px] text-slate-400">出勤</p>
                                                    <p className="text-lg font-extrabold">{todayRecord.clockIn}</p>
                                                </div>
                                                <Icon name="arrow-right" size={16} className="text-slate-300" />
                                                <div className="text-center">
                                                    <p className="text-[10px] text-slate-400">退勤</p>
                                                    <p className="text-lg font-extrabold">{todayRecord.clockOut}</p>
                                                </div>
                                                <div className="text-center pl-3 border-l border-slate-200">
                                                    <p className="text-[10px] text-slate-400">勤務時間</p>
                                                    <p className="text-lg font-extrabold text-sise-600">{formatMinutes(todayRecord.workMinutes || 0)}</p>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </Card>

                            {/* QRスキャンモーダル */}
                            {showQrScanner && (
                                <Card className="animate-scale-in !border-sise-300">
                                    <h4 className="font-bold text-slate-800 mb-3 flex items-center">
                                        <Icon name="qr-code" size={18} className="mr-2 text-sise-500" />
                                        QRコード出勤
                                    </h4>
                                    <p className="text-xs text-slate-500 mb-3">店舗端末に表示されたQRコードの文字列を入力してください</p>
                                    <div className="flex gap-2">
                                        <input type="text" value={qrInput} onChange={e => setQrInput(e.target.value)}
                                            placeholder="QRコード（qr_...）" className="flex-1 px-3 py-2.5 border border-slate-200 rounded-xl text-sm outline-none" autoFocus />
                                        <button onClick={() => handleQrClockIn(qrInput)} disabled={!qrInput || saving}
                                            className="px-4 py-2.5 btn-gradient rounded-xl text-sm font-medium disabled:opacity-50">出勤</button>
                                    </div>
                                    <div className="flex justify-end mt-2">
                                        <button onClick={() => { setShowQrScanner(false); setQrInput(''); }}
                                            className="text-xs text-slate-500 hover:text-slate-700">キャンセル</button>
                                    </div>
                                </Card>
                            )}
                        </div>
                    )}

                    {/* ===== 今日の状況タブ（誰が出勤・退勤したか） ===== */}
                    {attTab === 'today' && (
                        <div className="space-y-4">
                            <Card>
                                <div className="flex items-start justify-between">
                                    <div>
                                        <h4 className="font-bold text-slate-800 flex items-center">
                                            <Icon name="users" size={18} className="mr-2 text-sise-500" />
                                            本日の出退勤状況
                                        </h4>
                                        <p className="text-xs text-slate-400 mt-1">
                                            {new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' })}
                                            {activeStoreId && activeStoreId !== 'all' && (
                                                <span className="ml-2 px-1.5 py-0.5 bg-sise-50 text-sise-700 rounded text-[10px] font-bold">
                                                    {getStoreName(activeStoreId)}
                                                </span>
                                            )}
                                        </p>
                                    </div>
                                    <button onClick={fetchTodayData} disabled={todayLoading}
                                        className="flex items-center px-3 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-xl text-xs font-medium transition-all active:scale-95 disabled:opacity-50">
                                        <Icon name="refresh-cw" size={14} className={`mr-1 ${todayLoading ? 'animate-spin' : ''}`} />更新
                                    </button>
                                </div>
                            </Card>

                            {/* サマリー */}
                            <div className="grid grid-cols-3 gap-2.5">
                                <KpiCard title="勤務中" value={todayStatus.clockedIn.length + '人'} icon="play-circle"
                                    gradientFrom="from-green-400" gradientTo="to-green-600" />
                                <KpiCard title="退勤済" value={todayStatus.clockedOut.length + '人'} icon="check-circle"
                                    gradientFrom="from-blue-400" gradientTo="to-blue-600" />
                                <KpiCard title="未出勤" value={todayStatus.notYet.length + '人'} icon="moon"
                                    gradientFrom="from-slate-400" gradientTo="to-slate-500" />
                            </div>

                            {/* 勤務中 */}
                            <Card className="!border-green-200">
                                <h4 className="font-bold text-slate-800 mb-3 flex items-center">
                                    <span className="inline-block w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse mr-2" />
                                    勤務中（{todayStatus.clockedIn.length}人）
                                </h4>
                                {todayStatus.clockedIn.length === 0 ? (
                                    <p className="text-sm text-slate-400 text-center py-4">現在勤務中のスタッフはいません</p>
                                ) : (
                                    <div className="space-y-2">
                                        {todayStatus.clockedIn.map(item => (
                                            <div key={item.id} className="flex items-center justify-between p-3 rounded-xl border border-green-100 bg-green-50/40">
                                                <div className="min-w-0">
                                                    <p className="font-bold text-slate-800 truncate">{item.staffName}</p>
                                                    <p className="text-xs text-slate-500 truncate">
                                                        <Icon name="map-pin" size={11} className="inline -mt-0.5 mr-0.5" />
                                                        {getStoreName(item.storeId)}
                                                        {item.method && (
                                                            <span className={`ml-2 px-1.5 py-0.5 rounded text-[10px] font-bold ${item.method === 'qr' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}`}>
                                                                {item.method === 'qr' ? 'QR' : 'GPS'}
                                                            </span>
                                                        )}
                                                    </p>
                                                </div>
                                                <div className="text-right shrink-0 ml-3">
                                                    <p className="text-[10px] text-slate-400">出勤時刻</p>
                                                    <p className="text-lg font-extrabold text-green-600 leading-tight">{item.clockIn || '-'}</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </Card>

                            {/* 退勤済み */}
                            <Card>
                                <h4 className="font-bold text-slate-800 mb-3 flex items-center">
                                    <Icon name="check-circle" size={16} className="mr-2 text-blue-500" />
                                    退勤済み（{todayStatus.clockedOut.length}人）
                                </h4>
                                {todayStatus.clockedOut.length === 0 ? (
                                    <p className="text-sm text-slate-400 text-center py-4">退勤済みのスタッフはまだいません</p>
                                ) : (
                                    <div className="space-y-2">
                                        {todayStatus.clockedOut.map(item => (
                                            <div key={item.id} className="flex items-center justify-between p-3 rounded-xl bg-slate-50/60 border border-slate-100">
                                                <div className="min-w-0">
                                                    <p className="font-bold text-slate-800 truncate">{item.staffName}</p>
                                                    <p className="text-xs text-slate-500 truncate">
                                                        <Icon name="map-pin" size={11} className="inline -mt-0.5 mr-0.5" />
                                                        {getStoreName(item.storeId)}
                                                    </p>
                                                </div>
                                                <div className="flex items-center gap-2 shrink-0 ml-3">
                                                    <div className="text-right">
                                                        <p className="text-[10px] text-slate-400">出勤</p>
                                                        <p className="text-sm font-bold text-green-600 leading-tight">{item.clockIn || '-'}</p>
                                                    </div>
                                                    <Icon name="arrow-right" size={12} className="text-slate-300" />
                                                    <div className="text-right">
                                                        <p className="text-[10px] text-slate-400">退勤</p>
                                                        <p className="text-sm font-bold text-red-500 leading-tight">{item.clockOut || '-'}</p>
                                                    </div>
                                                    {item.workMinutes > 0 && (
                                                        <div className="text-right pl-2 border-l border-slate-200">
                                                            <p className="text-[10px] text-slate-400">勤務</p>
                                                            <p className="text-sm font-bold text-sise-600 leading-tight">{formatMinutes(item.workMinutes)}</p>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </Card>

                            {/* 未出勤 */}
                            <Card>
                                <h4 className="font-bold text-slate-800 mb-3 flex items-center">
                                    <Icon name="moon" size={16} className="mr-2 text-slate-400" />
                                    未出勤（{todayStatus.notYet.length}人）
                                </h4>
                                {todayStatus.notYet.length === 0 ? (
                                    <p className="text-sm text-slate-400 text-center py-4">対象スタッフはいません</p>
                                ) : (
                                    <div className="flex flex-wrap gap-2">
                                        {todayStatus.notYet.map(s => (
                                            <div key={s.id} className="px-3 py-1.5 bg-slate-100 text-slate-600 rounded-lg text-sm font-medium">
                                                {s.name}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </Card>
                        </div>
                    )}

                    {/* ===== 勤怠履歴タブ ===== */}
                    {attTab === 'history' && (
                        <div className="space-y-4">
                            {/* 月間サマリー */}
                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-2.5">
                                <KpiCard title="出勤日数" value={monthRecords.filter(r => r.clockIn).length + '日'} icon="calendar"
                                    gradientFrom="from-sise-400" gradientTo="to-sise-600" />
                                <KpiCard title="総労働時間" value={formatMinutes(monthTotalMinutes)} icon="clock"
                                    gradientFrom="from-blue-400" gradientTo="to-blue-600" />
                                <KpiCard title="平均勤務" value={monthRecords.length > 0 ? formatMinutes(Math.round(monthTotalMinutes / monthRecords.filter(r => r.workMinutes > 0).length) || 0) : '-'} icon="bar-chart-2"
                                    gradientFrom="from-emerald-400" gradientTo="to-emerald-600" />
                                <KpiCard title="退勤忘れ" value={monthRecords.filter(r => r.clockIn && !r.clockOut).length + '件'} icon="alert-triangle"
                                    gradientFrom={monthRecords.filter(r => r.clockIn && !r.clockOut).length > 0 ? 'from-red-400' : 'from-slate-400'}
                                    gradientTo={monthRecords.filter(r => r.clockIn && !r.clockOut).length > 0 ? 'to-red-600' : 'to-slate-500'} />
                            </div>

                            {/* 月ナビ */}
                            <Card>
                                <div className="flex items-center justify-between mb-4">
                                    <button onClick={() => changeMonth(-1)} className="p-2 rounded-xl hover:bg-sise-50 text-slate-500"><Icon name="chevron-left" size={20} /></button>
                                    <h3 className="text-lg font-bold text-slate-800">{new Date(viewMonth + '-01').toLocaleDateString('ja-JP', { year: 'numeric', month: 'long' })}</h3>
                                    <button onClick={() => changeMonth(1)} className="p-2 rounded-xl hover:bg-sise-50 text-slate-500"><Icon name="chevron-right" size={20} /></button>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-xs">
                                        <thead>
                                            <tr className="border-b-2 border-slate-200">
                                                <th className="text-left py-2.5 px-2 text-slate-500 font-semibold">日付</th>
                                                <th className="text-left py-2.5 px-2 text-slate-500 font-semibold">店舗</th>
                                                <th className="text-center py-2.5 px-2 text-green-600 font-semibold">出勤</th>
                                                <th className="text-center py-2.5 px-2 text-red-500 font-semibold">退勤</th>
                                                <th className="text-center py-2.5 px-2 text-sise-600 font-semibold">勤務時間</th>
                                                <th className="text-center py-2.5 px-2 text-slate-400 font-semibold">方法</th>
                                                {canEditAttendance && (
                                                    <th className="text-center py-2.5 px-2 text-slate-400 font-semibold">操作</th>
                                                )}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {monthRecords.length === 0 && (
                                                <tr><td colSpan={canEditAttendance ? 7 : 6} className="text-center py-8 text-slate-400">記録がありません</td></tr>
                                            )}
                                            {monthRecords.map(r => (
                                                <tr key={r.id} className="border-b border-slate-50 hover:bg-slate-50/50">
                                                    <td className="py-2.5 px-2 font-bold text-slate-700">{r.date}</td>
                                                    <td className="py-2.5 px-2 text-slate-600">{getStoreName(r.storeId)}</td>
                                                    <td className="py-2.5 px-2 text-center font-bold text-green-600">{r.clockIn || '-'}</td>
                                                    <td className="py-2.5 px-2 text-center font-bold text-red-500">{r.clockOut || <span className="text-amber-500 text-[10px]">未退勤</span>}</td>
                                                    <td className="py-2.5 px-2 text-center font-bold text-sise-700">{r.workMinutes > 0 ? formatMinutes(r.workMinutes) : '-'}</td>
                                                    <td className="py-2.5 px-2 text-center">
                                                        <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold ${r.method === 'qr' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}`}>
                                                            {r.method === 'qr' ? 'QR' : 'GPS'}
                                                        </span>
                                                    </td>
                                                    {canEditAttendance && (
                                                        <td className="py-2.5 px-2 text-center whitespace-nowrap">
                                                            <button
                                                                onClick={() => {
                                                                    setEditingRecord(r);
                                                                    setEditForm({ clockIn: r.clockIn || '', clockOut: r.clockOut || '', notes: r.notes || '' });
                                                                }}
                                                                className="p-1 rounded hover:bg-slate-100 text-slate-400 hover:text-slate-600 transition-colors"
                                                                title="編集"
                                                                aria-label="勤怠記録を編集">
                                                                <Icon name="edit-2" size={13} />
                                                            </button>
                                                            <button
                                                                onClick={async () => {
                                                                    if (await confirmDialog({ title:'勤怠記録の削除', message: `${r.date} ${r.staffName || ''}の記録を削除しますか？`, confirmLabel:'削除', variant:'danger' })) {
                                                                        await deleteRecord(r.id);
                                                                    }
                                                                }}
                                                                className="p-1 rounded hover:bg-red-50 text-slate-300 hover:text-red-400 transition-colors ml-0.5"
                                                                title="削除"
                                                                aria-label="勤怠記録を削除">
                                                                <Icon name="trash-2" size={13} />
                                                            </button>
                                                        </td>
                                                    )}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </Card>
                        </div>
                    )}

                    {/* ===== QR表示タブ（店舗端末用） ===== */}
                    {attTab === 'qr' && (
                        <div className="space-y-4">
                            <Card>
                                <h4 className="font-bold text-slate-800 mb-3 flex items-center">
                                    <Icon name="qr-code" size={18} className="mr-2 text-sise-500" />
                                    店舗QRコード表示（この画面を店舗端末に表示）
                                </h4>
                                <p className="text-xs text-slate-500 mb-4">スタッフがこのQRコードを読み取ると出勤を記録できます。5分ごとに自動更新されます。</p>
                                {!showQrDisplay ? (
                                    <div className="space-y-2">
                                        <p className="text-xs text-slate-600 font-medium">表示する店舗を選択:</p>
                                        <div className="flex flex-wrap gap-2">
                                            {stores.map(s => (
                                                <button key={s.id} onClick={() => startQrDisplay(s.id)}
                                                    className="px-4 py-2.5 bg-sise-50 hover:bg-sise-100 border border-sise-200 text-sise-700 rounded-xl text-sm font-bold transition-all active:scale-95">
                                                    <Icon name="map-pin" size={14} className="inline mr-1.5 -mt-0.5" />{s.name}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-center py-6">
                                        <p className="text-xs text-slate-400 mb-2">{getStoreName(qrDisplayStore)}</p>
                                        {qrDisplayData?.token ? (
                                            <>
                                                <div className="inline-block p-6 bg-white rounded-3xl border-2 border-sise-200 shadow-lg mb-3">
                                                    {/* QRコードはテキストで表示（ライブラリ不要） */}
                                                    <div className="bg-slate-900 text-white font-mono text-lg px-6 py-4 rounded-xl break-all select-all"
                                                        style={{wordBreak:'break-all', letterSpacing: '1px'}}>
                                                        {qrDisplayData.token}
                                                    </div>
                                                </div>
                                                <p className="text-xs text-slate-400">
                                                    有効期限: {new Date(qrDisplayData.expiresAt).toLocaleTimeString('ja-JP')}
                                                    <span className="ml-2 text-[10px]">（5分ごとに自動更新）</span>
                                                </p>
                                                <p className="text-[11px] text-sise-600 font-medium mt-2">スタッフはこのコードを「QR出勤」画面で入力してください</p>
                                            </>
                                        ) : (
                                            <p className="text-sm text-slate-500">QRトークンを生成中...</p>
                                        )}
                                        <button onClick={() => { setShowQrDisplay(false); setQrDisplayData(null); }}
                                            className="mt-4 px-4 py-2 text-sm text-slate-500 hover:text-slate-700">表示を終了</button>
                                    </div>
                                )}
                            </Card>

                            {/* 店舗座標設定 */}
                            {(!currentAccess || currentAccess.role === 'manager' || currentAccess.role === 'headquarter') && (
                                <Card>
                                    <h4 className="font-bold text-slate-800 mb-3 flex items-center">
                                        <Icon name="map-pin" size={18} className="mr-2 text-sise-500" />
                                        店舗GPS座標設定
                                    </h4>
                                    <p className="text-xs text-slate-400 mb-3">各店舗の緯度・経度を設定します。「現在地を取得」ボタンで店舗にいる時に設定できます。座標は Supabase の stores テーブルに保存されます。</p>
                                    <div className="space-y-3">
                                        {stores.map(s => (
                                            <StoreCoordinateEditor key={s.id} store={s} onSave={handleSaveCoordinates} />
                                        ))}
                                    </div>
                                </Card>
                            )}
                        </div>
                    )}

                    {/* 勤怠記録編集モーダル（管理者・本部のみ） */}
                    {canEditAttendance && editingRecord && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4 animate-fade-in"
                             role="dialog" aria-modal="true" aria-labelledby="att-edit-title">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-5 animate-scale-in">
                                <div className="flex items-center justify-between mb-3">
                                    <h3 id="att-edit-title" className="text-base font-bold text-slate-800 flex items-center">
                                        <Icon name="edit-2" size={16} className="mr-2 text-sise-500" />
                                        勤怠記録を編集
                                    </h3>
                                    <button onClick={() => setEditingRecord(null)} className="p-1 rounded hover:bg-slate-100 text-slate-400" aria-label="閉じる">
                                        <Icon name="x" size={18} />
                                    </button>
                                </div>
                                <div className="text-xs text-slate-500 mb-3">
                                    {editingRecord.date}・{editingRecord.staffName || '不明'}・{getStoreName(editingRecord.storeId)}
                                </div>
                                <div className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">出勤時刻</label>
                                        <input type="time" value={editForm.clockIn}
                                            onChange={e => setEditForm(p => ({ ...p, clockIn: e.target.value }))}
                                            className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-sise-400" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">退勤時刻</label>
                                        <input type="time" value={editForm.clockOut}
                                            onChange={e => setEditForm(p => ({ ...p, clockOut: e.target.value }))}
                                            className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-sise-400" />
                                        <p className="text-[11px] text-slate-400 mt-1">空欄にすると未退勤扱いになります。</p>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">備考</label>
                                        <textarea value={editForm.notes}
                                            onChange={e => setEditForm(p => ({ ...p, notes: e.target.value }))}
                                            rows={2}
                                            className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-sise-400 resize-none" />
                                    </div>
                                </div>
                                <div className="flex justify-end gap-2 mt-4">
                                    <button onClick={() => setEditingRecord(null)} disabled={saving}
                                        className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg disabled:opacity-50">キャンセル</button>
                                    <button
                                        onClick={async () => {
                                            const updates = {
                                                clockIn: editForm.clockIn || '',
                                                clockOut: editForm.clockOut || '',
                                                notes: editForm.notes || ''
                                            };
                                            // 労働時間も同梱（サーバ側でも持つが UI 上の整合性のため）
                                            if (updates.clockIn && updates.clockOut) {
                                                const [ih, im] = updates.clockIn.split(':').map(Number);
                                                const [oh, om] = updates.clockOut.split(':').map(Number);
                                                let mins = (oh * 60 + om) - (ih * 60 + im);
                                                if (mins < 0) mins += 24 * 60;
                                                updates.workMinutes = mins;
                                            } else {
                                                updates.workMinutes = 0;
                                            }
                                            const result = await updateRecord(editingRecord.id, updates);
                                            if (result) setEditingRecord(null);
                                        }}
                                        disabled={saving}
                                        className="px-4 py-2 btn-gradient rounded-lg text-sm font-medium disabled:opacity-50">
                                        {saving ? '保存中...' : '保存'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // 店舗座標エディター小コンポーネント
        const StoreCoordinateEditor = ({ store, onSave }) => {
            const [lat, setLat] = useState(store.lat ? String(store.lat) : '');
            const [lng, setLng] = useState(store.lng ? String(store.lng) : '');
            const [saving, setSaving] = useState(false);

            const handleGetCurrentLocation = async () => {
                try {
                    const pos = await getGPSPosition();
                    setLat(String(pos.lat));
                    setLng(String(pos.lng));
                    showToast(`現在地を取得しました（精度: ${Math.round(pos.accuracy)}m）`, 'success');
                } catch (e) { showToast(e.message, 'error'); }
            };

            const handleSave = async () => {
                if (!lat || !lng) return;
                setSaving(true);
                await onSave(store.id, parseFloat(lat), parseFloat(lng));
                setSaving(false);
            };

            return (
                <div className="flex items-center gap-2 p-3 bg-slate-50 rounded-xl border border-slate-200">
                    <span className="text-xs font-bold text-slate-700 w-20 shrink-0">{store.name}</span>
                    <input type="text" value={lat} onChange={e => setLat(e.target.value)}
                        placeholder="緯度" className="flex-1 min-w-0 px-2 py-1.5 border border-slate-200 rounded-lg text-xs outline-none" />
                    <input type="text" value={lng} onChange={e => setLng(e.target.value)}
                        placeholder="経度" className="flex-1 min-w-0 px-2 py-1.5 border border-slate-200 rounded-lg text-xs outline-none" />
                    <button onClick={handleGetCurrentLocation} className="text-blue-500 hover:text-blue-700 shrink-0" title="現在地を取得">
                        <Icon name="crosshair" size={16} />
                    </button>
                    <button onClick={handleSave} disabled={!lat || !lng || saving}
                        className="px-3 py-1.5 btn-gradient rounded-lg text-[11px] font-medium disabled:opacity-50 shrink-0">{saving ? '...' : '保存'}</button>
                    {store.lat && store.lng && <Icon name="check-circle" size={14} className="text-green-500 shrink-0" />}
                </div>
            );
        };

        // ============================================================
        // デモ用シェル
        // ============================================================
        const DemoApp = () => {
            const attendanceHook = useAttendance();
            const [activeStoreId, setActiveStoreId] = useState('all');
            return (
                <div className="min-h-screen bg-gradient-to-br from-sise-50 via-white to-slate-50">
                    <div className="max-w-3xl mx-auto px-4 py-5 md:py-8">
                        <div className="flex flex-wrap items-center justify-between gap-3 mb-5">
                            <div className="flex items-center gap-2">
                                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-sise-400 to-sise-600 text-white flex items-center justify-center shadow-lg">
                                    <Icon name="activity" size={18} />
                                </div>
                                <div>
                                    <p className="text-base font-extrabold text-slate-800 leading-tight">si'se 勤怠管理</p>
                                    <p className="text-[10px] text-sise-500 font-semibold tracking-widest uppercase">Standalone Demo</p>
                                </div>
                            </div>
                            <label className="flex items-center gap-2 text-xs text-slate-500 font-medium">
                                店舗
                                <select value={activeStoreId} onChange={e => setActiveStoreId(e.target.value)}
                                    className="px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm font-medium outline-none focus:border-sise-400">
                                    <option value="all">全店舗</option>
                                    {DEMO_STORES.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                </select>
                            </label>
                        </div>
                        <div className="mb-4 px-3 py-2 rounded-xl bg-amber-50 border border-amber-200 text-[11px] text-amber-700 leading-relaxed">
                            これは勤怠管理機能だけを切り出した単独デモです。データはこのブラウザの localStorage に保存されます（本体の Supabase には接続しません）。GPS出勤は店舗座標から300m以内が必要です。離れた場所では「QR表示」タブでトークンを表示→「打刻」タブの「QR出勤」に貼り付けるとお試しできます。
                        </div>
                        <AttendanceView attendanceHook={attendanceHook} activeStoreId={activeStoreId} memberData={null} />
                    </div>
                    <ToastContainer />
                    <ConfirmDialogContainer />
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<DemoApp />);
    </script>
</body>
</html>
