                                        value={googleFormUrl}
                                        onChange={(e) => setGoogleFormUrl(e.target.value)}
                                        className="flex-1 px-4 py-2.5 border border-slate-200 rounded-xl focus:border-sise-500 focus:ring-2 focus:ring-sise-500/20 outline-none text-sm"
                                        placeholder="https://script.google.com/macros/s/..."
                                    />
                                    <button
                                        onClick={handleSaveGas}
                                        className="px-4 py-2.5 btn-gradient rounded-xl font-medium text-sm"
                                    >
                                        保存
                                    </button>
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">
                                    利用回数管理用 GAS URL
                                </label>
                                <div className="flex gap-2">
                                    <input
                                        type="url"
                                        value={localStorage.getItem('sise_usage_gas_url') || ''}
                                        onChange={(e) => {
                                            localStorage.setItem('sise_usage_gas_url', e.target.value);
                                        }}
                                        className="flex-1 px-4 py-2.5 border border-slate-200 rounded-xl focus:border-sise-500 focus:ring-2 focus:ring-sise-500/20 outline-none text-sm"
                                        placeholder="https://script.google.com/macros/s/..."
                                    />
                                    <button
                                        onClick={() => {
                                            setSaveMessage('利用回数用GAS URLを保存しました。リロードで反映されます。');
                                            setTimeout(() => setSaveMessage(''), 5000);
                                        }}
                                        className="px-4 py-2.5 btn-gradient rounded-xl font-medium text-sm"
                                    >
                                        保存
                                    </button>
                                </div>
                                <p className="text-xs text-slate-400 mt-1.5">会員の月間利用回数をスプレッドシートに保存するための URL です</p>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">
                                    回数券管理用 GAS URL
                                </label>
                                <div className="flex gap-2">
                                    <input
                                        type="url"
                                        value={localStorage.getItem('sise_ticket_gas_url') || ''}
                                        onChange={(e) => {
                                            localStorage.setItem('sise_ticket_gas_url', e.target.value);
                                        }}
                                        className="flex-1 px-4 py-2.5 border border-slate-200 rounded-xl focus:border-sise-500 focus:ring-2 focus:ring-sise-500/20 outline-none text-sm"
                                        placeholder="https://script.google.com/macros/s/..."
                                    />
                                    <button
                                        onClick={() => {
                                            setSaveMessage('回数券用GAS URLを保存しました。リロードで反映されます。');
                                            setTimeout(() => setSaveMessage(''), 5000);
                                        }}
                                        className="px-4 py-2.5 btn-gradient rounded-xl font-medium text-sm"
                                    >
                                        保存
                                    </button>
                                </div>
                                <p className="text-xs text-slate-400 mt-1.5">回数券のプラン・購入者データをスプレッドシートに保存するための URL です</p>
                            </div>
                        </div>
                    </Card>

                    {/* スタッフ管理 */}
                    <StaffManagementSection />

                    {/* セキュリティ情報 */}
                    <Card className="bg-green-50 border-green-200">
                        <div className="flex items-start">
                            <Icon name="shield-check" size={20} className="text-green-500 mr-3 mt-0.5" />
                            <div>
                                <h4 className="font-semibold text-green-900 mb-1">セキュリティ</h4>
                                <p className="text-sm text-green-700">
                                    Square APIトークンはVercelのサーバーサイドで管理されています。
                                    ブラウザにはトークンが露出しない安全な構成です。
                                </p>
                            </div>
                        </div>
                    </Card>
                </div>
            );
        };

        // ========================================
        // メインアプリケーション
        // ========================================

        const App = () => {
            const [currentView, setCurrentView] = useState('dashboard');
            const [selectedStore, setSelectedStore] = useState('all');
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [isDarkMode, setIsDarkMode] = useState(false);

            const isStaffMode = !!currentAccess;
            const [activeStoreId, setActiveStoreId] = useState(
                isStaffMode && currentAccess.storeIds.length === 1 ? currentAccess.storeIds[0] : 'all'
            );
            // Square データ取得（店舗選択に連動、アクセス制限適用）
            const { memberData, refreshSquareData, operateSubscription } = useSquareData(
                activeStoreId,
                isStaffMode ? currentAccess.storeIds : null
            );
            // 日報データ取得
            const { reportData, refreshReportData } = useDailyReportData();
            // 利用回数管理
            const usageHook = useMemberUsage();
            // 回数券管理
            const ticketHook = useTicketManagement();

            // ダークモード切り替え
            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            const navItems = [
                { id: 'dashboard', label: 'ダッシュボード', icon: 'layout-dashboard', mobileLabel: 'ホーム' },
                { id: 'reports', label: '日報一覧', icon: 'clipboard-list', mobileLabel: '日報' },
                { id: 'members', label: '会員管理', icon: 'users', mobileLabel: '会員' },
                { id: 'usage', label: '利用管理', icon: 'clipboard-check', mobileLabel: '利用' },
                { id: 'tickets', label: '回数券', icon: 'ticket', mobileLabel: '回数券' },
                ...(!isStaffMode ? [{ id: 'settings', label: '設定', icon: 'settings', mobileLabel: '設定' }] : []),
            ];

            const renderView = () => {
                switch (currentView) {
                    case 'dashboard':
                        return <DashboardView
                            memberData={memberData}
                            reportData={reportData}
                            selectedStore={selectedStore}
                            setSelectedStore={setSelectedStore}
                        />;
                    case 'reports':
                        return <DailyReportListView reportData={reportData} />;
                    case 'members':
                        return <MemberManagementView memberData={memberData} refreshSquareData={refreshSquareData} operateSubscription={operateSubscription} activeStoreId={activeStoreId} />;
                    case 'usage':
                        return <MemberUsageView memberData={memberData} usageHook={usageHook} />;
                    case 'tickets':
                        return <TicketManagementView ticketHook={ticketHook} />;
                    case 'settings':
                        return isStaffMode
                            ? <DashboardView memberData={memberData} reportData={reportData} selectedStore={selectedStore} setSelectedStore={setSelectedStore} />
                            : <SettingsView onSettingsSaved={() => {}} />;
                    default:
                        return <DashboardView
                            memberData={memberData}
                            reportData={reportData}
                            selectedStore={selectedStore}
                            setSelectedStore={setSelectedStore}
                        />;
                }
            };

            return (
                <div className="min-h-screen bg-slate-50 bg-mesh relative">
                    {/* 背景装飾オーブ */}
                    <div className="bg-orb bg-orb-1"></div>
                    <div className="bg-orb bg-orb-2"></div>
                    <div className="bg-orb bg-orb-3"></div>

                    {/* Header */}
                    <header className="fixed top-0 left-0 right-0 z-50 glass-panel safe-top">
                        <div className="flex items-center justify-between px-4 md:px-5 h-14 md:h-16">
                            <div className="flex items-center">
                                <button
                                    onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                                    className="lg:hidden p-2 rounded-xl hover:bg-sise-50 mr-1 transition-colors"
                                >
                                    <Icon name={isSidebarOpen ? "x" : "menu"} size={20} />
                                </button>
                                <div className="flex items-center">
                                    <div className="w-8 h-8 md:w-9 md:h-9 bg-gradient-to-br from-sise-400 to-sise-600 rounded-xl flex items-center justify-center text-white font-extrabold text-sm shadow-lg shadow-sise-500/30 animate-glow-pulse">
                                        S
                                    </div>
                                    <div className="ml-2.5">
                                        <h1 className="text-sm md:text-base font-extrabold tracking-wide gradient-text">si'se</h1>
                                        <p className="text-[9px] text-sise-400 -mt-0.5 font-semibold tracking-[0.2em]">DASHBOARD</p>
                                    </div>
                                </div>
                            </div>
                            <div className="flex items-center gap-1">
                                {/* スタッフ表示 */}
                                {isStaffMode && (
                                    <div className="flex items-center px-2 md:px-3 py-1.5 bg-sise-50/80 border border-sise-200 rounded-xl hide-mobile">
                                        <Icon name={currentAccess.role === 'manager' ? 'shield' : 'user'} size={13} className="text-sise-500 mr-1" />
                                        <span className="text-xs font-semibold text-sise-700">{currentAccess.name}</span>
                                    </div>
                                )}
                                {/* 店舗セレクター */}
                                {(() => {
                                    const visibleStores = isStaffMode
                                        ? (memberData.stores || []).filter(s => currentAccess.storeIds.includes(s.id))
                                        : (memberData.stores || []);
                                    return visibleStores.length > 1 ? (
                                        <select
                                            value={activeStoreId}
                                            onChange={(e) => setActiveStoreId(e.target.value)}
                                            className="px-2 md:px-3 py-1.5 border border-sise-200 rounded-xl text-xs font-semibold focus:border-sise-400 focus:ring-2 focus:ring-sise-400/20 outline-none bg-sise-50/60 text-sise-700"
                                        >
                                            <option value="all">全店舗</option>
                                            {visibleStores.map(s => (
                                                <option key={s.id} value={s.id}>{s.name}</option>
                                            ))}
                                        </select>
                                    ) : null;
                                })()}
                                <button
                                    onClick={() => { refreshReportData(); refreshSquareData(); }}
                                    className="p-2 rounded-xl hover:bg-sise-50 text-slate-400 hover:text-sise-600 transition-all"
                                    title="データ更新"
                                >
                                    <Icon name="refresh-cw" size={17} />
                                </button>
                                <button
                                    onClick={() => setIsDarkMode(!isDarkMode)}
                                    className="p-2 rounded-xl hover:bg-sise-50 text-slate-400 hover:text-sise-600 transition-all hide-mobile"
                                    title="ダークモード切り替え"
                                >
                                    <Icon name={isDarkMode ? 'sun' : 'moon'} size={17} />
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Sidebar Overlay (Mobile) */}
                    {isSidebarOpen && (
                        <div
                            className="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 lg:hidden animate-fade-in"
                            onClick={() => setIsSidebarOpen(false)}
                        ></div>
                    )}

                    {/* Sidebar (Desktop) */}
                    <aside className={`fixed top-14 md:top-16 left-0 bottom-0 w-56 glass-panel z-40 transform transition-transform duration-300 ease-out lg:translate-x-0 ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <nav className="p-3 space-y-0.5 mt-2">
                            {navItems.map((item) => (
                                <button
                                    key={item.id}
                                    onClick={() => {
                                        setCurrentView(item.id);
                                        setIsSidebarOpen(false);
                                    }}
                                    className={`w-full flex items-center px-4 py-2.5 rounded-xl text-left text-sm font-semibold transition-all duration-300 ${
                                        currentView === item.id
                                            ? 'bg-gradient-to-r from-sise-500 to-sise-600 text-white shadow-lg shadow-sise-500/25'
                                            : 'text-slate-500 hover:bg-sise-50 hover:text-sise-700'
                                    }`}
                                >
                                    <Icon name={item.icon} size={18} className="mr-3" />
                                    {item.label}
                                </button>
                            ))}
                        </nav>

                        <div className="absolute bottom-0 left-0 right-0 p-4 border-t border-slate-200/30">
                            {isStaffMode && (
                                <div className="flex items-center mb-2 px-1">
                                    <div className={`w-7 h-7 rounded-lg flex items-center justify-center ${currentAccess.role === 'manager' ? 'bg-amber-50 text-amber-500' : 'bg-sise-50 text-sise-500'}`}>
                                        <Icon name={currentAccess.role === 'manager' ? 'shield' : 'user'} size={14} />
                                    </div>
                                    <div className="ml-2">
                                        <p className="text-xs font-semibold text-slate-700 leading-tight">{currentAccess.name}</p>
                                        <p className="text-[10px] text-slate-400">
                                            {currentAccess.role === 'manager' ? '店舗責任者' : 'スタッフ'}
                                        </p>
                                    </div>
                                </div>
                            )}
                            <p className="text-[10px] text-slate-400 tracking-wider font-medium">
                                LAST UPDATE: {reportData.lastUpdated
                                    ? reportData.lastUpdated.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })
                                    : '--:--'
                                }
                            </p>
                        </div>
                    </aside>

                    {/* Bottom Navigation (Mobile) */}
                    <nav className="bottom-nav hide-desktop">
                        <div className="flex">
                            {navItems.slice(0, 5).map((item) => (
                                <button
                                    key={item.id}
                                    onClick={() => setCurrentView(item.id)}
                                    className={`bottom-nav-item ${currentView === item.id ? 'active' : ''}`}
                                >
                                    <Icon name={item.icon} size={20} />
                                    <span className="mt-0.5">{item.mobileLabel}</span>
                                </button>
                            ))}
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="pt-14 md:pt-16 lg:pl-56 min-h-screen relative z-10">
                        <div className="p-3 md:p-4 lg:p-8 max-w-7xl mx-auto pb-24 md:pb-8">
                            {memberData.loading || reportData.loading ? (
                                <div className="flex items-center justify-center h-64 animate-fade-in">
                                    <div className="text-center">
                                        <div className="w-12 h-12 border-3 border-sise-200 border-t-sise-500 rounded-full animate-spin mx-auto mb-4"></div>
                                        <p className="text-slate-400 text-xs tracking-widest font-semibold uppercase">Loading...</p>
                                    </div>
                                </div>
                            ) : (
                                renderView()
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        // アプリケーションのレンダリング
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
