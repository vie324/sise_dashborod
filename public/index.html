<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f5f6f3">
    <meta name="description" content="si'se 整体院ダッシュボード — SalonOne の実績から売上・インセンティブ・目標を管理">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/images/icon-192.png">
    <title>si'se ダッシュボード</title>

    <!-- テーマ（ライト/ダーク）を描画前に決める。設定 > 表示 で切り替え、未設定なら OS に合わせる -->
    <script>
        (function () {
            try {
                var pref = localStorage.getItem('sise_theme') || 'system';
                var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
                var apply = function () {
                    var p = localStorage.getItem('sise_theme') || 'system';
                    var dark = p === 'dark' || (p === 'system' && mq && mq.matches);
                    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
                    var meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) meta.setAttribute('content', dark ? '#0d110f' : '#f5f6f3');
                };
                apply();
                if (mq && mq.addEventListener) mq.addEventListener('change', apply);
                window.__siseApplyTheme = apply;
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <!-- iOS / Android: スタッフ個別 PWA マニフェスト注入
         「ホーム画面に追加」した時に start_url が "/" 固定だと、誰のスタッフ URL を
         開いていても管理者 URL で起動してしまう。?v=<token> がある時は同期的に
         マニフェストを作って差し替える（Service Worker 側でも同じ処理をする多重防御）。 -->
    <script>
        (function () {
            try {
                var token = new URLSearchParams(window.location.search).get('v');
                if (!token) return;
                var staffName = '';
                try {
                    var part = token.indexOf('.') >= 0 ? token.split('.')[0] : token;
                    var b64 = part.replace(/-/g, '+').replace(/_/g, '/');
                    while (b64.length % 4) b64 += '=';
                    var bin = atob(b64);
                    var bytes = new Uint8Array(bin.length);
                    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                    var decoded = JSON.parse(new TextDecoder('utf-8').decode(bytes));
                    if (decoded && decoded.n) staffName = String(decoded.n);
                } catch (_) { /* 名前なしで続行 */ }
                var shortName = staffName ? (staffName.length > 12 ? staffName.slice(0, 12) : staffName) : "si'se";
                if (staffName) {
                    var titleMeta = document.createElement('meta');
                    titleMeta.setAttribute('name', 'apple-mobile-web-app-title');
                    titleMeta.setAttribute('content', shortName);
                    document.head.appendChild(titleMeta);
                }
                var manifest = {
                    name: staffName ? "si'se - " + staffName : "si'se ダッシュボード",
                    short_name: shortName,
                    description: "si'se 整体院ダッシュボード",
                    start_url: '/?v=' + encodeURIComponent(token),
                    scope: '/',
                    display: 'standalone',
                    orientation: 'portrait',
                    background_color: '#f5f6f3',
                    theme_color: '#236c48',
                    lang: 'ja',
                    icons: [
                        { src: '/images/icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'any' },
                        { src: '/images/icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any' },
                        { src: '/images/icon-maskable-512.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' }
                    ],
                    categories: ['business', 'productivity']
                };
                var link = document.querySelector('link[rel="manifest"]');
                if (link && link.parentNode) link.parentNode.removeChild(link);
                var newLink = document.createElement('link');
                newLink.rel = 'manifest';
                newLink.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
                document.head.appendChild(newLink);
            } catch (e) { console.warn('[PWA] dynamic manifest error:', e && e.message); }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/assets/app.css">

    <style>
        /* JS 読み込み前の起動画面（app.css より先に表示されうるので素の CSS で書く） */
        #boot { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
                font-family: Inter, 'Noto Sans JP', 'Hiragino Sans', sans-serif; color: #7a837d; font-size: 13px; background: #f5f6f3; }
        [data-theme='dark'] #boot { background: #0d110f; color: #848e88; }
        #boot img { width: 44px; height: 44px; border-radius: 12px; }
        #boot .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(47,133,89,.15); overflow: hidden; }
        #boot .bar::after { content: ''; display: block; width: 40%; height: 100%; background: #2f8559; border-radius: 3px; animation: boot 1.1s ease-in-out infinite; }
        @keyframes boot { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    </style>
</head>
<body>
    <div id="root">
        <div id="boot" role="status" aria-live="polite">
            <img src="/images/logo.png" alt="">
            <div class="bar"></div>
            <span>読み込み中…</span>
        </div>
    </div>
    <noscript>このダッシュボードを使うには JavaScript を有効にしてください。</noscript>
    <script src="/assets/app.js" defer></script>
    <script>
        if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js').catch(function (err) { console.warn('SW registration failed:', err); });
            });
        }
    </script>
</body>
</html>
