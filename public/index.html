                                                    <p className="text-[10px] text-slate-400">有効日数</p>
                                                </div>
                                            </div>
                                            <p className="text-[11px] text-slate-400 mb-3">1回あたり: {formatCurrency(unitPrice)}</p>
                                            <div className="flex gap-2">
                                                <button
                                                    onClick={() => { setEditingPlan(plan); setPlanForm({ name: plan.name, sessions: plan.sessions, price: plan.price, validityDays: plan.validityDays }); setShowPlanForm(true); }}
                                                    className="flex-1 py-2.5 border border-slate-200 hover:bg-sise-50 rounded-xl text-xs font-medium text-slate-600 transition-all active:scale-95"
                                                >
                                                    <Icon name="pencil" size={14} className="inline mr-1" />編集
                                                </button>
                                                <button
                                                    onClick={() => { if (confirm(`「${plan.name}」を削除しますか？`)) deletePlan(plan.id); }}
                                                    className="py-2.5 px-3 border border-slate-200 hover:bg-red-50 hover:border-red-200 hover:text-red-500 rounded-xl text-xs text-slate-400 transition-all active:scale-95"
                                                >
                                                    <Icon name="trash-2" size={13} />
                                                </button>
                                            </div>
                                        </Card>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {/* 保存情報 */}
                    <Card className="!bg-slate-50/60">
                        <div className="flex items-start">
                            <Icon name="info" size={18} className="text-sise-500 mr-3 mt-0.5 flex-shrink-0" />
                            <div className="text-sm text-slate-600">
                                <p className="font-semibold text-slate-700 mb-1">回数券の管理について</p>
                                <p>回数券プランの作成、顧客への発行、消化状況のトラッキングが行えます。「スプシ保存」で Google Sheets にデータを送信できます。データはローカルにも自動保存されます。</p>
                                {lastSaved && (
                                    <p className="text-xs text-sise-500 mt-2">最終保存: {lastSaved.toLocaleString('ja-JP')}</p>
                                )}
                            </div>
                        </div>
                    </Card>
                </div>
            );
        };

        // ========================================
        // 利用管理ビュー（利用回数入力 + スプシ保存）
        // ========================================

        const MemberUsageView = ({ memberData, usageHook }) => {
            const {
                usageData, updateUsage, saveToSheet, getUsage, saving, lastSaved, lastSynced, syncFromGAS, currentMonth,
                planLimits, setPlanLimit, getPlanLimit,
                carryoverData, setCarryover, getCarryover
            } = usageHook;
            const [searchQuery, setSearchQuery] = useState('');
            const [showSaved, setShowSaved] = useState(false);
            const [sortBy, setSortBy] = useState('renewal'); // 'renewal' | 'name' | 'usage'
            const [showPlanLimitForm, setShowPlanLimitForm] = useState(false);
            const [editingCarryover, setEditingCarryover] = useState(null); // memberId for inline edit
            const [editingUsageCount, setEditingUsageCount] = useState(null); // memberId for direct input

            // 会員に請求期間情報を付与（残回数・繰越含む）
            const membersWithBilling = useMemo(() => {
                let members = (memberData.members || []).filter(m => m.status === 'ACTIVE');
                return members.map(m => {
                    const billing = getCurrentBillingPeriod(m.startDate);
                    const periodKey = billing ? billing.periodKey : null;
                    const count = getUsage(m.id, periodKey);
                    const planLimit = getPlanLimit(m.planName);
                    const carryover = periodKey ? getCarryover(m.id, periodKey) : 0;
                    const totalAllowed = planLimit + carryover; // 上限 + 繰越
                    const remaining = planLimit > 0 ? Math.max(0, totalAllowed - count) : null; // null = 上限未設定
                    return { ...m, billing, periodKey, count, planLimit, carryover, totalAllowed, remaining };
                });
            }, [memberData.members, getUsage, getPlanLimit, getCarryover]);

            // フィルタ & ソート
            const activeMembers = useMemo(() => {
                let list = membersWithBilling;
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    list = list.filter(m => m.name.toLowerCase().includes(q) || m.planName.toLowerCase().includes(q));
                }
                if (sortBy === 'renewal') {
                    list = [...list].sort((a, b) => ((a.billing && a.billing.daysUntilRenewal != null ? a.billing.daysUntilRenewal : 999)) - ((b.billing && b.billing.daysUntilRenewal != null ? b.billing.daysUntilRenewal : 999)));
                } else if (sortBy === 'name') {
                    list = [...list].sort((a, b) => a.name.localeCompare(b.name, 'ja'));
                } else if (sortBy === 'usage') {
                    list = [...list].sort((a, b) => a.count - b.count);
                }
                return list;
            }, [membersWithBilling, searchQuery, sortBy]);

            const totalUsage = useMemo(() => activeMembers.reduce((sum, m) => sum + m.count, 0), [activeMembers]);
            const avgUsage = activeMembers.length > 0 ? (totalUsage / activeMembers.length).toFixed(1) : 0;
            const zeroUsageCount = activeMembers.filter(m => m.count === 0).length;
            // 7日以内に更新日が来る会員数
            const renewingSoonCount = activeMembers.filter(m => m.billing && m.billing.daysUntilRenewal <= 7).length;

            const handleSave = async () => {
                await saveToSheet(memberData.members || []);
                setShowSaved(true);
                setTimeout(() => setShowSaved(false), 3000);
            };

            return (
                <div className="space-y-5 md:space-y-6 animate-fade-in">
                    <SectionHeader title="利用管理" subtitle="USAGE TRACKING" icon="clipboard-check">
                        <div className="flex items-center gap-2">
                            <button
                                onClick={syncFromGAS}
                                className="flex items-center px-3 py-2.5 bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-700 rounded-xl font-medium text-sm transition-all"
                                title="他のデバイスの変更を取得"
                            >
                                <Icon name="refresh-cw" size={16} className="mr-1.5" />
                                同期
                            </button>
                            <button
                                onClick={handleSave}
                                disabled={saving}
                                className="flex items-center px-4 py-2.5 btn-gradient rounded-xl font-medium text-sm transition-all disabled:opacity-50"
                            >
                                <Icon name={saving ? "loader" : "save"} size={16} className={`mr-2 ${saving ? 'animate-spin' : ''}`} />
                                {saving ? '保存中...' : 'スプシ保存'}
                            </button>
                        </div>
                    </SectionHeader>

                    {showSaved && (
                        <div className="bg-green-50/80 backdrop-blur-sm border border-green-200 rounded-xl p-3 animate-fade-in-up flex items-center">
                            <Icon name="check-circle" size={18} className="text-green-500 mr-2 flex-shrink-0" />
                            <p className="text-green-700 text-sm font-medium">利用データを保存しました</p>
                        </div>
                    )}

                    {/* KPIサマリ */}
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-2.5 md:gap-4">
                        <KpiCard
                            title="合計利用回数"
                            value={totalUsage}
                            subValue={`${activeMembers.length}名のアクティブ会員`}
                            icon="bar-chart-3"
                            gradientFrom="from-sise-400" gradientTo="to-sise-600"
                        />
                        <KpiCard
                            title="平均利用回数"
                            value={avgUsage}
                            subValue="現在の請求期間"
                            icon="activity"
                            gradientFrom="from-violet-400" gradientTo="to-violet-600"
                        />
                        <KpiCard
                            title="未利用会員"
                            value={zeroUsageCount}
                            subValue={zeroUsageCount > 0 ? 'フォロー推奨' : '全員利用済み'}
                            icon="alert-circle"
                            gradientFrom={zeroUsageCount > 0 ? "from-amber-400" : "from-emerald-400"}
                            gradientTo={zeroUsageCount > 0 ? "to-amber-600" : "to-emerald-600"}
                        />
                        <KpiCard
                            title="更新間近"
                            value={renewingSoonCount}
                            subValue="7日以内に更新"
                            icon="clock"
                            gradientFrom={renewingSoonCount > 0 ? "from-blue-400" : "from-slate-400"}
                            gradientTo={renewingSoonCount > 0 ? "to-blue-600" : "to-slate-500"}
                        />
                    </div>

                    {/* 検索 & ソート */}
                    <div className="flex flex-wrap items-center gap-2">
                        <div className="relative flex-1 min-w-[160px]">
                            <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                            <input
                                type="text"
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                placeholder="会員名で検索..."
                                className="w-full pl-8 pr-3 py-2.5 border border-slate-200 rounded-xl text-sm focus:border-sise-400 focus:ring-2 focus:ring-sise-400/20 outline-none bg-white/80"
                            />
                        </div>
                        <select
                            value={sortBy}
                            onChange={(e) => setSortBy(e.target.value)}
                            className="px-3 py-2.5 border border-slate-200 rounded-xl text-sm focus:border-sise-400 outline-none bg-white/80"
                        >
                            <option value="renewal">更新日が近い順</option>
                            <option value="usage">利用回数が少ない順</option>
                            <option value="name">名前順</option>
                        </select>
                    </div>

                    {/* プラン別利用上限設定 */}
                    <div className="flex items-center justify-between">
                        <button onClick={() => setShowPlanLimitForm(!showPlanLimitForm)}
                            className="flex items-center px-3 py-2 bg-violet-50 hover:bg-violet-100 border border-violet-200 text-violet-700 rounded-xl text-sm font-medium transition-all">
                            <Icon name="sliders" size={14} className="mr-1.5" />
                            プラン別上限設定 {Object.keys(planLimits).filter(k => planLimits[k] > 0).length > 0 ? `(${Object.keys(planLimits).filter(k => planLimits[k] > 0).length}プラン)` : ''}
                        </button>
                    </div>
                    {showPlanLimitForm && (() => {
                        // 現在のアクティブなプラン名を収集
                        const planNames = [...new Set(membersWithBilling.map(m => m.planName).filter(Boolean))];
                        return (
                            <Card className="!bg-violet-50/40 border-violet-200 animate-scale-in">
                                <h4 className="font-semibold text-slate-800 mb-2 text-sm">プラン別 月間利用上限</h4>
                                <p className="text-xs text-slate-500 mb-3">各プランの月間利用回数上限を設定すると、残回数が表示されます。0=無制限</p>
                                <div className="space-y-2">
                                    {planNames.map(name => (
                                        <div key={name} className="flex items-center gap-3 p-2 bg-white/80 rounded-lg border border-slate-200">
                                            <span className="text-sm font-medium text-slate-700 flex-1 truncate">{name}</span>
                                            <div className="flex items-center gap-1">
                                                <input type="number" min="0" value={planLimits[name] || ''} placeholder="0"
                                                    onChange={(e) => setPlanLimit(name, parseInt(e.target.value) || 0)}
                                                    className="w-16 px-2 py-1.5 border border-slate-200 rounded-lg text-sm text-center outline-none focus:border-violet-400" />
                                                <span className="text-xs text-slate-400">回/月</span>
                                            </div>
                                        </div>
                                    ))}
                                    {planNames.length === 0 && <p className="text-xs text-slate-400 py-2">アクティブな会員のプランがありません</p>}
                                </div>
                            </Card>
                        );
                    })()}

                    {/* 更新日ルール説明 */}
                    <div className="bg-blue-50/60 border border-blue-200/60 rounded-xl px-4 py-3 flex items-start">
                        <Icon name="info" size={16} className="text-blue-500 mr-2.5 mt-0.5 flex-shrink-0" />
                        <p className="text-xs text-blue-700">
                            各会員の<span className="font-bold">サブスク登録日</span>が毎月の更新日（課金日）になります。
                            31日登録の場合、28日/30日までの月は月末に課金されます。
                            利用回数は更新日ごとにリセットされます。
                            <br /><span className="font-bold">繰越:</span> 当月使い切れなかった回数は翌月まで繰り越し可能です（各カードの「繰越」から手動設定）。
                        </p>
                    </div>

                    {/* 会員利用回数カード */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-4">
                        {activeMembers.map((member) => {
                            const { billing, periodKey, count } = member;
                            const isRenewingSoon = billing && billing.daysUntilRenewal <= 7;
                            const usageLevel = count === 0 ? 'zero' : count <= 2 ? 'low' : count <= 5 ? 'mid' : 'high';
                            const cardBorder = isRenewingSoon
                                ? 'border-blue-300 bg-blue-50/20'
                                : {
                                    zero: 'border-amber-200 bg-amber-50/20',
                                    low: 'border-slate-200 bg-white/40',
                                    mid: 'border-sise-200 bg-sise-50/20',
                                    high: 'border-emerald-200 bg-emerald-50/20',
                                }[usageLevel];

                            return (
                                <div key={member.id} className={`glass-card !rounded-2xl p-4 ${cardBorder} hover:!transform-none`}>
                                    {/* ヘッダー: 名前 + 更新日 */}
                                    <div className="flex items-center mb-3">
                                        <Avatar name={member.name} size={38} />
                                        <div className="ml-3 flex-1 min-w-0">
                                            <p className="font-bold text-slate-800 text-sm truncate">{member.name}</p>
                                            <p className="text-[11px] text-slate-400 truncate">{member.planName}{member.storeName ? ` / ${member.storeName}` : ''}</p>
                                        </div>
                                    </div>

                                    {/* 請求期間バー */}
                                    {billing && (
                                        <div className="bg-slate-50/80 rounded-xl p-2.5 mb-3">
                                            <div className="flex items-center justify-between mb-1.5">
                                                <span className="text-[10px] text-slate-400 font-medium">
                                                    請求期間: {formatDateShort(billing.periodStart)} 〜 {formatDateShort(billing.periodEnd)}
                                                </span>
                                                <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${
                                                    billing.daysUntilRenewal <= 3 ? 'bg-red-100 text-red-600'
                                                    : billing.daysUntilRenewal <= 7 ? 'bg-blue-100 text-blue-600'
                                                    : 'bg-slate-100 text-slate-500'
                                                }`}>
                                                    あと{billing.daysUntilRenewal}日
                                                </span>
                                            </div>
                                            <div className="w-full bg-slate-200 rounded-full h-1.5">
                                                <div
                                                    className="h-1.5 rounded-full transition-all duration-700"
                                                    style={{
                                                        width: `${billing.progressPct}%`,
                                                        background: billing.daysUntilRenewal <= 3 ? '#ef4444'
                                                            : billing.daysUntilRenewal <= 7 ? '#3b82f6'
                                                            : '#33a065'
                                                    }}
                                                ></div>
                                            </div>
                                            <div className="flex items-center justify-between mt-1.5">
                                                <span className="text-[10px] text-slate-400">
                                                    更新日: 毎月<span className="font-bold text-slate-600">{billing.regDay}</span>日
                                                </span>
                                                <span className="text-[10px] text-slate-400">
                                                    次回: <span className="font-bold text-slate-600">{formatDateShort(billing.nextRenewal)}</span>
                                                </span>
                                            </div>
                                        </div>
                                    )}

                                    {/* 残回数表示（上限設定がある場合） */}
                                    {member.remaining !== null && (
                                        <div className="bg-gradient-to-r from-violet-50 to-blue-50 rounded-xl p-2.5 mb-3 border border-violet-100">
                                            <div className="flex items-center justify-between mb-1">
                                                <span className="text-[10px] text-violet-600 font-semibold">残回数</span>
                                                <span className="text-[10px] text-slate-400">
                                                    上限: {member.planLimit}回{member.carryover > 0 ? ` + 繰越${member.carryover}回` : ''}
                                                </span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <div className="flex-1">
                                                    <div className="w-full bg-violet-200/50 rounded-full h-2">
                                                        <div className="h-2 rounded-full transition-all duration-500"
                                                            style={{
                                                                width: `${member.totalAllowed > 0 ? Math.min(100, (count / member.totalAllowed) * 100) : 0}%`,
                                                                background: member.remaining <= 0 ? '#ef4444' : member.remaining <= 2 ? '#f59e0b' : '#8b5cf6'
                                                            }}
                                                        ></div>
                                                    </div>
                                                </div>
                                                <span className={`text-lg font-extrabold tabular-nums ${member.remaining <= 0 ? 'text-red-500' : member.remaining <= 2 ? 'text-amber-500' : 'text-violet-600'}`}>
                                                    {member.remaining}
                                                </span>
                                                <span className="text-[10px] text-slate-400">回</span>
                                            </div>
                                        </div>
                                    )}

                                    {/* 利用回数入力 */}
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center gap-2">
                                            <button
                                                onClick={() => updateUsage(member.id, count - 1, periodKey)}
                                                disabled={count <= 0}
                                                className="w-10 h-10 rounded-xl bg-white/80 border border-slate-200 flex items-center justify-center text-slate-500 hover:bg-red-50 hover:text-red-500 hover:border-red-200 transition-all disabled:opacity-30 active:scale-95"
                                            >
                                                <Icon name="minus" size={18} />
                                            </button>
                                            {editingUsageCount === member.id ? (
                                                <input type="number" min="0" autoFocus
                                                    defaultValue={count}
                                                    onBlur={(e) => { updateUsage(member.id, parseInt(e.target.value) || 0, periodKey); setEditingUsageCount(null); }}
                                                    onKeyDown={(e) => { if (e.key === 'Enter') { updateUsage(member.id, parseInt(e.target.value) || 0, periodKey); setEditingUsageCount(null); } }}
                                                    className="w-16 text-center text-2xl font-extrabold text-slate-800 border-2 border-sise-400 rounded-lg py-1 outline-none" />
                                            ) : (
                                                <div className="w-16 text-center cursor-pointer" onClick={() => setEditingUsageCount(member.id)} title="クリックで直接入力">
                                                    <span className="text-3xl font-extrabold text-slate-800 tabular-nums">{count}</span>
                                                    <p className="text-[9px] text-slate-400 -mt-0.5">回（タップで編集）</p>
                                                </div>
                                            )}
                                            <button
                                                onClick={() => updateUsage(member.id, count + 1, periodKey)}
                                                className="w-10 h-10 rounded-xl bg-white/80 border border-slate-200 flex items-center justify-center text-slate-500 hover:bg-sise-50 hover:text-sise-600 hover:border-sise-200 transition-all active:scale-95"
                                            >
                                                <Icon name="plus" size={18} />
                                            </button>
                                        </div>
                                        <div className="flex flex-col items-end gap-1">
                                            {member.remaining !== null && member.remaining <= 0 && count > 0 && (
                                                <span className="text-[10px] font-semibold text-red-600 bg-red-100 px-2 py-0.5 rounded-lg">上限到達</span>
                                            )}
                                            {count === 0 && (
                                                <span className="text-[10px] font-semibold text-amber-600 bg-amber-100 px-2 py-0.5 rounded-lg">未利用</span>
                                            )}
                                            {count > 0 && (member.remaining === null || member.remaining > 0) && count <= 2 && (
                                                <span className="text-[10px] font-semibold text-blue-600 bg-blue-100 px-2 py-0.5 rounded-lg">少なめ</span>
                                            )}
                                            {count > 2 && count <= 5 && (member.remaining === null || member.remaining > 0) && (
                                                <span className="text-[10px] font-semibold text-sise-600 bg-sise-100 px-2 py-0.5 rounded-lg">通常</span>
                                            )}
                                            {count > 5 && (member.remaining === null || member.remaining > 0) && (
                                                <span className="text-[10px] font-semibold text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded-lg">多い</span>
                                            )}
                                            {isRenewingSoon && (
                                                <span className="text-[10px] font-semibold text-blue-600 bg-blue-100 px-2 py-0.5 rounded-lg flex items-center">
                                                    <Icon name="clock" size={10} className="mr-0.5" />更新間近
                                                </span>
                                            )}
                                        </div>
                                    </div>

                                    {/* 繰越設定 */}
                                    <div className="mt-2 flex items-center justify-between">
                                        {editingCarryover === member.id ? (
                                            <div className="flex items-center gap-2 animate-scale-in">
                                                <span className="text-[10px] text-violet-600 font-medium">繰越回数:</span>
                                                <input type="number" min="0" autoFocus defaultValue={member.carryover}
                                                    onBlur={(e) => { setCarryover(member.id, periodKey, parseInt(e.target.value) || 0); setEditingCarryover(null); }}
                                                    onKeyDown={(e) => { if (e.key === 'Enter') { setCarryover(member.id, periodKey, parseInt(e.target.value) || 0); setEditingCarryover(null); } }}
                                                    className="w-14 px-2 py-1 border border-violet-300 rounded-lg text-sm text-center outline-none" />
                                                <span className="text-[10px] text-slate-400">回</span>
                                            </div>
                                        ) : (
                                            <button onClick={() => setEditingCarryover(member.id)}
                                                className="text-[10px] text-violet-500 hover:text-violet-700 font-medium flex items-center transition-colors">
                                                <Icon name="arrow-right-left" size={10} className="mr-0.5" />
                                                繰越: {member.carryover > 0 ? `${member.carryover}回` : '設定'}
                                            </button>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {activeMembers.length === 0 && (
                        <div className="text-center py-12 text-slate-400">
                            <div className="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center mx-auto mb-3">
                                <Icon name="clipboard-x" size={28} className="text-slate-300" />
                            </div>
                            <p className="font-medium">アクティブ会員がいません</p>
                        </div>
                    )}

                    {/* 保存情報 */}
                    <Card className="!bg-slate-50/60">
                        <div className="flex items-start">
                            <Icon name="info" size={18} className="text-sise-500 mr-3 mt-0.5 flex-shrink-0" />
                            <div className="text-sm text-slate-600">
                                <p className="font-semibold text-slate-700 mb-1">利用回数の記録について</p>
                                <p>各会員の利用回数はサブスク更新日ごとの請求期間で管理されます。更新日を迎えると自動的に新しい期間にリセットされます。</p>
                                <p className="mt-1.5">例: 15日登録の会員 → 毎月15日〜翌月14日が1期間</p>
                                <p className="mt-1">31日登録の会員 → 2月は28日(29日)、4月は30日が更新日になります</p>
                                <p className="mt-1.5 text-sise-600 font-medium">データは30秒ごとに自動同期されます。どのデバイスから操作しても即時反映されます。</p>
                                <div className="flex flex-wrap gap-3 mt-2">
                                    {lastSaved && (
                                        <p className="text-xs text-sise-500">最終保存: {lastSaved.toLocaleString('ja-JP')}</p>
                                    )}

        // ========================================
        // スタッフ管理セクション

        const StaffManagementSection = () => {

            const handleSave = () => {

                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">役割</label>
                                    <div className="flex gap-3">
                                        <label className={`flex items-center px-4 py-2.5 rounded-xl border cursor-pointer transition-all ${formData.role === 'staff' ? 'bg-sise-50 border-sise-300 text-sise-700' : 'bg-white border-slate-200 text-slate-600 hover:border-slate-300'}`}>
                                            <input type="radio" name="role" value="staff" checked={formData.role === 'staff'} onChange={() => setFormData(prev => ({ ...prev, role: 'staff' }))} className="sr-only" />
                                            <Icon name="user" size={16} className="mr-2" />
                                            <div>
                                                <p className="text-sm font-medium">スタッフ</p>
                                                <p className="text-[10px] text-slate-400">自店舗のみ閲覧</p>

                                        <label className={`flex items-center px-4 py-2.5 rounded-xl border cursor-pointer transition-all ${formData.role === 'manager' ? 'bg-sise-50 border-sise-300 text-sise-700' : 'bg-white border-slate-200 text-slate-600 hover:border-slate-300'}`}>
                                            <input type="radio" name="role" value="manager" checked={formData.role === 'manager'} onChange={() => setFormData(prev => ({ ...prev, role: 'manager' }))} className="sr-only" />

                                            <div>
                                                <p className="text-sm font-medium">店舗責任者</p>

                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">
                                        {formData.role === 'manager' ? '閲覧可能な店舗（複数選択可）' : '所属店舗'}
                                    </label>
                                    {serverStores.length > 0 ? (
                                        <div className="space-y-2">

                                                    <input

                                                        checked={formData.storeIds.includes(store.id)}
                                                        onChange={() => toggleStoreId(store.id)}
                                                        className="w-4 h-4 text-sise-500 border-slate-300 rounded focus:ring-sise-400"

                                                    <span className="ml-2 text-sm text-slate-700">{store.name}</span>
                                                    <span className="ml-auto text-xs text-slate-400">ID: {store.id}</span>

                                    ) : (
                                        <p className="text-sm text-slate-500 bg-slate-50 p-3 rounded-lg">
                                            店舗が未設定です。先にSquare APIを接続してください。<br />
                                            デモモードでも手動で店舗IDを指定できます。
                                        </p>

                                    {serverStores.length === 0 && (
                                        <div className="mt-2">
                                            <label className="block text-xs font-medium text-slate-500 mb-1">店舗ID（手動入力、カンマ区切り）</label>
                                            <input
                                                type="text"
                                                value={formData.storeIds.join(',')}

                                                placeholder="例: 1,2,3"

                                >
                                    {editingStaff ? '更新' : '追加'}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* スタッフ一覧 */}
                    {staffList.length > 0 ? (
                        <div className="space-y-3">
                            {staffList.map(staff => (
                                <div key={staff.id} className="p-4 bg-white rounded-xl border border-slate-200 hover:border-sise-200 transition-colors">
                                    <div className="flex items-start justify-between">
                                        <div className="flex items-center">
                                            <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${staff.role === 'manager' ? 'bg-amber-50 text-amber-600' : 'bg-sise-50 text-sise-600'}`}>
                                                <Icon name={staff.role === 'manager' ? 'shield' : 'user'} size={20} />
                                            </div>
                                            <div className="ml-3">
                                                <p className="font-semibold text-slate-800">{staff.name}</p>
                                                <div className="flex items-center gap-2 mt-0.5">
                                                    <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${staff.role === 'manager' ? 'bg-amber-100 text-amber-700' : 'bg-sise-100 text-sise-700'}`}>
                                                        {staff.role === 'manager' ? '店舗責任者' : 'スタッフ'}
                                                    </span>
                                                    <span className="text-xs text-slate-400">
                                                        {(staff.storeIds || []).map(sid => {
                                                            const store = serverStores.find(s => s.id === sid);
                                                            return store ? store.name : `店舗${sid}`;

                                                    </span>
                                                </div>
                                            </div>

                                        <div className="flex items-center gap-1">
                                            <button
                                                onClick={() => handleCopyUrl(staff)}
                                                className={`flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all ${copiedId === staff.id ? 'bg-green-100 text-green-700' : 'bg-slate-100 hover:bg-sise-50 text-slate-600 hover:text-sise-600'}`}
                                                title="URLをコピー"
                                            >
                                                <Icon name={copiedId === staff.id ? 'check' : 'link'} size={14} className="mr-1" />
                                                {copiedId === staff.id ? 'コピー済' : 'URL'}
                                            </button>
                                            <button
                                                onClick={() => handleEdit(staff)}
                                                className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-400 hover:text-slate-600 transition-colors"
                                                title="編集"
                                            >
                                                <Icon name="pencil" size={14} />
                                            </button>
                                            <button
                                                onClick={() => handleDelete(staff.id)}
                                                className="p-1.5 rounded-lg hover:bg-red-50 text-slate-400 hover:text-red-500 transition-colors"
                                                title="削除"
                                            >
                                                <Icon name="trash-2" size={14} />
                                            </button>
                                        </div>
                                    </div>
                                </div>

                        </div>
                    ) : (
                        !isAdding && (
                            <div className="text-center py-8">
                                <div className="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center mx-auto mb-3">
                                    <Icon name="users" size={28} className="text-slate-300" />
                                </div>
                                <p className="text-slate-500 text-sm">スタッフが登録されていません</p>
                                <p className="text-slate-400 text-xs mt-1">「スタッフを追加」から登録してください</p>
                            </div>
                        )
                    )}

                    {/* ヘルプ */}
                    <div className="mt-4 p-3 bg-slate-50 rounded-lg border border-slate-200">
                        <p className="text-xs text-slate-500 leading-relaxed">
                            <Icon name="info" size={12} className="inline mr-1" />
                            各スタッフの「URL」ボタンで専用リンクをコピーできます。
                            そのURLを開くと、割り当てられた店舗のデータのみ表示されます。
                            店舗責任者は複数店舗を閲覧可能です。管理者（URLなし）は全データにアクセスできます。
                        </p>
                    </div>
                </Card>
            );
        };

        // ========================================
        // マーケティングデータ連携
        // ========================================

        // HPBデータのlocalStorage管理
        const HPB_STORAGE_KEY = 'sise_hpb_data';

        const useMarketingData = () => {
            const [metaConfig, setMetaConfig] = useState({ configured: false, loading: true });
            const [tiktokConfig, setTiktokConfig] = useState({ configured: false, loading: true });
            const [metaData, setMetaData] = useState({ campaigns: [], insights: null, loading: false, error: null });
            const [tiktokData, setTiktokData] = useState({ campaigns: [], insights: null, loading: false, error: null });
            const [hpbData, setHpbData] = useState(() => {
                try {
                    const saved = localStorage.getItem(HPB_STORAGE_KEY);
                    return saved ? JSON.parse(saved) : { monthly: [], settings: { avgViews: 300, avgBookingRate: 2.5 } };
                } catch { return { monthly: [], settings: { avgViews: 300, avgBookingRate: 2.5 } }; }
            });

            // HPBデータの保存
            const saveHpbData = useCallback((data) => {
                setHpbData(data);
                localStorage.setItem(HPB_STORAGE_KEY, JSON.stringify(data));
            }, []);

            // HPB月次データ追加/更新
            const upsertHpbMonth = useCallback((entry) => {
                setHpbData(prev => {
                    const existing = prev.monthly.findIndex(m => m.yearMonth === entry.yearMonth);
                    const updated = { ...prev };
                    if (existing >= 0) {
                        updated.monthly = [...prev.monthly];
                        updated.monthly[existing] = { ...prev.monthly[existing], ...entry };
                    } else {
                        updated.monthly = [...prev.monthly, entry].sort((a, b) => a.yearMonth.localeCompare(b.yearMonth));
                    }
                    localStorage.setItem(HPB_STORAGE_KEY, JSON.stringify(updated));
                    return updated;
                });
            }, []);

            // HPB設定更新
            const updateHpbSettings = useCallback((settings) => {
                setHpbData(prev => {
                    const updated = { ...prev, settings: { ...prev.settings, ...settings } };
                    localStorage.setItem(HPB_STORAGE_KEY, JSON.stringify(updated));
                    return updated;
                });
            }, []);

            // HPBデータ削除
            const deleteHpbMonth = useCallback((yearMonth) => {
                setHpbData(prev => {
                    const updated = { ...prev, monthly: prev.monthly.filter(m => m.yearMonth !== yearMonth) };
                    localStorage.setItem(HPB_STORAGE_KEY, JSON.stringify(updated));
                    return updated;
                });
            }, []);

            // Meta / TikTok設定取得
            useEffect(() => {
                (async () => {
                    try {
                        const res = await fetch(`${META_PROXY_BASE}/config`);
                        if (res.ok) setMetaConfig({ ...(await res.json()), loading: false });
                        else setMetaConfig({ configured: false, loading: false });
                    } catch { setMetaConfig({ configured: false, loading: false }); }
                })();
                (async () => {
                    try {
                        const res = await fetch(`${TIKTOK_PROXY_BASE}/config`);
                        if (res.ok) setTiktokConfig({ ...(await res.json()), loading: false });
                        else setTiktokConfig({ configured: false, loading: false });
                    } catch { setTiktokConfig({ configured: false, loading: false }); }
                })();
            }, []);

            // Meta広告データ取得
            const fetchMetaInsights = useCallback(async (datePreset = 'last_30d') => {
                if (!metaConfig.configured) return;
                setMetaData(prev => ({ ...prev, loading: true, error: null }));
                try {
                    // キャンペーン一覧
                    const campRes = await fetch(`${META_PROXY_BASE}/campaigns?fields=name,status,objective,daily_budget,lifetime_budget&limit=50`);
                    const campData = campRes.ok ? await campRes.json() : { data: [] };

                    // インサイト取得
                    const insightRes = await fetch(
                        `${META_PROXY_BASE}/insights?fields=impressions,clicks,ctr,spend,actions,cost_per_action_type,cpc,cpm,reach,frequency&date_preset=${datePreset}&level=account`
                    );
                    const insightData = insightRes.ok ? await insightRes.json() : { data: [] };

                    // キャンペーン別インサイト
                    const campInsightRes = await fetch(
                        `${META_PROXY_BASE}/insights?fields=campaign_name,impressions,clicks,ctr,spend,actions,cost_per_action_type&date_preset=${datePreset}&level=campaign&limit=50`
                    );
                    const campInsightData = campInsightRes.ok ? await campInsightRes.json() : { data: [] };

                    setMetaData({
                        campaigns: campData.data || [],
                        insights: (insightData.data || [])[0] || null,
                        campaignInsights: campInsightData.data || [],
                        loading: false,
                        error: null
                    });
                } catch (error) {
                    setMetaData(prev => ({ ...prev, loading: false, error: error.message }));
                }
            }, [metaConfig.configured]);

            // TikTok広告データ取得
            const fetchTiktokInsights = useCallback(async (startDate, endDate) => {
                if (!tiktokConfig.configured) return;
                setTiktokData(prev => ({ ...prev, loading: true, error: null }));
                try {
                    const now = new Date();
                    const start = startDate || new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
                    const end = endDate || now.toISOString().split('T')[0];

                    // キャンペーン一覧
                    const campRes = await fetch(`${TIKTOK_PROXY_BASE}/campaign/get`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ page_size: 100 })
                    });
                    const campData = campRes.ok ? await campRes.json() : { data: { list: [] } };

                    // レポート取得
                    const reportRes = await fetch(`${TIKTOK_PROXY_BASE}/report/integrated/get`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            report_type: 'BASIC',
                            data_level: 'AUCTION_ADVERTISER',
                            dimensions: ['stat_time_day'],
                            metrics: ['spend', 'impressions', 'clicks', 'ctr', 'cpc', 'cpm', 'reach', 'conversion', 'cost_per_conversion', 'video_play_actions', 'video_watched_2s', 'video_watched_6s'],
                            start_date: start,
                            end_date: end
                        })
                    });
                    const reportData = reportRes.ok ? await reportRes.json() : { data: { list: [] } };

                    setTiktokData({
                        campaigns: campData.data?.list || [],
                        insights: reportData.data?.list || [],
                        loading: false,
                        error: null
                    });
                } catch (error) {
                    setTiktokData(prev => ({ ...prev, loading: false, error: error.message }));
                }
            }, [tiktokConfig.configured]);

            return {
                metaConfig, tiktokConfig,
                metaData, tiktokData, hpbData,
                fetchMetaInsights, fetchTiktokInsights,
                upsertHpbMonth, updateHpbSettings, deleteHpbMonth, saveHpbData
            };
        };

        // ========================================
        // 出納帳ビュー
        // ========================================

        const CashbookView = ({ cashbookHook, memberData, manualMembersHook }) => {
            const { entries, addEntry, updateEntry, deleteEntry } = cashbookHook;
            const [showForm, setShowForm] = useState(false);
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().slice(0, 10));
            const [viewMonth, setViewMonth] = useState(new Date().toISOString().slice(0, 7));
            const [editingId, setEditingId] = useState(null);
            const [formData, setFormData] = useState({
                date: new Date().toISOString().slice(0, 10),
                type: 'income',
                category: '施術売上',
                description: '',
                amount: '',
                customerName: '',
                treatmentCount: '1',
                paymentMethod: 'CASH',
                notes: ''
            });

            const incomeCategories = ['施術売上', 'サブスク月額', '回数券販売', '物販', 'その他収入'];
            const expenseCategories = ['家賃', '水道光熱費', '消耗品', '広告費', '人件費', '設備', '交通費', 'その他経費'];

            // 月別フィルタ
            const monthEntries = useMemo(() => {
                return (entries || [])
                    .filter(e => e.date && e.date.startsWith(viewMonth))
                    .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt));
            }, [entries, viewMonth]);

            // 日別グループ
            const dailyGroups = useMemo(() => {
                const groups = {};
                monthEntries.forEach(e => {
                    if (!groups[e.date]) groups[e.date] = [];
                    groups[e.date].push(e);
                });
                return Object.entries(groups).sort((a, b) => b[0].localeCompare(a[0]));
            }, [monthEntries]);

            // 月間集計
            const monthSummary = useMemo(() => {
                const income = monthEntries.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
                const expense = monthEntries.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
                const totalTreatments = monthEntries.reduce((s, e) => s + (e.treatmentCount || 0), 0);
                const totalCustomers = new Set(monthEntries.filter(e => e.customerName).map(e => e.customerName)).size;

                // カテゴリ別集計
                const byCategory = {};
                monthEntries.forEach(e => {
                    if (!byCategory[e.category]) byCategory[e.category] = 0;
                    byCategory[e.category] += e.amount;
                });

                return { income, expense, profit: income - expense, totalTreatments, totalCustomers, byCategory };
            }, [monthEntries]);

            // 日別集計
            const getDailySummary = (dayEntries) => {
                const income = dayEntries.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
                const expense = dayEntries.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
                const treatments = dayEntries.reduce((s, e) => s + (e.treatmentCount || 0), 0);
                return { income, expense, treatments };
            };

            // 全メンバーリスト（会員名候補）
            const allMemberNames = useMemo(() => {
                const names = new Set();
                (memberData?.members || []).forEach(m => names.add(m.name));
                (manualMembersHook?.manualMembers || []).forEach(m => names.add(m.name));
                return [...names].filter(Boolean).sort((a, b) => a.localeCompare(b, 'ja'));
            }, [memberData?.members, manualMembersHook?.manualMembers]);

            const resetForm = () => {
                setFormData({
                    date: selectedDate,
                    type: 'income',
                    category: '施術売上',
                    description: '',
                    amount: '',
                    customerName: '',
                    treatmentCount: '1',
                    paymentMethod: 'CASH',
                    notes: ''
                });
                setEditingId(null);
            };

            const handleSubmit = () => {
                if (!formData.amount || parseInt(formData.amount) <= 0) return;
                if (editingId) {
                    updateEntry(editingId, {
                        ...formData,
                        amount: parseInt(formData.amount),
                        treatmentCount: parseInt(formData.treatmentCount) || 0
                    });
                } else {
                    addEntry({
                        ...formData,
                        amount: parseInt(formData.amount),
                        treatmentCount: parseInt(formData.treatmentCount) || 0
                    });
                }
                resetForm();
                setShowForm(false);
            };

            const handleEdit = (entry) => {
                setFormData({
                    date: entry.date,
                    type: entry.type,
                    category: entry.category,
                    description: entry.description || '',
                    amount: String(entry.amount),
                    customerName: entry.customerName || '',
                    treatmentCount: String(entry.treatmentCount || 0),
                    paymentMethod: entry.paymentMethod || 'CASH',
                    notes: entry.notes || ''
                });
                setEditingId(entry.id);
                setShowForm(true);
            };

            const changeMonth = (delta) => {
                const d = new Date(viewMonth + '-01');
                d.setMonth(d.getMonth() + delta);
                setViewMonth(d.toISOString().slice(0, 7));
            };

            return (

                                                        entry.type === 'income' ? 'bg-sise-50 text-sise-600' : 'bg-red-50 text-red-500'

                                                            )}
                                                        </div>
                                                        {entry.description && <p className="text-[11px] text-slate-400 truncate mt-0.5">{entry.description}</p>}
                                                    </div>

                                                    {/* 金額 */}
                                                    <div className="flex items-center gap-1.5 ml-2">
                                                        <span className={`text-sm font-bold ${entry.type === 'income' ? 'text-sise-700' : 'text-red-600'}`}>
                                                            {entry.type === 'income' ? '+' : '-'}{formatCurrency(entry.amount)}
                                                        </span>
                                                        <span className={`text-[11px] px-1.5 py-0.5 rounded font-semibold ${
                                                            entry.paymentMethod === 'QR' ? 'bg-blue-50 text-blue-600' :
                                                            entry.paymentMethod === 'CARD' || entry.paymentMethod === 'SQUARE' ? 'bg-purple-50 text-purple-600' :
                                                            entry.paymentMethod === 'TRANSFER' ? 'bg-indigo-50 text-indigo-600' :
                                                            'bg-amber-50 text-amber-600'
                                                        }`}>
                                                            {entry.paymentMethod === 'QR' ? 'QR' : entry.paymentMethod === 'CARD' ? 'ｶｰﾄﾞ' : entry.paymentMethod === 'SQUARE' ? 'Sq' : entry.paymentMethod === 'TRANSFER' ? '振込' : '現金'}

                                    <p className="text-xs font-semibold text-red-500 mb-2">支出</p>

                                        {Object.entries(monthSummary.byCategory)
                                            .filter(([cat]) => expenseCategories.includes(cat))
                                            .sort((a, b) => b[1] - a[1])
                                            .map(([cat, amount]) => (

                                                    <span className="text-xs font-medium text-slate-700">{cat}</span>
                                                    <span className="text-xs font-bold text-red-600">{formatCurrency(amount)}</span>

        // ========================================

        const MarketingView = ({ marketingHook }) => {
            const {
                metaConfig, tiktokConfig,
                metaData, tiktokData, hpbData,
                fetchMetaInsights, fetchTiktokInsights,
                upsertHpbMonth, updateHpbSettings, deleteHpbMonth
            } = marketingHook;

            const [activeTab, setActiveTab] = useState('hpb');
            const [metaDatePreset, setMetaDatePreset] = useState('last_30d');

            // HPBフォーム
            const [hpbForm, setHpbForm] = useState({
                yearMonth: new Date().toISOString().slice(0, 7),
                pageViews: '', bookings: '', reviews: '', favorites: '', blogViews: '', coupons: ''
            });
            const [hpbEditingMonth, setHpbEditingMonth] = useState(null);

            // Meta/TikTokデータ自動取得
            useEffect(() => {
                if (activeTab === 'meta' && metaConfig.configured && !metaData.insights && !metaData.loading) {
                    fetchMetaInsights(metaDatePreset);
                }
            }, [activeTab, metaConfig.configured]);

            useEffect(() => {
                if (activeTab === 'tiktok' && tiktokConfig.configured && !tiktokData.insights && !tiktokData.loading) {
                    fetchTiktokInsights();
                }
            }, [activeTab, tiktokConfig.configured]);

            const tabs = [
                { id: 'hpb', label: 'ホットペッパー', icon: 'globe' },
                { id: 'meta', label: 'Meta広告', icon: 'facebook' },
                { id: 'tiktok', label: 'TikTok広告', icon: 'video' },
            ];

            // ====== HPBセクション ======
            const renderHpbSection = () => {
                const settings = hpbData.settings || { avgViews: 300, avgBookingRate: 2.5 };
                const monthlyData = hpbData.monthly || [];

                // 最新月のデータ
                const latestMonth = monthlyData.length > 0 ? monthlyData[monthlyData.length - 1] : null;
                const prevMonth = monthlyData.length > 1 ? monthlyData[monthlyData.length - 2] : null;

                const bookingRate = latestMonth && latestMonth.pageViews > 0
                    ? (latestMonth.bookings / latestMonth.pageViews * 100)
                    : 0;
                const viewsDiff = latestMonth ? latestMonth.pageViews - settings.avgViews : 0;
                const rateDiff = bookingRate - settings.avgBookingRate;

                const handleHpbSubmit = () => {
                    if (!hpbForm.yearMonth) return;
                    upsertHpbMonth({
                        yearMonth: hpbForm.yearMonth,
                        pageViews: parseInt(hpbForm.pageViews) || 0,
                        bookings: parseInt(hpbForm.bookings) || 0,
                        reviews: parseInt(hpbForm.reviews) || 0,
                        favorites: parseInt(hpbForm.favorites) || 0,
                        blogViews: parseInt(hpbForm.blogViews) || 0,
                        coupons: parseInt(hpbForm.coupons) || 0,
                    });
                    setHpbForm({ yearMonth: hpbForm.yearMonth, pageViews: '', bookings: '', reviews: '', favorites: '', blogViews: '', coupons: '' });
                    setHpbEditingMonth(null);
                };

                const startEdit = (m) => {
                    setHpbEditingMonth(m.yearMonth);
                    setHpbForm({
                        yearMonth: m.yearMonth,
                        pageViews: m.pageViews?.toString() || '',
                        bookings: m.bookings?.toString() || '',
                        reviews: m.reviews?.toString() || '',
                        favorites: m.favorites?.toString() || '',
                        blogViews: m.blogViews?.toString() || '',
                        coupons: m.coupons?.toString() || '',
                    });
                };

                return (
                    <div className="space-y-6">
                        {/* KPI概要 */}
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <KpiCard
                                title="月間PV数"
                                value={latestMonth ? latestMonth.pageViews.toLocaleString() : '-'}
                                subValue={latestMonth ? `業界平均比 ${viewsDiff >= 0 ? '+' : ''}${viewsDiff}` : ''}
                                icon="eye"
                                trend={viewsDiff >= 0 ? 'up' : 'down'}
                            />
                            <KpiCard
                                title="予約獲得数"
                                value={latestMonth ? latestMonth.bookings.toLocaleString() : '-'}
                                subValue={prevMonth ? `前月: ${prevMonth.bookings}件` : ''}
                                icon="calendar-check"
                                trend={latestMonth && prevMonth && latestMonth.bookings >= prevMonth.bookings ? 'up' : 'down'}
                            />
                            <KpiCard
                                title="予約率"
                                value={latestMonth ? `${bookingRate.toFixed(1)}%` : '-'}
                                subValue={`業界平均: ${settings.avgBookingRate}%（差: ${rateDiff >= 0 ? '+' : ''}${rateDiff.toFixed(1)}%）`}
                                icon="target"
                                trend={rateDiff >= 0 ? 'up' : 'down'}
                            />
                            <KpiCard
                                title="口コミ数"
                                value={latestMonth ? latestMonth.reviews?.toLocaleString() || '0' : '-'}
                                subValue={prevMonth ? `前月: ${prevMonth.reviews || 0}件` : ''}
                                icon="message-circle"
                                trend={latestMonth && prevMonth && (latestMonth.reviews || 0) >= (prevMonth.reviews || 0) ? 'up' : 'down'}
                            />
                        </div>

                        {/* 業界平均設定 */}
                        <Card>
                            <div className="flex items-center gap-2 mb-3">
                                <Icon name="settings" size={16} />
                                <h3 className="font-semibold text-sm">比較基準設定（業界平均）</h3>
                            </div>
                            <div className="flex flex-wrap gap-4">
                                <label className="flex items-center gap-2 text-sm">
                                    平均PV数:
                                    <input type="number" value={settings.avgViews}
                                        onChange={(e) => updateHpbSettings({ avgViews: parseInt(e.target.value) || 0 })}
                                        className="w-24 px-2 py-1 border rounded text-sm dark:bg-gray-700 dark:border-gray-600"
                                    />
                                </label>
                                <label className="flex items-center gap-2 text-sm">
                                    平均予約率(%):
                                    <input type="number" step="0.1" value={settings.avgBookingRate}
                                        onChange={(e) => updateHpbSettings({ avgBookingRate: parseFloat(e.target.value) || 0 })}
                                        className="w-24 px-2 py-1 border rounded text-sm dark:bg-gray-700 dark:border-gray-600"
                                    />
                                </label>

                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            // プルトゥリフレッシュ
            const [pullState, setPullState] = useState({ pulling: false, refreshing: false, distance: 0 });
            const pullStartY = React.useRef(0);
            const isPulling = React.useRef(false);

            useEffect(() => {
                const THRESHOLD = 60;
                let startY = 0;

                const onTouchStart = (e) => {
                    if (window.scrollY === 0) {
                        startY = e.touches[0].clientY;
                        isPulling.current = true;
                    }
                };
                const onTouchMove = (e) => {
                    if (!isPulling.current || window.scrollY > 0) return;
                    const dist = Math.max(0, e.touches[0].clientY - startY);
                    if (dist > 10) {
                        setPullState(prev => ({ ...prev, pulling: true, distance: Math.min(dist, THRESHOLD * 1.5) }));
                    }
                };
                const onTouchEnd = () => {
                    if (!isPulling.current) return;
                    isPulling.current = false;
                    if (pullState.distance >= THRESHOLD) {
                        setPullState({ pulling: false, refreshing: true, distance: 0 });
                        Promise.all([refreshReportData(), refreshSquareData()])
                            .finally(() => {
                                setTimeout(() => setPullState({ pulling: false, refreshing: false, distance: 0 }), 600);
                            });
                    } else {
                        setPullState({ pulling: false, refreshing: false, distance: 0 });
                    }
                };

                document.addEventListener('touchstart', onTouchStart, { passive: true });
                document.addEventListener('touchmove', onTouchMove, { passive: true });
                document.addEventListener('touchend', onTouchEnd, { passive: true });
                return () => {
                    document.removeEventListener('touchstart', onTouchStart);
                    document.removeEventListener('touchmove', onTouchMove);
                    document.removeEventListener('touchend', onTouchEnd);
                };
