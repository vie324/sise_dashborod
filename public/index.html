<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>si'se - 整体院経営ダッシュボード</title>

    <!-- Google Fonts (非ブロッキング) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Recharts Dependencies -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

    <!-- Babel (for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- QR Code Generator -->
    <script src="https://unpkg.com/qrcode@1.5.4/build/qrcode.min.js"></script>

    <!-- Custom Config for Tailwind (si'se Theme - Enhanced) -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        sise: {
                            50: '#f0faf4',
                            100: '#dbf2e3',
                            200: '#b9e5ca',
                            300: '#88d1a8',
                            400: '#55b87f',
                            500: '#33a065',
                            600: '#238050',
                            700: '#1d6641',
                            800: '#1a5136',
                            900: '#16432d',
                            950: '#0b2519',
                        },
                        coral: {
                            50: '#fff5f2',
                            100: '#ffe8e0',
                            200: '#ffd0c2',
                            300: '#ffab93',
                            400: '#ff7f5c',
                            500: '#ff5733',
                            600: '#e63e1a',
                        },
                        accent: {
                            50: '#fefce8',
                            100: '#fef9c3',
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04',
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans JP"', '"Hiragino Sans"', 'sans-serif'],
                        display: ['"Noto Sans JP"', 'sans-serif'],
                    },
                    keyframes: {
                        'fade-in-up': {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        'fade-in': {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        'slide-in-right': {
                            '0%': { opacity: '0', transform: 'translateX(-24px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        },
                        'scale-in': {
                            '0%': { opacity: '0', transform: 'scale(0.92)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                        'count-up': {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        'float': {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-12px)' },
                        },
                        'float-slow': {
                            '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                            '50%': { transform: 'translateY(-8px) rotate(3deg)' },
                        },
                        'gradient-shift': {
                            '0%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                            '100%': { backgroundPosition: '0% 50%' },
                        },
                        'shimmer': {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' },
                        },
                        'glow-pulse': {
                            '0%, 100%': { boxShadow: '0 0 20px rgba(51,160,101,0.15)' },
                            '50%': { boxShadow: '0 0 40px rgba(51,160,101,0.3)' },
                        },
                        'progress-fill': {
                            '0%': { width: '0%' },
                            '100%': { width: 'var(--progress-width, 0%)' },
                        },
                        'ring-fill': {
                            '0%': { strokeDashoffset: 'var(--ring-circumference, 283)' },
                            '100%': { strokeDashoffset: 'var(--ring-offset, 0)' },
                        },
                        'sparkline-draw': {
                            '0%': { strokeDashoffset: '500' },
                            '100%': { strokeDashoffset: '0' },
                        },
                        'slide-up-fade': {
                            '0%': { opacity: '0', transform: 'translateY(12px) scale(0.97)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                        },
                        'number-roll': {
                            '0%': { opacity: '0', transform: 'translateY(100%)' },
                            '60%': { opacity: '1', transform: 'translateY(-8%)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                    },
                    animation: {
                        'fade-in-up': 'fade-in-up 0.6s cubic-bezier(0.16,1,0.3,1) forwards',
                        'fade-in': 'fade-in 0.5s ease-out forwards',
                        'slide-in-right': 'slide-in-right 0.5s cubic-bezier(0.16,1,0.3,1) forwards',
                        'scale-in': 'scale-in 0.4s cubic-bezier(0.16,1,0.3,1) forwards',
                        'count-up': 'count-up 0.7s cubic-bezier(0.16,1,0.3,1) forwards',
                        'float': 'float 6s ease-in-out infinite',
                        'float-slow': 'float-slow 8s ease-in-out infinite',
                        'gradient-shift': 'gradient-shift 8s ease infinite',
                        'shimmer': 'shimmer 2s linear infinite',
                        'glow-pulse': 'glow-pulse 3s ease-in-out infinite',
                        'progress-fill': 'progress-fill 1s cubic-bezier(0.16,1,0.3,1) forwards',
                        'ring-fill': 'ring-fill 1.2s cubic-bezier(0.16,1,0.3,1) forwards',
                        'sparkline-draw': 'sparkline-draw 1.5s cubic-bezier(0.16,1,0.3,1) forwards',
                        'slide-up-fade': 'slide-up-fade 0.5s cubic-bezier(0.16,1,0.3,1) forwards',
                        'number-roll': 'number-roll 0.8s cubic-bezier(0.16,1,0.3,1) forwards',
                    },
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }

        body {
            background-color: #f4f8f5;
            color: #1a2e23;
            font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Dark Mode */
        .dark body { background-color: #0a1610; color: #e2e8f0; }
        .dark .bg-white { background-color: #12231b !important; }
        .dark .bg-slate-50 { background-color: #0d1c14 !important; }
        .dark .text-slate-900 { color: #f1f5f9 !important; }
        .dark .text-slate-800 { color: #e2e8f0 !important; }
        .dark .text-slate-700 { color: #cbd5e1 !important; }
        .dark .text-slate-600 { color: #94a3b8 !important; }
        .dark .border-slate-200 { border-color: #1e3a2c !important; }
        .dark .border-sise-200 { border-color: #1d6641 !important; }
        .dark .glass-panel { background: rgba(18,35,27,0.9); border-color: rgba(51,160,101,0.15); }
        .dark .glass-card { background: rgba(18,35,27,0.7); border-color: rgba(51,160,101,0.12); }
        /* Dark mode: form inputs */
        .dark input, .dark select, .dark textarea {
            background-color: #12231b !important;
            color: #e2e8f0 !important;
            border-color: #1e3a2c !important;
        }
        .dark input::placeholder, .dark textarea::placeholder {
            color: #4a6b58 !important;
        }
        .dark input:focus, .dark select:focus, .dark textarea:focus {
            border-color: #33a065 !important;
        }
        /* Dark mode: status badges */
        .dark .bg-green-50, .dark .bg-green-100 { background-color: rgba(34,197,94,0.12) !important; }
        .dark .bg-red-50, .dark .bg-red-100 { background-color: rgba(239,68,68,0.12) !important; }
        .dark .bg-blue-50, .dark .bg-blue-100 { background-color: rgba(59,130,246,0.12) !important; }
        .dark .bg-amber-50, .dark .bg-amber-100 { background-color: rgba(245,158,11,0.12) !important; }
        .dark .bg-orange-50, .dark .bg-orange-100 { background-color: rgba(249,115,22,0.12) !important; }
        .dark .bg-purple-50, .dark .bg-purple-100 { background-color: rgba(168,85,247,0.12) !important; }
        .dark .bg-violet-50, .dark .bg-violet-100, .dark .bg-violet-50\/50, .dark .bg-violet-50\/40 { background-color: rgba(139,92,246,0.12) !important; }
        .dark .bg-sise-50 { background-color: rgba(51,160,101,0.08) !important; }
        .dark .bg-slate-100 { background-color: rgba(148,163,184,0.08) !important; }
        /* Dark mode: chart tooltip */
        .dark .recharts-tooltip-wrapper .recharts-default-tooltip {
            background: #12231b !important;
            border-color: #1e3a2c !important;
            color: #e2e8f0 !important;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #b9e5ca; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #88d1a8; }
        .dark ::-webkit-scrollbar-thumb { background: #1d6641; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #238050; }

        /* Glass Panel */
        .glass-panel {
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(24px) saturate(1.8);
            -webkit-backdrop-filter: blur(24px) saturate(1.8);
            border: 1px solid rgba(51,160,101,0.1);
        }

        /* Glass Card */
        .glass-card {
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(20px) saturate(1.5);
            -webkit-backdrop-filter: blur(20px) saturate(1.5);
            border: 1px solid rgba(51,160,101,0.08);
            border-radius: 20px;
            transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
            position: relative;
        }
        .glass-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 48px -12px rgba(51,160,101,0.18);
            border-color: rgba(51,160,101,0.2);
        }
        .glass-card-glow {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(20px) saturate(1.6);
            -webkit-backdrop-filter: blur(20px) saturate(1.6);
            border: 1px solid rgba(51,160,101,0.12);
            border-radius: 20px;
            transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
            position: relative;
            overflow: hidden;
        }
        .glass-card-glow::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; right: -100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(51,160,101,0.5), transparent);
            animation: shimmer 3s ease-in-out infinite;
        }
        .dark .glass-card-glow { background: rgba(18,35,27,0.8); border-color: rgba(51,160,101,0.18); }

        /* Animated mesh background */
        .bg-mesh {
            background-image:
                radial-gradient(at 15% 15%, rgba(51,160,101,0.08) 0px, transparent 55%),
                radial-gradient(at 85% 25%, rgba(85,184,127,0.06) 0px, transparent 55%),
                radial-gradient(at 50% 80%, rgba(136,209,168,0.05) 0px, transparent 55%),
                radial-gradient(at 80% 80%, rgba(255,87,51,0.03) 0px, transparent 55%);
        }

        /* Floating orbs (decorative background) */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }
        .bg-orb-1 { width: 400px; height: 400px; background: rgba(51,160,101,0.12); top: -100px; right: -100px; animation: float 8s ease-in-out infinite; }
        .bg-orb-2 { width: 300px; height: 300px; background: rgba(85,184,127,0.08); bottom: 10%; left: -80px; animation: float-slow 10s ease-in-out infinite; }
        .bg-orb-3 { width: 250px; height: 250px; background: rgba(255,127,92,0.06); top: 40%; right: 10%; animation: float 12s ease-in-out infinite reverse; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        /* Gradient text */
        .gradient-text {
            background: linear-gradient(135deg, #33a065 0%, #238050 50%, #55b87f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Card hover */
        .card-hover {
            transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 50px -15px rgba(51,160,101,0.2);
        }

        /* KPI card gradient borders */
        .kpi-card {
            position: relative;
            overflow: hidden;
        }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--kpi-color, #33a065), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .kpi-card:hover::before { opacity: 1; }
        .kpi-card::after {
            content: '';
            position: absolute;
            bottom: -50%; right: -20%;
            width: 120px; height: 120px;
            border-radius: 50%;
            background: var(--kpi-color, rgba(51,160,101,0.04));
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .kpi-card:hover::after { opacity: 1; }

        /* Animated progress bar */
        .progress-bar-animated {
            height: 6px;
            border-radius: 3px;
            background: rgba(51,160,101,0.1);
            overflow: hidden;
            position: relative;
        }
        .progress-bar-animated .bar {
            height: 100%;
            border-radius: 3px;
            animation: progress-fill 1s cubic-bezier(0.16,1,0.3,1) forwards;
            position: relative;
        }
        .progress-bar-animated .bar::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s ease-in-out infinite;
        }

        /* Today highlight card */
        .today-card {
            background: linear-gradient(135deg, rgba(51,160,101,0.06) 0%, rgba(85,184,127,0.04) 50%, rgba(136,209,168,0.02) 100%);
            border: 1px solid rgba(51,160,101,0.12);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }
        .today-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            background: linear-gradient(180deg, #33a065, #55b87f, #88d1a8);
            border-radius: 4px 0 0 4px;
        }
        .dark .today-card {
            background: linear-gradient(135deg, rgba(51,160,101,0.08) 0%, rgba(18,35,27,0.6) 100%);
            border-color: rgba(51,160,101,0.18);
        }

        /* Store comparison bar */
        .store-bar {
            position: relative;
            height: 32px;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(51,160,101,0.06);
            transition: all 0.3s ease;
        }
        .store-bar:hover { transform: scaleX(1.01); }
        .store-bar .fill {
            height: 100%;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 12px;
            font-weight: 600;
            color: white;
            transition: width 1s cubic-bezier(0.16,1,0.3,1);
            min-width: fit-content;
        }

        /* Number animation */
        .num-animate {
            display: inline-block;
            animation: count-up 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
        }

        /* Staggered animations */
        .stagger-1 { animation-delay: 0.06s; opacity: 0; }
        .stagger-2 { animation-delay: 0.12s; opacity: 0; }
        .stagger-3 { animation-delay: 0.18s; opacity: 0; }
        .stagger-4 { animation-delay: 0.24s; opacity: 0; }
        .stagger-5 { animation-delay: 0.30s; opacity: 0; }
        .stagger-6 { animation-delay: 0.36s; opacity: 0; }

        /* Status pulse */
        .status-active::before {
            content: '';
            display: inline-block;
            width: 7px; height: 7px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
            50% { opacity: 0.7; box-shadow: 0 0 0 4px rgba(34,197,94,0); }
        }

        /* Loading */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .skeleton {
            background: linear-gradient(90deg, #e8f3ec 25%, #f0faf4 50%, #e8f3ec 75%);
            background-size: 200% 100%;
            animation: shimmer 1.8s ease-in-out infinite;
        }
        .dark .skeleton {
            background: linear-gradient(90deg, #12231b 25%, #1e3a2c 50%, #12231b 75%);
            background-size: 200% 100%;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Table hover & alternating rows */
        .table-row-hover {
            transition: background-color 0.2s ease;
        }
        .table-row-hover:hover {
            background-color: rgba(51,160,101,0.06);
        }
        .table-row-hover:nth-child(even) {
            background-color: rgba(51,160,101,0.02);
        }
        .table-row-hover:nth-child(even):hover {
            background-color: rgba(51,160,101,0.06);
        }
        .dark .table-row-hover:nth-child(even) {
            background-color: rgba(51,160,101,0.04);
        }

        /* Usage counter */
        .usage-ring {
            transition: stroke-dashoffset 0.6s cubic-bezier(0.16,1,0.3,1);
        }

        /* Bottom Navigation (Mobile) */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 50;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(24px) saturate(1.8);
            -webkit-backdrop-filter: blur(24px) saturate(1.8);
            border-top: 1px solid rgba(51,160,101,0.1);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .dark .bottom-nav {
            background: rgba(18,35,27,0.92);
            border-color: rgba(51,160,101,0.15);
        }
        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 4px 6px;
            font-size: 10px;
            font-weight: 500;
            color: #94a3b8;
            transition: color 0.25s ease, transform 0.15s ease;
            position: relative;
            flex: 0 0 auto;
            min-width: 56px;
            min-height: 56px;
            -webkit-tap-highlight-color: transparent;
            scroll-snap-align: center;
        }
        .bottom-nav-item:active {
            transform: scale(0.88);
        }
        .bottom-nav-item.active {
            color: #33a065;
        }
        .bottom-nav-item.active::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 32px; height: 3px;
            background: linear-gradient(90deg, #33a065, #55b87f);
            border-radius: 0 0 6px 6px;
            box-shadow: 0 2px 8px rgba(51,160,101,0.3);
        }
        .bottom-nav-item.active .nav-icon-wrap {
            background: linear-gradient(135deg, rgba(51,160,101,0.12), rgba(85,184,127,0.08));
            border-radius: 12px;
            padding: 4px 10px;
        }

        /* Gradient button */
        .btn-gradient {
            background: linear-gradient(135deg, #33a065, #238050);
            color: white;
            border: none;
            box-shadow: 0 4px 16px -4px rgba(51,160,101,0.4);
            transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
        }
        .btn-gradient:hover {
            box-shadow: 0 8px 24px -4px rgba(51,160,101,0.5);
            transform: translateY(-1px);
        }
        .btn-gradient:active {
            transform: translateY(0) scale(0.97);
        }

        /* Consistent button active/disabled states */
        button:not(:disabled):active {
            transition-duration: 0.1s;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Mobile-first */
        @media (max-width: 768px) {
            body { font-size: 16px; }
            input, select, textarea { font-size: 16px !important; }
            button, a { min-height: 44px; }
            .hide-mobile { display: none !important; }

            /* フォントサイズ最低保証 - 10px/11pxを11px以上に強制 */
            [class*="text-\[9px\]"] { font-size: 11px !important; }
            [class*="text-\[10px\]"] { font-size: 11px !important; }
            [class*="text-\[11px\]"] { font-size: 11.5px !important; }

            /* スマホ用カードの密度調整 */
            .glass-card { border-radius: 16px; }
            .glass-card-glow { border-radius: 16px; }

            /* KPIカードのモバイル最適化 */
            .kpi-card { min-height: 110px; }

            /* チャートのモバイル最適化 */
            .recharts-wrapper { touch-action: pan-x pan-y; }

            /* スワイプ可能ヒント */
            .swipe-hint {
                position: relative;
                overflow: hidden;
            }
            .swipe-hint::after {
                content: '';
                position: absolute;
                top: 0; right: 0; bottom: 0;
                width: 24px;
                background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8));
                pointer-events: none;
                z-index: 1;
            }
            .dark .swipe-hint::after {
                background: linear-gradient(90deg, transparent, rgba(18,35,27,0.8));
            }

            /* プルリフレッシュインジケーター */
            .pull-indicator {
                position: fixed;
                top: 56px;
                left: 50%;
                transform: translateX(-50%) translateY(-40px);
                z-index: 45;
                transition: transform 0.3s cubic-bezier(0.16,1,0.3,1), opacity 0.3s;
                opacity: 0;
                pointer-events: none;
            }
            .pull-indicator.visible {
                transform: translateX(-50%) translateY(8px);
                opacity: 1;
            }
            .pull-indicator.refreshing {
                transform: translateX(-50%) translateY(8px);
                opacity: 1;
            }
        }
        @media (min-width: 769px) {
            .hide-desktop { display: none !important; }
            .bottom-nav { display: none !important; }
        }

        /* 小さいスマホ (375px以下) 専用 */
        @media (max-width: 380px) {
            .bottom-nav-item {
                padding: 6px 1px 4px;
                min-height: 52px;
            }
            .kpi-card { min-height: 100px; }
        }

        /* Safe Area */
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

        /* Member avatar */
        .member-avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px; height: 40px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            color: white;
            flex-shrink: 0;
        }

        /* Chart tooltip custom */
        .recharts-tooltip-wrapper .recharts-default-tooltip {
            border-radius: 12px !important;
            box-shadow: 0 8px 32px -8px rgba(0,0,0,0.12) !important;
            border: 1px solid rgba(51,160,101,0.1) !important;
        }

        /* Smooth view transitions */
        .view-transition {
            animation: fade-in-up 0.4s cubic-bezier(0.16,1,0.3,1) forwards;
        }

        /* Focus ring consistency for all inputs */
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #33a065 !important;
            box-shadow: 0 0 0 3px rgba(51,160,101,0.12);
        }
    </style>
</head>
<body>
    <div id="root">
        <div id="loading-indicator" style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(160deg, #f0faf4 0%, #e0f2e7 40%, #f4f8f5 100%); position: relative; overflow: hidden;">
            <div style="position:absolute;width:400px;height:400px;border-radius:50%;background:rgba(51,160,101,0.08);filter:blur(80px);top:-100px;right:-100px;animation:float 6s ease-in-out infinite;"></div>
            <div style="position:absolute;width:250px;height:250px;border-radius:50%;background:rgba(85,184,127,0.06);filter:blur(60px);bottom:15%;left:-60px;animation:float-slow 8s ease-in-out infinite;"></div>
            <div style="position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,127,92,0.04);filter:blur(50px);top:40%;right:20%;animation:float 10s ease-in-out infinite reverse;"></div>
            <div style="text-align: center; position: relative; z-index: 1;">
                <!-- Logo Image (place your logo at /images/logo.png) -->
                <div style="position:relative;width:120px;height:120px;margin:0 auto 24px;">
                    <!-- Outer ring pulse -->
                    <div style="position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(51,160,101,0.15);animation:logo-ring-pulse 2s ease-in-out infinite;"></div>
                    <!-- Logo image with fallback -->
                    <img
                        src="./images/logo.png"
                        alt="si'se logo"
                        style="width:120px;height:120px;object-fit:contain;border-radius:28px;animation:logo-float 3s ease-in-out infinite;filter:drop-shadow(0 20px 40px rgba(51,160,101,0.3));"
                        onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
                    />
                    <!-- Fallback: text logo (shown if image fails to load) -->
                    <div style="display:none;width:120px;height:120px;background:linear-gradient(135deg,#33a065 0%,#238050 60%,#55b87f 100%);border-radius:28px;align-items:center;justify-content:center;box-shadow:0 20px 60px -12px rgba(51,160,101,0.45),0 0 0 1px rgba(255,255,255,0.1) inset;animation:logo-float 3s ease-in-out infinite;">
                        <span style="color:white;font-family:'Noto Sans JP',sans-serif;font-weight:800;font-size:36px;letter-spacing:0.02em;text-shadow:0 2px 8px rgba(0,0,0,0.15);">S</span>
                    </div>
                    <!-- Orbiting dots -->
                    <div style="position:absolute;top:50%;left:50%;width:140px;height:140px;margin:-70px 0 0 -70px;animation:logo-orbit 3s linear infinite;">
                        <div style="position:absolute;top:0;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#55b87f;box-shadow:0 0 8px rgba(85,184,127,0.6);"></div>
                    </div>
                    <div style="position:absolute;top:50%;left:50%;width:155px;height:155px;margin:-77.5px 0 0 -77.5px;animation:logo-orbit 4.5s linear infinite reverse;">
                        <div style="position:absolute;top:0;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#b9e5ca;box-shadow:0 0 6px rgba(185,229,202,0.5);"></div>
                    </div>
                </div>
                <!-- Brand text -->
                <p style="color:#16432d;font-size:28px;font-family:'Noto Sans JP',sans-serif;font-weight:800;letter-spacing:0.1em;animation:logo-text-in 0.8s cubic-bezier(0.16,1,0.3,1) 0.2s both;">si'se</p>
                <p style="color:#33a065;font-size:11px;font-family:'Noto Sans JP',sans-serif;margin-top:6px;letter-spacing:0.2em;text-transform:uppercase;font-weight:600;animation:logo-text-in 0.8s cubic-bezier(0.16,1,0.3,1) 0.4s both;">Management Dashboard</p>
                <!-- Progress bar -->
                <div style="width:120px;height:3px;background:rgba(51,160,101,0.12);border-radius:4px;margin:24px auto 0;overflow:hidden;animation:logo-text-in 0.6s ease 0.6s both;">
                    <div style="width:40%;height:100%;background:linear-gradient(90deg,#33a065,#55b87f);border-radius:4px;animation:loading-progress 1.8s ease-in-out infinite;"></div>
                </div>
            </div>
        </div>
    </div>

    <style>
        @keyframes logo-float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.03); }
        }
        @keyframes logo-ring-pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        @keyframes logo-orbit {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes logo-text-in {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes loading-progress {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(200%); }
            100% { transform: translateX(-100%); }
        }
    </style>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;
        const RechartsLib = window.Recharts || {};
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, LineChart, Line, AreaChart, Area, PieChart, Pie, Cell, ComposedChart } = RechartsLib;

        // ========================================
        // 設定・定数
        // ========================================

        // 店舗マスタ（サーバーから動的に取得）
        let serverStores = [];

        // Google Apps Script Web App URL (日報データ取得用)
        // ※実際のデプロイ後URLに置き換えてください
        const GOOGLE_FORM_SHEET_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL';

        // API設定（サーバーサイドプロキシ経由）
        // APIキーはVercel環境変数で管理、フロントエンドには露出しない
        const SQUARE_PROXY_BASE = '/api/square';
        const META_PROXY_BASE = '/api/meta';
        const TIKTOK_PROXY_BASE = '/api/tiktok';

        // サーバーから設定を取得（店舗一覧含む）- キャッシュ付き
        let _squareConfigCache = null;
        let _squareConfigPromise = null;
        const fetchSquareConfig = async () => {
            if (_squareConfigCache) return _squareConfigCache;
            if (_squareConfigPromise) return _squareConfigPromise;
            _squareConfigPromise = (async () => {
                try {
                    const res = await fetch(`${SQUARE_PROXY_BASE}/config`);
                    if (res.ok) {
                        const config = await res.json();
                        serverStores = config.stores || [];
                        _squareConfigCache = config;
                        return config;
                    }
                } catch (e) {}
                const fallback = {
                    configured: false,
                    stores: [],
                    environment: 'sandbox',
                    locationId: '',
                    defaultMonthlyPrice: 10000
                };
                _squareConfigCache = fallback;
                return fallback;
            })();
            return _squareConfigPromise;
        };
        // ページロード時にconfig取得を先行開始
        fetchSquareConfig();

        // ========================================
        // スタッフ・アクセス管理
        // ========================================

        const STAFF_STORAGE_KEY = 'sise_staff_config';

        // URLパラメータからアクセス情報をデコード
        const parseAccessFromUrl = () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('v');
            if (!token) return null;
            try {
                const json = decodeURIComponent(escape(atob(token)));
                const decoded = JSON.parse(json);
                return {
                    name: decoded.n || '不明',
                    role: decoded.r || 'staff',
                    storeIds: decoded.sid || [],
                };
            } catch (e) {
                console.warn('Invalid access token');
                return null;
            }
        };

        // アクセストークン生成（UTF-8対応）
        const generateStaffToken = (staff) => {
            const payload = { n: staff.name, r: staff.role, sid: staff.storeIds };
            return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
        };

        // スタッフ用URL生成
        const generateStaffUrl = (staff) => {
            const token = generateStaffToken(staff);
            const base = window.location.origin + window.location.pathname;
            return `${base}?v=${token}`;
        };

        // localStorage管理
        const loadStaffList = () => {
            try { return JSON.parse(localStorage.getItem(STAFF_STORAGE_KEY)) || []; }
            catch (e) { return []; }
        };
        const saveStaffList = (list) => localStorage.setItem(STAFF_STORAGE_KEY, JSON.stringify(list));

        // 現在のアクセス情報（URLから解析）
        const currentAccess = parseAccessFromUrl();

        // ========================================
        // ヘルパー関数
        // ========================================

        const formatCurrency = (value) => {
            return new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY' }).format(value);
        };

        const formatNumber = (value) => {
            return new Intl.NumberFormat('ja-JP').format(value);
        };

        const formatPercent = (value) => {
            return `${value.toFixed(1)}%`;
        };

        // ========================================
        // コンポーネント
        // ========================================

        // アイコンコンポーネント
        // Lucideアイコンキャッシュ（SVG文字列を一度だけ生成してキャッシュ）
        const _iconCache = {};
        const _getIconSvg = (name, size, color) => {
            const key = `${name}_${size}_${color}`;
            if (_iconCache[key]) return _iconCache[key];
            if (window.lucide && window.lucide.icons) {
                const iconData = window.lucide.icons[name];
                if (iconData) {
                    // Lucide icons format: [[tag, attrs], [tag, attrs], ...]
                    const elements = Array.isArray(iconData[0]) ? iconData : (iconData[1] || iconData);
                    const inner = (Array.isArray(elements) ? elements : []).map(el => {
                        if (!Array.isArray(el)) return '';
                        const [tag, a] = el;
                        const attrStr = Object.entries(a || {}).map(([k,v]) => `${k}="${v}"`).join(' ');
                        return `<${tag} ${attrStr}/>`;
                    }).join('');
                    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
                    _iconCache[key] = svg;
                    return svg;
                }
            }
            return '';
        };
        const Icon = ({ name, size = 20, color = "currentColor", className = "" }) => {
            const svg = _getIconSvg(name, size, color);
            return svg
                ? <span className={`inline-flex items-center justify-center shrink-0 ${className}`} style={{width: size, height: size}} dangerouslySetInnerHTML={{__html: svg}} />
                : <span className={className} style={{width: size, height: size, display: 'inline-block'}} />;
        };

        // アバターカラー生成
        const getAvatarColor = (name) => {
            const colors = [
                'from-sise-400 to-sise-600',
                'from-emerald-400 to-emerald-600',
                'from-teal-400 to-teal-600',
                'from-cyan-400 to-cyan-600',
                'from-blue-400 to-blue-600',
                'from-violet-400 to-violet-600',
                'from-pink-400 to-pink-600',
                'from-rose-400 to-rose-600',
                'from-amber-400 to-amber-600',
                'from-orange-400 to-orange-600',
            ];
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return colors[Math.abs(hash) % colors.length];
        };

        // アバターコンポーネント
        const Avatar = ({ name, size = 40 }) => {
            const initial = (name || '?').charAt(0);
            const colorClass = getAvatarColor(name || '');
            return (
                <div
                    className={`member-avatar bg-gradient-to-br ${colorClass}`}
                    style={{ width: size, height: size, fontSize: Math.round(size * 0.38) }}
                >
                    {initial}
                </div>
            );
        };

        // カードコンポーネント
        const Card = ({ children, className = "", hover = false }) => (
            <div className={`glass-card p-5 md:p-6 shadow-sm ${hover ? 'card-hover' : ''} ${className}`}>
                {children}
            </div>
        );

        // アニメーション付き数値カウンター
        const AnimatedNumber = ({ value, prefix = "", suffix = "", duration = 800 }) => {
            const [displayValue, setDisplayValue] = useState(0);
            const numericValue = parseFloat(String(value).replace(/[^0-9.-]/g, '')) || 0;
            const isFloat = String(value).includes('.');

            useEffect(() => {
                if (numericValue === 0) { setDisplayValue(0); return; }
                const startTime = performance.now();
                const animate = (currentTime) => {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 4);
                    setDisplayValue(numericValue * eased);
                    if (progress < 1) requestAnimationFrame(animate);
                };
                requestAnimationFrame(animate);
            }, [numericValue, duration]);

            const formatted = isFloat ? displayValue.toFixed(1) : Math.round(displayValue).toLocaleString();
            return <span>{prefix}{formatted}{suffix}</span>;
        };

        // ミニスパークライン（SVG）
        const MiniSparkline = ({ data = [], color = "#33a065", height = 32, width = 80 }) => {
            if (!data || data.length < 2) return null;
            const max = Math.max(...data);
            const min = Math.min(...data);
            const range = max - min || 1;
            const points = data.map((v, i) => {
                const x = (i / (data.length - 1)) * width;
                const y = height - ((v - min) / range) * (height - 4) - 2;
                return `${x},${y}`;
            }).join(' ');
            const areaPoints = points + ` ${width},${height} 0,${height}`;
            return (
                <svg width={width} height={height} className="overflow-visible">
                    <defs>
                        <linearGradient id={`spark-${color.replace('#','')}`} x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor={color} stopOpacity="0.2" />
                            <stop offset="100%" stopColor={color} stopOpacity="0" />
                        </linearGradient>
                    </defs>
                    <polygon points={areaPoints} fill={`url(#spark-${color.replace('#','')})`} />
                    <polyline points={points} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{strokeDasharray: 500, animation: 'sparkline-draw 1.5s cubic-bezier(0.16,1,0.3,1) forwards'}} />
                    <circle cx={data.length > 0 ? ((data.length-1) / (data.length-1)) * width : 0} cy={data.length > 0 ? height - ((data[data.length-1] - min) / range) * (height-4) - 2 : 0} r="3" fill={color} style={{animation: 'scale-in 0.4s 1s cubic-bezier(0.16,1,0.3,1) forwards', opacity: 0}} />
                </svg>
            );
        };

        // KPIカードコンポーネント
        const KpiCard = ({ title, value, subValue, trend, icon, color = "bg-sise-500", gradientFrom = "from-sise-400", gradientTo = "to-sise-600", sparkData, accentColor, loading }) => {
            if (loading) {
                return (
                    <Card hover className="group kpi-card relative overflow-hidden">
                        <div className="flex justify-between items-start mb-2">
                            <div className={`rounded-xl bg-gradient-to-br ${gradientFrom} ${gradientTo} text-white shadow-lg p-2.5 md:p-3 opacity-60`}>
                                <Icon name={icon} size={18} />
                            </div>
                        </div>
                        <div className="skeleton h-3 w-20 rounded mb-2 mt-1"></div>
                        <div className="skeleton h-7 w-24 rounded mb-2"></div>
                        <div className="skeleton h-3 w-16 rounded"></div>
                    </Card>
                );
            }
            return (
            <Card hover className="group kpi-card relative overflow-hidden" style={{'--kpi-color': accentColor || 'rgba(51,160,101,0.04)'}}>
                <div className="flex justify-between items-start mb-2">
                    <div className={`rounded-xl bg-gradient-to-br ${gradientFrom} ${gradientTo} text-white shadow-lg p-2.5 md:p-3 group-hover:scale-110 group-hover:rotate-3 transition-all duration-500`}>
                        <Icon name={icon} size={18} />
                    </div>
                    <div className="flex items-center gap-2">
                        {sparkData && sparkData.length > 1 && (
                            <MiniSparkline data={sparkData} color={accentColor || '#33a065'} height={28} width={60} />
                        )}
                        {trend !== null && trend !== undefined && (
                            <span className={`font-semibold ${trend >= 0 ? 'text-emerald-600 bg-emerald-50/80' : 'text-red-500 bg-red-50/80'} flex items-center px-2 py-0.5 rounded-full text-[11px] backdrop-blur-sm`}>
                                {trend >= 0 ? '+' : ''}{trend}%
                                <Icon name={trend >= 0 ? 'trending-up' : 'trending-down'} size={11} className="ml-0.5" />
                            </span>
                        )}
                    </div>
                </div>
                <h3 className="text-slate-500 font-medium text-[11px] md:text-xs tracking-wider uppercase">{title}</h3>
                <div className="flex items-baseline mt-1 overflow-hidden">
                    <span className="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight animate-number-roll">{value}</span>
                </div>
                {subValue && <p className="text-[11px] md:text-xs text-slate-400 mt-1">{subValue}</p>}
            </Card>
            );
        };

        // セクションヘッダーコンポーネント
        const SectionHeader = ({ title, subtitle, icon, children }) => (
            <div className="flex flex-wrap items-center justify-between gap-3 mb-1">
                <div className="flex items-center">
                    {icon && (
                        <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-sise-400 to-sise-600 text-white flex items-center justify-center mr-3 shadow-lg shadow-sise-500/20">
                            <Icon name={icon} size={18} />
                        </div>
                    )}
                    <div>
                        <h2 className="text-lg md:text-xl font-bold text-slate-800">{title}</h2>
                        {subtitle && <p className="text-[10px] md:text-[11px] text-sise-500 tracking-widest font-semibold uppercase">{subtitle}</p>}
                    </div>
                </div>
                {children}
            </div>
        );

        // ========================================
        // Square API連携
        // ========================================

        // セッションキャッシュ（ページ内でのデータ再利用、5分間有効）
        const squareDataCache = { data: null, storeKey: null, timestamp: 0 };
        const CACHE_TTL = 5 * 60 * 1000; // 5分

        const useSquareData = (activeStoreId, allowedStoreIds) => {
            const [memberData, setMemberData] = useState({
                totalMembers: 0,
                activeMembers: 0,
                newMembersThisMonth: 0,
                churnedMembers: 0,
                churnRate: 0,
                expectedRevenue: 0,
                members: [], // 会員詳細リスト
                monthlyTrend: [], // 月間入退会トレンド
                stores: [], // 利用可能な店舗一覧
                loading: true,
                error: null
            });

            // ページネーション付きAPI呼び出しヘルパー（プロキシ経由、店舗ID付き）
            const fetchAllPages = async (endpoint, bodyBuilder, resultKey, storeId) => {
                let allResults = [];
                let cursor = null;
                do {
                    const body = bodyBuilder(cursor);
                    const headers = { 'Content-Type': 'application/json' };
                    if (storeId && storeId !== 'all') headers['X-Store-Id'] = storeId;
                    const response = await fetch(`${SQUARE_PROXY_BASE}/${endpoint}`, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify(body)
                    });
                    if (!response.ok) {
                        const errorBody = await response.json().catch(() => ({}));
                        throw new Error(`API ${endpoint}: ${response.status} - ${JSON.stringify(errorBody.errors || errorBody.error || [])}`);
                    }
                    const data = await response.json();
                    allResults = allResults.concat(data[resultKey] || []);
                    cursor = data.cursor || null;
                } while (cursor);
                return allResults;
            };

            // サブスクリプション操作（解約・一時停止・再開）
            const operateSubscription = async (subscriptionId, action, storeId) => {
                const headers = { 'Content-Type': 'application/json' };
                if (storeId && storeId !== 'all') headers['X-Store-Id'] = storeId;
                const response = await fetch(`${SQUARE_PROXY_BASE}/subscriptions/${subscriptionId}/${action}`, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({})
                });
                if (!response.ok) {
                    const errorBody = await response.json().catch(() => ({}));
                    const detail = errorBody.errors
                        ? errorBody.errors.map(e => e.detail || e.code).join(', ')
                        : JSON.stringify(errorBody);
                    throw new Error(detail);
                }
                return await response.json();
            };

            const fetchSquareData = useCallback(async (forceRefresh) => {
                // キャッシュチェック（強制更新でない場合）
                const cacheKey = `${activeStoreId}_${(allowedStoreIds || []).join(',')}`;
                if (!forceRefresh && squareDataCache.data && squareDataCache.storeKey === cacheKey
                    && (Date.now() - squareDataCache.timestamp) < CACHE_TTL) {
                    setMemberData(squareDataCache.data);
                    return;
                }

                // サーバーの設定を確認
                const serverConfig = await fetchSquareConfig();

                // APIが設定されていない場合は空データ表示
                if (!serverConfig.configured) {
                    setMemberData({
                        totalMembers: 0,
                        activeMembers: 0,
                        newMembersThisMonth: 0,
                        churnedMembers: 0,
                        churnRate: 0,
                        expectedRevenue: 0,
                        members: [],
                        monthlyTrend: [],
                        stores: [],
                        loading: false,
                        error: 'Square APIが設定されていません。Vercelの環境変数を設定してください。'
                    });
                    return;
                }

                const stores = serverConfig.stores || [];
                const defaultMonthlyPrice = serverConfig.defaultMonthlyPrice;

                // 取得対象の店舗を決定（アクセス制限適用）
                let availStores = stores;
                if (allowedStoreIds && allowedStoreIds.length > 0) {
                    availStores = stores.filter(s => allowedStoreIds.includes(s.id));
                }
                const targetStores = (activeStoreId && activeStoreId !== 'all')
                    ? availStores.filter(s => s.id === activeStoreId)
                    : availStores;

                if (targetStores.length === 0) {
                    setMemberData(prev => ({ ...prev, stores, loading: false, error: '対象店舗が見つかりません' }));
                    return;
                }

                try {
                    let allCustomers = [];
                    let allSubscriptions = [];
                    let allInvoices = [];
                    let catalogMap = {};

                    // ==========================================
                    // 高速化: 店舗間を並列処理 + 店舗内API呼び出しも並列化
                    // ==========================================

                    // 1店舗分のデータを並列取得する関数（catalog fetchは分離）
                    const fetchStoreData = async (store) => {
                        const storeId = store.id;
                        const locationId = store.locationId;

                        // Customers, Subscriptions, Invoices を並列取得（個別エラー耐性あり）
                        const [customers, subscriptions, invoices] = await Promise.allSettled([
                            fetchAllPages(
                                'customers/search',
                                (cursor) => ({ limit: 100, ...(cursor ? { cursor } : {}) }),
                                'customers', storeId
                            ),
                            fetchAllPages(
                                'subscriptions/search',
                                (cursor) => ({
                                    query: { filter: { location_ids: [locationId] } },
                                    ...(cursor ? { cursor } : {})
                                }),
                                'subscriptions', storeId
                            ),
                            fetchAllPages(
                                'invoices/search',
                                (cursor) => ({
                                    query: { filter: { location_ids: [locationId] } },
                                    limit: 200,
                                    ...(cursor ? { cursor } : {})
                                }),
                                'invoices', storeId
                            )
                        ]).then(results => results.map(r => r.status === 'fulfilled' ? r.value : []));

                        // 店舗情報をタグ付け
                        customers.forEach(c => { c._storeId = storeId; c._storeName = store.name; });
                        subscriptions.forEach(s => { s._storeId = storeId; s._storeName = store.name; });
                        invoices.forEach(inv => { inv._storeId = storeId; inv._storeName = store.name; });

                        // Catalog fetchはここでは行わない（後で非同期で実行）
                        return { customers, subscriptions, invoices, catalogMap: {} };
                    };

                    // Catalog情報を非同期で取得し、memberDataを後から更新する関数
                    const fetchCatalogAsync = async (subscriptions, stores, targetStoresList) => {
                        const catalogMap = {};
                        // 全店舗のplanIdsを収集し、店舗IDごとにグループ化
                        const planIdsByStore = {};
                        subscriptions.forEach(s => {
                            if (s.plan_variation_id) {
                                const sid = s._storeId || 'default';
                                if (!planIdsByStore[sid]) planIdsByStore[sid] = new Set();
                                planIdsByStore[sid].add(s.plan_variation_id);
                            }
                        });

                        // 全店舗のcatalog fetchを並列実行
                        const catalogPromises = Object.entries(planIdsByStore).map(async ([sid, planIdSet]) => {
                            const planIds = [...planIdSet];
                            if (planIds.length === 0) return;
                            try {
                                const headers = { 'Content-Type': 'application/json' };
                                if (sid && sid !== 'default') headers['X-Store-Id'] = sid;
                                const catalogResponse = await fetch(`${SQUARE_PROXY_BASE}/catalog/batch-retrieve`, {
                                    method: 'POST', headers,
                                    body: JSON.stringify({ object_ids: planIds })
                                });
                                if (catalogResponse.ok) {
                                    const catalogData = await catalogResponse.json();
                                    (catalogData.objects || []).forEach(obj => {
                                        const subPlan = obj.subscription_plan_variation_data || obj.subscription_plan_data;
                                        catalogMap[obj.id] = {
                                            name: subPlan?.name || obj.id,
                                            phases: subPlan?.phases || []
                                        };
                                    });
                                }
                            } catch (e) { console.warn('Catalog API fetch failed:', e); }
                        });
                        await Promise.all(catalogPromises);
                        return catalogMap;
                    };

                    // Extra Sourceのデータを並列取得する関数
                    const fetchExtraSourceData = async (store, extra) => {
                        const storeId = store.id;
                        // Subscriptions, Invoices, Customers を並列取得
                        const [extraSubs, extraInvoices, extraCustomers] = await Promise.allSettled([
                            fetchAllPages(
                                'subscriptions/search',
                                (cursor) => ({
                                    query: { filter: { location_ids: [extra.locationId] } },
                                    ...(cursor ? { cursor } : {})
                                }),
                                'subscriptions', extra.id
                            ),
                            fetchAllPages(
                                'invoices/search',
                                (cursor) => ({
                                    query: { filter: { location_ids: [extra.locationId] } },
                                    limit: 200,
                                    ...(cursor ? { cursor } : {})
                                }),
                                'invoices', extra.id
                            ),
                            fetchAllPages(
                                'customers/search',
                                (cursor) => ({ limit: 100, ...(cursor ? { cursor } : {}) }),
                                'customers', extra.id
                            )
                        ]).then(results => results.map(r => r.status === 'fulfilled' ? r.value : []));

                        extraSubs.forEach(s => { s._storeId = storeId; s._storeName = store.name; s._extraSource = true; });
                        extraInvoices.forEach(inv => { inv._storeId = storeId; inv._storeName = store.name; inv._extraSource = true; });
                        extraCustomers.forEach(c => { c._storeId = storeId; c._storeName = store.name; c._extraSource = true; });

                        // Catalog fetchは後で非同期実行するため、ここではスキップ
                        console.log(`Extra source ${extra.id}: +${extraSubs.length} subs, +${extraInvoices.length} invoices, +${extraCustomers.length} customers`);
                        return { customers: extraCustomers, subscriptions: extraSubs, invoices: extraInvoices, catalogMap: {} };
                    };

                    // 全店舗を並列で取得
                    const storeResults = await Promise.all(targetStores.map(store => fetchStoreData(store)));

                    // 結果をマージ
                    for (const result of storeResults) {
                        allCustomers = allCustomers.concat(result.customers);
                        allSubscriptions = allSubscriptions.concat(result.subscriptions);
                        allInvoices = allInvoices.concat(result.invoices);
                        Object.assign(catalogMap, result.catalogMap);
                    }

                    // Extra Sources も全店舗分を並列で取得
                    const extraPromises = [];
                    for (const store of targetStores) {
                        if (store.extraSources && store.extraSources.length > 0) {
                            for (const extra of store.extraSources) {
                                extraPromises.push(
                                    fetchExtraSourceData(store, extra).catch(e => {
                                        console.warn(`Extra source fetch failed:`, e);
                                        return null;
                                    })
                                );
                            }
                        }
                    }

                    if (extraPromises.length > 0) {
                        const extraResults = await Promise.all(extraPromises);
                        const existingCustomerIds = new Set(allCustomers.map(c => c.id));
                        for (const result of extraResults) {
                            if (!result) continue;
                            allSubscriptions = allSubscriptions.concat(result.subscriptions);
                            allInvoices = allInvoices.concat(result.invoices);
                            // 顧客は重複除外
                            const newCustomers = result.customers.filter(c => !existingCustomerIds.has(c.id));
                            newCustomers.forEach(c => existingCustomerIds.add(c.id));
                            allCustomers = allCustomers.concat(newCustomers);
                            // catalogMapにマージ（既存を上書きしない）
                            for (const [id, val] of Object.entries(result.catalogMap)) {
                                if (!catalogMap[id]) catalogMap[id] = val;
                            }
                        }
                    }

                    const customers = allCustomers;
                    const subscriptions = allSubscriptions;
                    const invoices = allInvoices;

                    // 会員データ構築ヘルパー（catalogMapは任意 - 段階的読み込み対応）
                    const buildFinalData = (catMap) => {
                        const customerMap = new Map(customers.map(c => [c.id, c]));
                        const invoicesByCustomer = {};
                        invoices.forEach(inv => {
                            const cid = inv.primary_recipient?.customer_id;
                            if (cid) {
                                if (!invoicesByCustomer[cid]) invoicesByCustomer[cid] = [];
                                invoicesByCustomer[cid].push(inv);
                            }
                        });

                        const membersList = subscriptions.map(sub => {
                            const customer = customerMap.get(sub.customer_id);
                            const memberInvoices = invoicesByCustomer[sub.customer_id] || [];

                            let monthlyPrice = defaultMonthlyPrice;
                            let planName = 'スタンダードプラン';
                            let cadence = 'MONTHLY';

                            // Catalog APIからプラン情報取得
                            if (sub.plan_variation_id && catMap[sub.plan_variation_id]) {
                                const plan = catMap[sub.plan_variation_id];
                                planName = plan.name;
                                if (plan.phases && plan.phases.length > 0) {
                                    const phase = plan.phases[0];
                                    cadence = phase.cadence || 'MONTHLY';
                                    if (phase.pricing && phase.pricing.price_money) {
                                        monthlyPrice = phase.pricing.price_money.amount || monthlyPrice;
                                    } else if (phase.recurring_price_money) {
                                        monthlyPrice = phase.recurring_price_money.amount || monthlyPrice;
                                    }
                                }
                            }

                            // Subscription phasesから直接取得（フォールバック）
                            if (sub.phases && sub.phases.length > 0) {
                                const activePhase = sub.phases.find(p => !p.uid || p) || sub.phases[0];
                                if (activePhase.pricing && activePhase.pricing.price_money) {
                                    monthlyPrice = activePhase.pricing.price_money.amount || monthlyPrice;
                                } else if (activePhase.recurring_price_money) {
                                    monthlyPrice = activePhase.recurring_price_money.amount || monthlyPrice;
                                }
                                if (activePhase.cadence) {
                                    cadence = activePhase.cadence;
                                }
                            }

                            const paymentHistory = memberInvoices
                                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
                                .slice(0, 10)
                                .map(inv => {
                                    let amount = 0;
                                    if (inv.payment_requests && inv.payment_requests.length > 0) {
                                        const req = inv.payment_requests[0];
                                        amount = req.computed_amount_money?.amount
                                            || req.fixed_amount_requested_money?.amount
                                            || 0;
                                    }
                                    return {
                                        id: inv.id,
                                        date: inv.created_at,
                                        amount: amount,
                                        status: inv.status,
                                        invoiceNumber: inv.invoice_number || '-'
                                    };
                                });

                            return {
                                id: sub.id,
                                customerId: sub.customer_id,
                                name: customer ? `${customer.family_name || ''}${customer.given_name || ''}`.trim() || '未登録' : '未登録',
                                email: customer?.email_address || '-',
                                phone: customer?.phone_number || '-',
                                status: sub.status,
                                startDate: sub.start_date,
                                canceledDate: sub.canceled_date || null,
                                createdAt: sub.created_at,
                                planName: planName,
                                planVariationId: sub.plan_variation_id,
                                monthlyPrice: monthlyPrice,
                                cadence: cadence,
                                paymentHistory: paymentHistory,
                                storeId: sub._storeId || 'default',
                                storeName: sub._storeName || '',
                            };
                        });

                        const activeSubscriptions = subscriptions.filter(s => s.status === 'ACTIVE');
                        const now = new Date();
                        const thisMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
                        const thisMonthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0);

                        const canceledThisMonth = subscriptions.filter(s => {
                            if (s.status !== 'CANCELED' || !s.canceled_date) return false;
                            const cancelDate = new Date(s.canceled_date);
                            return cancelDate >= thisMonthStart && cancelDate <= thisMonthEnd;
                        });

                        const newThisMonth = subscriptions.filter(s => {
                            const startDate = new Date(s.start_date);
                            return startDate >= thisMonthStart && startDate <= thisMonthEnd;
                        });

                        const monthlyTrend = generateMonthlyTrendFromData(subscriptions);

                        const totalExpectedRevenue = membersList
                            .filter(m => m.status === 'ACTIVE')
                            .reduce((sum, m) => sum + m.monthlyPrice, 0);

                        return {
                            totalMembers: subscriptions.length,
                            activeMembers: activeSubscriptions.length,
                            newMembersThisMonth: newThisMonth.length,
                            churnedMembers: canceledThisMonth.length,
                            churnRate: activeSubscriptions.length > 0
                                ? (canceledThisMonth.length / activeSubscriptions.length * 100)
                                : 0,
                            expectedRevenue: totalExpectedRevenue,
                            members: membersList,
                            monthlyTrend: monthlyTrend,
                            stores: stores,
                            loading: false,
                            error: null
                        };
                    };

                    // ========================================
                    // Phase 1: subscription phasesのデータだけで即時表示
                    // （金額はsub.phasesから取得可能、プラン名はデフォルト）
                    // ========================================
                    const phase1Data = buildFinalData(catalogMap);
                    setMemberData(phase1Data);

                    // ========================================
                    // Phase 2: Catalog情報を非同期で取得し、プラン名を更新
                    // ========================================
                    fetchCatalogAsync(subscriptions, stores, targetStores).then(fullCatalogMap => {
                        if (Object.keys(fullCatalogMap).length > 0) {
                            Object.assign(catalogMap, fullCatalogMap);
                            const enrichedData = buildFinalData(catalogMap);
                            // キャッシュに保存（enriched版）
                            squareDataCache.data = enrichedData;
                            squareDataCache.storeKey = cacheKey;
                            squareDataCache.timestamp = Date.now();
                            setMemberData(enrichedData);
                        } else {
                            // catalogが空でもキャッシュに保存
                            squareDataCache.data = phase1Data;
                            squareDataCache.storeKey = cacheKey;
                            squareDataCache.timestamp = Date.now();
                        }
                    }).catch(e => console.warn('Catalog enrichment failed:', e));

                } catch (error) {
                    console.error('Square API Error:', error);
                    setMemberData(prev => ({
                        ...prev,
                        loading: false,
                        error: error.message
                    }));
                }
            }, [activeStoreId, allowedStoreIds]);

            useEffect(() => {
                fetchSquareData();
                // 5分ごとに更新
                const interval = setInterval(fetchSquareData, 5 * 60 * 1000);
                return () => clearInterval(interval);
            }, [fetchSquareData]);

            // 手動更新は常にキャッシュを無視
            const refreshSquareData = useCallback(() => fetchSquareData(true), [fetchSquareData]);

            return { memberData, refreshSquareData, operateSubscription };
        };

        // ========================================
        // Googleフォーム日報データ連携
        // ========================================

        const useDailyReportData = () => {
            const [reportData, setReportData] = useState({
                reports: [],
                loading: true,
                error: null,
                lastUpdated: null
            });

            const fetchReportData = useCallback(async () => {
                // localStorageの設定値を優先、なければデフォルト定数
                const gasUrl = localStorage.getItem('sise_gas_url') || GOOGLE_FORM_SHEET_URL;

                // APIが設定されていない場合は空データ
                if (!gasUrl || gasUrl === 'YOUR_GOOGLE_APPS_SCRIPT_URL') {
                    setReportData({
                        reports: [],
                        loading: false,
                        error: '日報データのGoogle Apps Script URLが設定されていません。設定画面からURLを入力してください。',
                        lastUpdated: null
                    });
                    return;
                }

                try {
                    // 当月+先月のデータを取得（月間トレンド比較用）
                    const response = await fetch(gasUrl + '?months=2');
                    if (!response.ok) {
                        throw new Error('日報データの取得に失敗しました (HTTP ' + response.status + ')');
                    }
                    const data = await response.json();

                    if (data.error) {
                        throw new Error(data.error);
                    }

                    setReportData({
                        reports: data.reports || [],
                        loading: false,
                        error: null,
                        lastUpdated: new Date()
                    });
                } catch (error) {
                    console.error('Report fetch error:', error);
                    setReportData(prev => ({
                        ...prev,
                        loading: false,
                        error: error.message
                    }));
                }
            }, []);

            useEffect(() => {
                fetchReportData();
            }, [fetchReportData]);

            return { reportData, refreshReportData: fetchReportData };
        };

        // 実データから月間トレンドを生成（累積会員数付き）
        const generateMonthlyTrendFromData = (subscriptions) => {
            const trend = [];
            const now = new Date();

            // プラン変更検出: 同じcustomer_idで、キャンセルと新規開始が同月内（±14日以内）のペアを探す
            const planChangeMap = {}; // monthKey -> Set of customer_ids that are plan changes
            const customerSubs = {};
            subscriptions.forEach(s => {
                if (!s.customer_id) return;
                if (!customerSubs[s.customer_id]) customerSubs[s.customer_id] = [];
                customerSubs[s.customer_id].push(s);
            });

            // 同一顧客で複数サブスクがある場合、キャンセル→新規を「プラン変更」と判定
            const planChangeCancelIds = new Set(); // cancel側のsubscription id
            const planChangeNewIds = new Set(); // new側のsubscription id

            Object.values(customerSubs).forEach(subs => {
                if (subs.length < 2) return;
                const canceled = subs.filter(s => s.canceled_date);
                const started = subs.filter(s => s.start_date);
                canceled.forEach(c => {
                    const cancelDate = new Date(c.canceled_date);
                    started.forEach(n => {
                        if (n.id === c.id) return;
                        const startDate = new Date(n.start_date);
                        const diffDays = Math.abs((startDate - cancelDate) / (1000 * 60 * 60 * 24));
                        if (diffDays <= 14) {
                            planChangeCancelIds.add(c.id);
                            planChangeNewIds.add(n.id);
                        }
                    });
                });
            });

            for (let i = 11; i >= 0; i--) {
                const date = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const monthStart = new Date(date.getFullYear(), date.getMonth(), 1);
                const monthEnd = new Date(date.getFullYear(), date.getMonth() + 1, 0);

                const newThisMonth = subscriptions.filter(s => {
                    const startDate = new Date(s.start_date);
                    return startDate >= monthStart && startDate <= monthEnd;
                });

                const churnedThisMonth = subscriptions.filter(s => {
                    if (!s.canceled_date) return false;
                    const cancelDate = new Date(s.canceled_date);
                    return cancelDate >= monthStart && cancelDate <= monthEnd;
                });

                // プラン変更の数（キャンセル側でカウント）
                const planChangeCount = churnedThisMonth.filter(s => planChangeCancelIds.has(s.id)).length;

                // 純粋な新規（プラン変更を除く）
                const pureNewMembers = newThisMonth.filter(s => !planChangeNewIds.has(s.id)).length;
                // 純粋な退会（プラン変更を除く）
                const pureChurnedMembers = churnedThisMonth.filter(s => !planChangeCancelIds.has(s.id)).length;

                // 各月末時点のアクティブ会員数を計算
                const activeAtMonthEnd = subscriptions.filter(s => {
                    const startDate = new Date(s.start_date);
                    if (startDate > monthEnd) return false;
                    if (s.status === 'CANCELED' && s.canceled_date) {
                        const cancelDate = new Date(s.canceled_date);
                        return cancelDate > monthEnd;
                    }
                    return s.status === 'ACTIVE' || s.status === 'PENDING' || s.status === 'PAUSED'
                        || (s.status === 'CANCELED' && s.canceled_date && new Date(s.canceled_date) > monthEnd);
                }).length;

                trend.push({
                    month: date.toLocaleDateString('ja-JP', { year: 'numeric', month: 'short' }),
                    monthKey: `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`,
                    newMembers: pureNewMembers,
                    churnedMembers: pureChurnedMembers,
                    planChanges: planChangeCount,
                    netGrowth: pureNewMembers - pureChurnedMembers,
                    activeMembers: activeAtMonthEnd
                });
            }

            return trend;
        };

        // ========================================
        // 会員利用回数管理（Google Sheets連携）
        // ========================================

        // 更新日計算ヘルパー
        // サブスク登録日から、ある月の更新日（課金日）を算出
        // 31日登録 → 2月は28日(29日)、4月は30日 に繰り上がる
        const getBillingDayForMonth = (registrationDay, year, month) => {
            // month: 0-indexed (0=Jan)
            // その月の最終日を取得
            const lastDay = new Date(year, month + 1, 0).getDate();
            return Math.min(registrationDay, lastDay);
        };

        // 会員の現在の請求期間（開始日・終了日・次回更新日）を計算
        const getCurrentBillingPeriod = (startDateStr) => {
            if (!startDateStr) return null;
            const startDate = new Date(startDateStr);
            const regDay = startDate.getDate(); // 登録日の「日」
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            // 今月の更新日
            const thisMonthBillingDay = getBillingDayForMonth(regDay, today.getFullYear(), today.getMonth());
            const thisMonthBillingDate = new Date(today.getFullYear(), today.getMonth(), thisMonthBillingDay);

            let periodStart, periodEnd, nextRenewal;

            if (today >= thisMonthBillingDate) {
                // 今月の更新日を過ぎている → 今期間は今月更新日〜来月更新日前日
                periodStart = thisMonthBillingDate;
                const nextMonth = today.getMonth() + 1;
                const nextYear = nextMonth > 11 ? today.getFullYear() + 1 : today.getFullYear();
                const nextM = nextMonth > 11 ? 0 : nextMonth;
