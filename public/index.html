<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>si'se - 整体院経営ダッシュボード</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Recharts Dependencies -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

    <!-- Babel (for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Config for Tailwind (si'se Theme - Enhanced) -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        sise: {
                            50: '#f0faf4',
                            100: '#dbf2e3',
                            200: '#b9e5ca',
                            300: '#88d1a8',
                            400: '#55b87f',
                            500: '#33a065',
                            600: '#238050',
                            700: '#1d6641',
                            800: '#1a5136',
                            900: '#16432d',
                            950: '#0b2519',
                        },
                        coral: {
                            50: '#fff5f2',
                            100: '#ffe8e0',
                            200: '#ffd0c2',
                            300: '#ffab93',
                            400: '#ff7f5c',
                            500: '#ff5733',
                            600: '#e63e1a',
                        },
                        accent: {
                            50: '#fefce8',
                            100: '#fef9c3',
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04',
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans JP"', '"Hiragino Sans"', 'sans-serif'],
                        display: ['"Noto Sans JP"', 'sans-serif'],
                    },
                    keyframes: {
                        'fade-in-up': {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        'fade-in': {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        'slide-in-right': {
                            '0%': { opacity: '0', transform: 'translateX(-24px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        },
                        'scale-in': {
                            '0%': { opacity: '0', transform: 'scale(0.92)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                        'count-up': {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        'float': {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-12px)' },
                        },
                        'float-slow': {
                            '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                            '50%': { transform: 'translateY(-8px) rotate(3deg)' },
                        },
                        'gradient-shift': {
                            '0%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                            '100%': { backgroundPosition: '0% 50%' },
                        },
                        'shimmer': {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' },
                        },
                        'glow-pulse': {
                            '0%, 100%': { boxShadow: '0 0 20px rgba(51,160,101,0.15)' },
                            '50%': { boxShadow: '0 0 40px rgba(51,160,101,0.3)' },
                        },
                    },
                    animation: {
                        'fade-in-up': 'fade-in-up 0.6s cubic-bezier(0.16,1,0.3,1) forwards',
                        'fade-in': 'fade-in 0.5s ease-out forwards',
                        'slide-in-right': 'slide-in-right 0.5s cubic-bezier(0.16,1,0.3,1) forwards',
                        'scale-in': 'scale-in 0.4s cubic-bezier(0.16,1,0.3,1) forwards',
                        'count-up': 'count-up 0.7s cubic-bezier(0.16,1,0.3,1) forwards',
                        'float': 'float 6s ease-in-out infinite',
                        'float-slow': 'float-slow 8s ease-in-out infinite',
                        'gradient-shift': 'gradient-shift 8s ease infinite',
                        'shimmer': 'shimmer 2s linear infinite',
                        'glow-pulse': 'glow-pulse 3s ease-in-out infinite',
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;800&display=swap');

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }

        body {
            background-color: #f4f8f5;
            color: #1a2e23;
            font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Dark Mode */
        .dark body { background-color: #0a1610; color: #e2e8f0; }
        .dark .bg-white { background-color: #12231b !important; }
        .dark .bg-slate-50 { background-color: #0d1c14 !important; }
        .dark .text-slate-900 { color: #f1f5f9 !important; }
        .dark .text-slate-800 { color: #e2e8f0 !important; }
        .dark .text-slate-700 { color: #cbd5e1 !important; }
        .dark .text-slate-600 { color: #94a3b8 !important; }
        .dark .border-slate-200 { border-color: #1e3a2c !important; }
        .dark .border-sise-200 { border-color: #1d6641 !important; }
        .dark .glass-panel { background: rgba(18,35,27,0.9); border-color: rgba(51,160,101,0.15); }
        .dark .glass-card { background: rgba(18,35,27,0.7); border-color: rgba(51,160,101,0.12); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #b9e5ca; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #88d1a8; }

        /* Glass Panel */
        .glass-panel {
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(24px) saturate(1.8);
            -webkit-backdrop-filter: blur(24px) saturate(1.8);
            border: 1px solid rgba(51,160,101,0.1);
        }

        /* Glass Card */
        .glass-card {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(16px) saturate(1.4);
            -webkit-backdrop-filter: blur(16px) saturate(1.4);
            border: 1px solid rgba(51,160,101,0.08);
            border-radius: 20px;
            transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
        }
        .glass-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 48px -12px rgba(51,160,101,0.18);
            border-color: rgba(51,160,101,0.2);
        }

        /* Animated mesh background */
        .bg-mesh {
            background-image:
                radial-gradient(at 15% 15%, rgba(51,160,101,0.08) 0px, transparent 55%),
                radial-gradient(at 85% 25%, rgba(85,184,127,0.06) 0px, transparent 55%),
                radial-gradient(at 50% 80%, rgba(136,209,168,0.05) 0px, transparent 55%),
                radial-gradient(at 80% 80%, rgba(255,87,51,0.03) 0px, transparent 55%);
        }

        /* Floating orbs (decorative background) */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }
        .bg-orb-1 { width: 400px; height: 400px; background: rgba(51,160,101,0.12); top: -100px; right: -100px; animation: float 8s ease-in-out infinite; }
        .bg-orb-2 { width: 300px; height: 300px; background: rgba(85,184,127,0.08); bottom: 10%; left: -80px; animation: float-slow 10s ease-in-out infinite; }
        .bg-orb-3 { width: 250px; height: 250px; background: rgba(255,127,92,0.06); top: 40%; right: 10%; animation: float 12s ease-in-out infinite reverse; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        /* Gradient text */
        .gradient-text {
            background: linear-gradient(135deg, #33a065 0%, #238050 50%, #55b87f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Card hover */
        .card-hover {
            transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 50px -15px rgba(51,160,101,0.2);
        }

        /* KPI card gradient borders */
        .kpi-card {
            position: relative;
            overflow: hidden;
        }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--kpi-color, #33a065), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .kpi-card:hover::before { opacity: 1; }

        /* Number animation */
        .num-animate {
            display: inline-block;
            animation: count-up 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
        }

        /* Staggered animations */
        .stagger-1 { animation-delay: 0.06s; opacity: 0; }
        .stagger-2 { animation-delay: 0.12s; opacity: 0; }
        .stagger-3 { animation-delay: 0.18s; opacity: 0; }
        .stagger-4 { animation-delay: 0.24s; opacity: 0; }
        .stagger-5 { animation-delay: 0.30s; opacity: 0; }
        .stagger-6 { animation-delay: 0.36s; opacity: 0; }

        /* Status pulse */
        .status-active::before {
            content: '';
            display: inline-block;
            width: 7px; height: 7px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
            50% { opacity: 0.7; box-shadow: 0 0 0 4px rgba(34,197,94,0); }
        }

        /* Loading */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .skeleton {
            background: linear-gradient(90deg, #e8f3ec 25%, #f0faf4 50%, #e8f3ec 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s linear infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Table hover */
        .table-row-hover {
            transition: all 0.2s ease;
        }
        .table-row-hover:hover {
            background-color: rgba(51,160,101,0.04);
        }

        /* Usage counter */
        .usage-ring {
            transition: stroke-dashoffset 0.6s cubic-bezier(0.16,1,0.3,1);
        }

        /* Bottom Navigation (Mobile) */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 50;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(24px) saturate(1.8);
            -webkit-backdrop-filter: blur(24px) saturate(1.8);
            border-top: 1px solid rgba(51,160,101,0.1);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .dark .bottom-nav {
            background: rgba(18,35,27,0.92);
            border-color: rgba(51,160,101,0.15);
        }
        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 0 4px;
            font-size: 10px;
            font-weight: 500;
            color: #94a3b8;
            transition: all 0.2s ease;
            position: relative;
            flex: 1;
            min-height: 52px;
        }
        .bottom-nav-item.active {
            color: #33a065;
        }
        .bottom-nav-item.active::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 24px; height: 3px;
            background: linear-gradient(90deg, #33a065, #55b87f);
            border-radius: 0 0 4px 4px;
        }

        /* Gradient button */
        .btn-gradient {
            background: linear-gradient(135deg, #33a065, #238050);
            color: white;
            border: none;
            box-shadow: 0 4px 16px -4px rgba(51,160,101,0.4);
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            box-shadow: 0 8px 24px -4px rgba(51,160,101,0.5);
            transform: translateY(-1px);
        }

        /* Mobile-first */
        @media (max-width: 768px) {
            body { font-size: 16px; }
            input, select, textarea { font-size: 16px !important; }
            button, a { min-height: 44px; }
            .hide-mobile { display: none !important; }
        }
        @media (min-width: 769px) {
            .hide-desktop { display: none !important; }
            .bottom-nav { display: none !important; }
        }

        /* Safe Area */
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

        /* Member avatar */
        .member-avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px; height: 40px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            color: white;
            flex-shrink: 0;
        }

        /* Chart tooltip custom */
        .recharts-tooltip-wrapper .recharts-default-tooltip {
            border-radius: 12px !important;
            box-shadow: 0 8px 32px -8px rgba(0,0,0,0.12) !important;
        }
    </style>
</head>
<body>
    <div id="root">
        <div id="loading-indicator" style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(160deg, #f0faf4 0%, #e0f2e7 40%, #f4f8f5 100%); position: relative; overflow: hidden;">
            <div style="position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(51,160,101,0.08);filter:blur(60px);top:-50px;right:-50px;"></div>
            <div style="position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(85,184,127,0.06);filter:blur(50px);bottom:20%;left:-40px;"></div>
            <div style="text-align: center; position: relative; z-index: 1;">
                <div style="width: 56px; height: 56px; border: 3px solid #b9e5ca; border-top: 3px solid #33a065; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 28px;"></div>
                <p style="color: #16432d; font-size: 22px; font-family: 'Noto Sans JP', sans-serif; font-weight: 700; letter-spacing: 0.08em;">si'se</p>
                <p style="color: #88d1a8; font-size: 10px; font-family: 'Noto Sans JP', sans-serif; margin-top: 10px; letter-spacing: 0.15em; text-transform: uppercase;">Dashboard Loading...</p>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;
        const RechartsLib = window.Recharts || {};
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, LineChart, Line, AreaChart, Area, PieChart, Pie, Cell, ComposedChart } = RechartsLib;

        // ========================================
        // 設定・定数
        // ========================================

        // 店舗マスタ（サーバーから動的に取得）
        let serverStores = [];

        // Google Apps Script Web App URL (日報データ取得用)
        // ※実際のデプロイ後URLに置き換えてください
        const GOOGLE_FORM_SHEET_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL';

        // Square API設定（サーバーサイドプロキシ経由）
        // APIキーはVercel環境変数で管理、フロントエンドには露出しない
        const SQUARE_PROXY_BASE = '/api/square';

        // サーバーから設定を取得（店舗一覧含む）
        const fetchSquareConfig = async () => {
            try {
                const res = await fetch(`${SQUARE_PROXY_BASE}/config`);
                if (res.ok) {
                    const config = await res.json();
                    serverStores = config.stores || [];
                    return config;
                }
            } catch (e) {}
            return {
                configured: false,
                stores: [],
                environment: 'sandbox',
                locationId: '',
                defaultMonthlyPrice: 10000
            };
        };

        // ========================================
        // スタッフ・アクセス管理
        // ========================================

        const STAFF_STORAGE_KEY = 'sise_staff_config';

        // URLパラメータからアクセス情報をデコード
        const parseAccessFromUrl = () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('v');
            if (!token) return null;
            try {
                const json = decodeURIComponent(escape(atob(token)));
                const decoded = JSON.parse(json);
                return {
                    name: decoded.n || '不明',
                    role: decoded.r || 'staff',
                    storeIds: decoded.sid || [],
                };
            } catch (e) {
                console.warn('Invalid access token');
                return null;
            }
        };

        // アクセストークン生成（UTF-8対応）
        const generateStaffToken = (staff) => {
            const payload = { n: staff.name, r: staff.role, sid: staff.storeIds };
            return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
        };

        // スタッフ用URL生成
        const generateStaffUrl = (staff) => {
            const token = generateStaffToken(staff);
            const base = window.location.origin + window.location.pathname;
            return `${base}?v=${token}`;
        };

        // localStorage管理
        const loadStaffList = () => {
            try { return JSON.parse(localStorage.getItem(STAFF_STORAGE_KEY)) || []; }
            catch { return []; }
        };
        const saveStaffList = (list) => localStorage.setItem(STAFF_STORAGE_KEY, JSON.stringify(list));

        // 現在のアクセス情報（URLから解析）
        const currentAccess = parseAccessFromUrl();

        // ========================================
        // ヘルパー関数
        // ========================================

        const formatCurrency = (value) => {
            return new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY' }).format(value);
        };

        const formatNumber = (value) => {
            return new Intl.NumberFormat('ja-JP').format(value);
        };

        const formatPercent = (value) => {
            return `${value.toFixed(1)}%`;
        };

        // ========================================
        // コンポーネント
        // ========================================

        // アイコンコンポーネント
        const Icon = ({ name, size = 20, color = "currentColor", className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} width={size} height={size} stroke={color} className={className}></i>;
        };

        // アバターカラー生成
        const getAvatarColor = (name) => {
            const colors = [
                'from-sise-400 to-sise-600',
                'from-emerald-400 to-emerald-600',
                'from-teal-400 to-teal-600',
                'from-cyan-400 to-cyan-600',
                'from-blue-400 to-blue-600',
                'from-violet-400 to-violet-600',
                'from-pink-400 to-pink-600',
                'from-rose-400 to-rose-600',
                'from-amber-400 to-amber-600',
                'from-orange-400 to-orange-600',
            ];
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return colors[Math.abs(hash) % colors.length];
        };

        // アバターコンポーネント
        const Avatar = ({ name, size = 40 }) => {
            const initial = (name || '?').charAt(0);
            const colorClass = getAvatarColor(name || '');
            return (
                <div
                    className={`member-avatar bg-gradient-to-br ${colorClass}`}
                    style={{ width: size, height: size, fontSize: Math.round(size * 0.38) }}
                >
                    {initial}
                </div>
            );
        };

        // カードコンポーネント
        const Card = ({ children, className = "", hover = false }) => (
            <div className={`glass-card p-5 md:p-6 shadow-sm ${hover ? 'card-hover' : ''} ${className}`}>
                {children}
            </div>
        );

        // KPIカードコンポーネント
        const KpiCard = ({ title, value, subValue, trend, icon, color = "bg-sise-500", gradientFrom = "from-sise-400", gradientTo = "to-sise-600" }) => (
            <Card hover className="group kpi-card relative overflow-hidden">
                <div className="flex justify-between items-start mb-3">
                    <div className={`rounded-xl bg-gradient-to-br ${gradientFrom} ${gradientTo} text-white shadow-lg p-3 group-hover:scale-110 transition-transform duration-400`}>
                        <Icon name={icon} size={20} />
                    </div>
                    {trend !== null && trend !== undefined && (
                        <span className={`font-semibold ${trend >= 0 ? 'text-emerald-600 bg-emerald-50/80' : 'text-red-500 bg-red-50/80'} flex items-center px-2.5 py-1 rounded-full text-xs backdrop-blur-sm`}>
                            {trend >= 0 ? '+' : ''}{trend}%
                            <Icon name={trend >= 0 ? 'trending-up' : 'trending-down'} size={12} className="ml-1" />
                        </span>
                    )}
                </div>
                <h3 className="text-slate-500 font-medium text-[11px] tracking-wider uppercase">{title}</h3>
                <div className="flex items-baseline mt-1">
                    <span className="text-2xl md:text-3xl font-extrabold text-slate-900 num-animate tracking-tight">{value}</span>
                </div>
                {subValue && <p className="text-[11px] text-slate-400 mt-1.5">{subValue}</p>}
            </Card>
        );

        // セクションヘッダーコンポーネント
        const SectionHeader = ({ title, subtitle, icon, children }) => (
            <div className="flex flex-wrap items-center justify-between gap-3 mb-1">
                <div className="flex items-center">
                    {icon && (
                        <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-sise-400 to-sise-600 text-white flex items-center justify-center mr-3 shadow-lg shadow-sise-500/20">
                            <Icon name={icon} size={18} />
                        </div>
                    )}
                    <div>
                        <h2 className="text-lg md:text-xl font-bold text-slate-800">{title}</h2>
                        {subtitle && <p className="text-[10px] text-sise-500 tracking-widest font-semibold uppercase">{subtitle}</p>}
                    </div>
                </div>
                {children}
            </div>
        );

        // ========================================
        // Square API連携
        // ========================================

        const useSquareData = (activeStoreId, allowedStoreIds) => {
            const [memberData, setMemberData] = useState({
                totalMembers: 0,
                activeMembers: 0,
                newMembersThisMonth: 0,
                churnedMembers: 0,
                churnRate: 0,
                expectedRevenue: 0,
                members: [], // 会員詳細リスト
                monthlyTrend: [], // 月間入退会トレンド
                stores: [], // 利用可能な店舗一覧
                loading: true,
                error: null
            });

            // ページネーション付きAPI呼び出しヘルパー（プロキシ経由、店舗ID付き）
            const fetchAllPages = async (endpoint, bodyBuilder, resultKey, storeId) => {
                let allResults = [];
                let cursor = null;
                do {
                    const body = bodyBuilder(cursor);
                    const headers = { 'Content-Type': 'application/json' };
                    if (storeId && storeId !== 'all') headers['X-Store-Id'] = storeId;
                    const response = await fetch(`${SQUARE_PROXY_BASE}/${endpoint}`, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify(body)
                    });
                    if (!response.ok) {
                        const errorBody = await response.json().catch(() => ({}));
                        throw new Error(`API ${endpoint}: ${response.status} - ${JSON.stringify(errorBody.errors || errorBody.error || [])}`);
                    }
                    const data = await response.json();
                    allResults = allResults.concat(data[resultKey] || []);
                    cursor = data.cursor || null;
                } while (cursor);
                return allResults;
            };

            // サブスクリプション操作（解約・一時停止・再開）
            const operateSubscription = async (subscriptionId, action, storeId) => {
                const headers = { 'Content-Type': 'application/json' };
                if (storeId && storeId !== 'all') headers['X-Store-Id'] = storeId;
                const response = await fetch(`${SQUARE_PROXY_BASE}/subscriptions/${subscriptionId}/${action}`, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({})
                });
                if (!response.ok) {
                    const errorBody = await response.json().catch(() => ({}));
                    const detail = errorBody.errors
                        ? errorBody.errors.map(e => e.detail || e.code).join(', ')
                        : JSON.stringify(errorBody);
                    throw new Error(detail);
                }
                return await response.json();
            };

            const fetchSquareData = useCallback(async () => {
                // サーバーの設定を確認
                const serverConfig = await fetchSquareConfig();

                // デモモード: サーバーにAPIが設定されていない場合はサンプルデータ
                if (!serverConfig.configured) {
                    const sampleMembers = generateSampleMembers();
                    const sampleMonthlyTrend = generateMonthlyTrend();

                    setMemberData({
                        totalMembers: 156,
                        activeMembers: 142,
                        newMembersThisMonth: 12,
                        churnedMembers: 5,
                        churnRate: 3.2,
                        expectedRevenue: 1420000,
                        members: sampleMembers,
                        monthlyTrend: sampleMonthlyTrend,
                        stores: [],
                        loading: false,
                        error: null
                    });
                    return;
                }

                const stores = serverConfig.stores || [];
                const defaultMonthlyPrice = serverConfig.defaultMonthlyPrice;

                // 取得対象の店舗を決定（アクセス制限適用）
                let availStores = stores;
                if (allowedStoreIds && allowedStoreIds.length > 0) {
                    availStores = stores.filter(s => allowedStoreIds.includes(s.id));
                }
                const targetStores = (activeStoreId && activeStoreId !== 'all')
                    ? availStores.filter(s => s.id === activeStoreId)
                    : availStores;

                if (targetStores.length === 0) {
                    setMemberData(prev => ({ ...prev, stores, loading: false, error: '対象店舗が見つかりません' }));
                    return;
                }

                try {
                    let allCustomers = [];
                    let allSubscriptions = [];
                    let allInvoices = [];
                    let catalogMap = {};

                    // 各店舗のデータを取得
                    for (const store of targetStores) {
                        const storeId = store.id;
                        const locationId = store.locationId;

                        // 1. Customers API
                        const customers = await fetchAllPages(
                            'customers/search',
                            (cursor) => ({ limit: 100, ...(cursor ? { cursor } : {}) }),
                            'customers',
                            storeId
                        );
                        // 店舗情報をタグ付け
                        customers.forEach(c => { c._storeId = storeId; c._storeName = store.name; });
                        allCustomers = allCustomers.concat(customers);

                        // 2. Subscriptions API
                        const subscriptions = await fetchAllPages(
                            'subscriptions/search',
                            (cursor) => ({
                                query: { filter: { location_ids: [locationId] } },
                                ...(cursor ? { cursor } : {})
                            }),
                            'subscriptions',
                            storeId
                        );
                        subscriptions.forEach(s => { s._storeId = storeId; s._storeName = store.name; });
                        allSubscriptions = allSubscriptions.concat(subscriptions);

                        // 3. Catalog API
                        const planIds = [...new Set(subscriptions
                            .filter(s => s.plan_variation_id)
                            .map(s => s.plan_variation_id))];

                        if (planIds.length > 0) {
                            try {
                                const headers = { 'Content-Type': 'application/json' };
                                if (storeId) headers['X-Store-Id'] = storeId;
                                const catalogResponse = await fetch(`${SQUARE_PROXY_BASE}/catalog/batch-retrieve`, {
                                    method: 'POST',
                                    headers,
                                    body: JSON.stringify({ object_ids: planIds })
                                });
                                if (catalogResponse.ok) {
                                    const catalogData = await catalogResponse.json();
                                    (catalogData.objects || []).forEach(obj => {
                                        const subPlan = obj.subscription_plan_variation_data || obj.subscription_plan_data;
                                        catalogMap[obj.id] = {
                                            name: subPlan?.name || obj.id,
                                            phases: subPlan?.phases || []
                                        };
                                    });
                                }
                            } catch (e) {
                                console.warn('Catalog API fetch failed:', e);
                            }
                        }

                        // 4. Invoices API
                        const invoices = await fetchAllPages(
                            'invoices/search',
                            (cursor) => ({
                                query: { filter: { location_ids: [locationId] } },
                                limit: 200,
                                ...(cursor ? { cursor } : {})
                            }),
                            'invoices',
                            storeId
                        );
                        invoices.forEach(inv => { inv._storeId = storeId; inv._storeName = store.name; });
                        allInvoices = allInvoices.concat(invoices);
                    }

                    const customers = allCustomers;
                    const subscriptions = allSubscriptions;
                    const invoices = allInvoices;

                    // 5. 会員詳細データの構築
                    const membersList = subscriptions.map(sub => {
                        const customer = customers.find(c => c.id === sub.customer_id);
                        const memberInvoices = invoices.filter(inv =>
                            inv.primary_recipient?.customer_id === sub.customer_id
                        );

                        // プラン金額をphasesから取得
                        let monthlyPrice = defaultMonthlyPrice;
                        let planName = 'スタンダードプラン';
                        let cadence = 'MONTHLY';

                        // Catalog APIからプラン情報取得
                        if (sub.plan_variation_id && catalogMap[sub.plan_variation_id]) {
                            const plan = catalogMap[sub.plan_variation_id];
                            planName = plan.name;
                            if (plan.phases && plan.phases.length > 0) {
                                const phase = plan.phases[0];
                                cadence = phase.cadence || 'MONTHLY';
                                if (phase.pricing && phase.pricing.price_money) {
                                    monthlyPrice = phase.pricing.price_money.amount || monthlyPrice;
                                } else if (phase.recurring_price_money) {
                                    monthlyPrice = phase.recurring_price_money.amount || monthlyPrice;
                                }
                            }
                        }

                        // Subscription phasesから直接取得（フォールバック）
                        if (sub.phases && sub.phases.length > 0) {
                            const activePhase = sub.phases.find(p => !p.uid || p) || sub.phases[0];
                            if (activePhase.pricing && activePhase.pricing.price_money) {
                                monthlyPrice = activePhase.pricing.price_money.amount || monthlyPrice;
                            } else if (activePhase.recurring_price_money) {
                                monthlyPrice = activePhase.recurring_price_money.amount || monthlyPrice;
                            }
                            if (activePhase.cadence) {
                                cadence = activePhase.cadence;
                            }
                        }

                        // Invoice金額の正しい取得
                        const paymentHistory = memberInvoices
                            .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
                            .slice(0, 10)
                            .map(inv => {
                                let amount = 0;
                                if (inv.payment_requests && inv.payment_requests.length > 0) {
                                    const req = inv.payment_requests[0];
                                    amount = req.computed_amount_money?.amount
                                        || req.fixed_amount_requested_money?.amount
                                        || 0;
                                }
                                return {
                                    id: inv.id,
                                    date: inv.created_at,
                                    amount: amount,
                                    status: inv.status, // DRAFT, UNPAID, PAID, CANCELED等
                                    invoiceNumber: inv.invoice_number || '-'
                                };
                            });

                        return {
                            id: sub.id,
                            customerId: sub.customer_id,
                            name: customer ? `${customer.family_name || ''}${customer.given_name || ''}`.trim() || '未登録' : '未登録',
                            email: customer?.email_address || '-',
                            phone: customer?.phone_number || '-',
                            status: sub.status,
                            startDate: sub.start_date,
                            canceledDate: sub.canceled_date || null,
                            createdAt: sub.created_at,
                            planName: planName,
                            planVariationId: sub.plan_variation_id,
                            monthlyPrice: monthlyPrice,
                            cadence: cadence,
                            paymentHistory: paymentHistory,
                            storeId: sub._storeId || 'default',
                            storeName: sub._storeName || '',
                        };
                    });

                    // 6. 集計
                    const activeSubscriptions = subscriptions.filter(s => s.status === 'ACTIVE');
                    const now = new Date();
                    const thisMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
                    const thisMonthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0);

                    const canceledThisMonth = subscriptions.filter(s => {
                        if (s.status !== 'CANCELED' || !s.canceled_date) return false;
                        const cancelDate = new Date(s.canceled_date);
                        return cancelDate >= thisMonthStart && cancelDate <= thisMonthEnd;
                    });

                    const newThisMonth = subscriptions.filter(s => {
                        const startDate = new Date(s.start_date);
                        return startDate >= thisMonthStart && startDate <= thisMonthEnd;
                    });

                    // 月間トレンドデータを生成
                    const monthlyTrend = generateMonthlyTrendFromData(subscriptions);

                    // 実際の売上を計算（会員ごとの金額を合計）
                    const totalExpectedRevenue = membersList
                        .filter(m => m.status === 'ACTIVE')
                        .reduce((sum, m) => sum + m.monthlyPrice, 0);

                    setMemberData({
                        totalMembers: subscriptions.length,
                        activeMembers: activeSubscriptions.length,
                        newMembersThisMonth: newThisMonth.length,
                        churnedMembers: canceledThisMonth.length,
                        churnRate: activeSubscriptions.length > 0
                            ? (canceledThisMonth.length / activeSubscriptions.length * 100)
                            : 0,
                        expectedRevenue: totalExpectedRevenue,
                        members: membersList,
                        monthlyTrend: monthlyTrend,
                        stores: stores,
                        loading: false,
                        error: null
                    });

                } catch (error) {
                    console.error('Square API Error:', error);
                    setMemberData(prev => ({
                        ...prev,
                        loading: false,
                        error: error.message
                    }));
                }
            }, [activeStoreId, allowedStoreIds]);

            useEffect(() => {
                fetchSquareData();
                // 5分ごとに更新
                const interval = setInterval(fetchSquareData, 5 * 60 * 1000);
                return () => clearInterval(interval);
            }, [fetchSquareData]);

            return { memberData, refreshSquareData: fetchSquareData, operateSubscription };
        };

        // ========================================
        // Googleフォーム日報データ連携
        // ========================================

        const useDailyReportData = () => {
            const [reportData, setReportData] = useState({
                reports: [],
                loading: true,
                error: null,
                lastUpdated: null
            });

            const fetchReportData = useCallback(async () => {
                // デモモード
                if (GOOGLE_FORM_SHEET_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL') {
                    // サンプルデータ
                    const sampleData = generateSampleReportData();
                    setReportData({
                        reports: sampleData,
                        loading: false,
                        error: null,
                        lastUpdated: new Date()
                    });
                    return;
                }

                try {
                    const response = await fetch(GOOGLE_FORM_SHEET_URL);
                    if (!response.ok) {
                        throw new Error('Failed to fetch report data');
                    }
                    const data = await response.json();

                    setReportData({
                        reports: data.reports || [],
                        loading: false,
                        error: null,
                        lastUpdated: new Date()
                    });
                } catch (error) {
                    console.error('Report fetch error:', error);
                    setReportData(prev => ({
                        ...prev,
                        loading: false,
                        error: error.message
                    }));
                }
            }, []);

            useEffect(() => {
                fetchReportData();
            }, [fetchReportData]);

            return { reportData, refreshReportData: fetchReportData };
        };

        // サンプル日報データ生成
        const generateSampleReportData = () => {
            const reports = [];
            const storeNames = ['新宿店', '渋谷店'];
            const now = new Date();

            for (let i = 0; i < 30; i++) {
                const date = new Date(now);
                date.setDate(date.getDate() - i);

                storeNames.forEach(store => {
                    reports.push({
                        timestamp: date.toISOString(),
                        store: store,
                        hpbNew: Math.floor(Math.random() * 5),
                        metaNew: Math.floor(Math.random() * 4),
                        referralNew: Math.floor(Math.random() * 3),
                        discountNew: Math.floor(Math.random() * 2),
                        hpbContract: Math.floor(Math.random() * 3),
                        metaContract: Math.floor(Math.random() * 2),
                        referralContract: Math.floor(Math.random() * 2),
                        discountContract: Math.floor(Math.random() * 1),
                        existingTreatments: Math.floor(Math.random() * 15) + 5,
                        dailyTasksCompleted: Math.random() > 0.1,
                        tomorrowPrepCompleted: Math.random() > 0.15
                    });
                });
            }

            return reports;
        };

        // サンプル会員データ生成
        const generateSampleMembers = () => {
            const names = ['田中太郎', '佐藤花子', '鈴木一郎', '高橋美咲', '伊藤健太', '渡辺さくら', '山本大輔', '中村優子', '小林誠', '加藤愛'];
            const statuses = ['ACTIVE', 'ACTIVE', 'ACTIVE', 'ACTIVE', 'ACTIVE', 'ACTIVE', 'CANCELED', 'PENDING'];
            const plans = ['スタンダードプラン', 'プレミアムプラン'];
            const members = [];

            for (let i = 0; i < 50; i++) {
                const status = statuses[Math.floor(Math.random() * statuses.length)];
                const startDate = new Date();
                startDate.setMonth(startDate.getMonth() - Math.floor(Math.random() * 12));

                let canceledDate = null;
                if (status === 'CANCELED') {
                    canceledDate = new Date(startDate);
                    canceledDate.setMonth(canceledDate.getMonth() + Math.floor(Math.random() * 6) + 1);
                }

                const monthlyPrice = Math.random() > 0.7 ? 15000 : 10000;
                const paymentCount = Math.floor(Math.random() * 5) + 1;
                const paymentHistory = [];
                for (let j = 0; j < paymentCount; j++) {
                    const payDate = new Date();
                    payDate.setMonth(payDate.getMonth() - j);
                    paymentHistory.push({
                        id: `inv_${i}_${j}`,
                        date: payDate.toISOString(),
                        amount: monthlyPrice,
                        status: Math.random() > 0.1 ? 'PAID' : 'PENDING'
                    });
                }

                members.push({
                    id: `sub_${i}`,
                    customerId: `cust_${i}`,
                    name: names[i % names.length] + (i > 9 ? ` (${Math.floor(i / 10)})` : ''),
                    email: `member${i}@example.com`,
                    phone: `090-${1000 + i}-${1000 + i}`,
                    status: status,
                    startDate: startDate.toISOString(),
                    canceledDate: canceledDate ? canceledDate.toISOString() : null,
                    planName: plans[monthlyPrice === 15000 ? 1 : 0],
                    monthlyPrice: monthlyPrice,
                    cadence: 'MONTHLY',
                    paymentHistory: paymentHistory
                });
            }

            return members;
        };

        // 月間トレンドデータ生成（サンプル）
        const generateMonthlyTrend = () => {
            const trend = [];
            const now = new Date();

            for (let i = 11; i >= 0; i--) {
                const date = new Date(now.getFullYear(), now.getMonth() - i, 1);
                trend.push({
                    month: date.toLocaleDateString('ja-JP', { year: 'numeric', month: 'short' }),
                    newMembers: Math.floor(Math.random() * 15) + 5,
                    churnedMembers: Math.floor(Math.random() * 8) + 1,
                    netGrowth: 0
                });
            }

            trend.forEach(t => {
                t.netGrowth = t.newMembers - t.churnedMembers;
            });

            return trend;
        };

        // 実データから月間トレンドを生成（累積会員数付き）
        const generateMonthlyTrendFromData = (subscriptions) => {
            const trend = [];
            const now = new Date();
            let cumulativeActive = 0;

            for (let i = 11; i >= 0; i--) {
                const date = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const monthStart = new Date(date.getFullYear(), date.getMonth(), 1);
                const monthEnd = new Date(date.getFullYear(), date.getMonth() + 1, 0);

                const newMembers = subscriptions.filter(s => {
                    const startDate = new Date(s.start_date);
                    return startDate >= monthStart && startDate <= monthEnd;
                }).length;

                const churnedMembers = subscriptions.filter(s => {
                    if (!s.canceled_date) return false;
                    const cancelDate = new Date(s.canceled_date);
                    return cancelDate >= monthStart && cancelDate <= monthEnd;
                }).length;

                // 各月末時点のアクティブ会員数を計算
                const activeAtMonthEnd = subscriptions.filter(s => {
                    const startDate = new Date(s.start_date);
                    if (startDate > monthEnd) return false;
                    if (s.status === 'CANCELED' && s.canceled_date) {
                        const cancelDate = new Date(s.canceled_date);
                        return cancelDate > monthEnd;
                    }
                    return s.status === 'ACTIVE' || s.status === 'PENDING' || s.status === 'PAUSED'
                        || (s.status === 'CANCELED' && s.canceled_date && new Date(s.canceled_date) > monthEnd);
                }).length;

                trend.push({
                    month: date.toLocaleDateString('ja-JP', { year: 'numeric', month: 'short' }),
                    monthKey: `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`,
                    newMembers: newMembers,
                    churnedMembers: churnedMembers,
                    netGrowth: newMembers - churnedMembers,
                    activeMembers: activeAtMonthEnd
                });
            }

            return trend;
        };

        // ========================================
        // 会員利用回数管理（Google Sheets連携）
        // ========================================

        const MEMBER_USAGE_GAS_URL = localStorage.getItem('sise_usage_gas_url') || 'YOUR_USAGE_GAS_URL';

        const useMemberUsage = () => {
            const [usageData, setUsageData] = useState({});
            const [saving, setSaving] = useState(false);
            const [lastSaved, setLastSaved] = useState(null);

            const currentMonth = new Date().toISOString().slice(0, 7); // YYYY-MM

            // ローカルストレージからロード
            useEffect(() => {
                try {
                    const stored = JSON.parse(localStorage.getItem('sise_member_usage') || '{}');
                    setUsageData(stored[currentMonth] || {});
                } catch { setUsageData({}); }

                // GASから読み込み
                if (MEMBER_USAGE_GAS_URL !== 'YOUR_USAGE_GAS_URL') {
                    fetch(MEMBER_USAGE_GAS_URL + '?action=getUsage&month=' + currentMonth)
                        .then(r => r.json())
                        .then(data => {
                            if (data && data.usage) {
                                setUsageData(prev => ({ ...prev, ...data.usage }));
                            }
                        })
                        .catch(() => {});
                }
            }, [currentMonth]);

            // 利用回数を更新
            const updateUsage = useCallback((memberId, count) => {
                setUsageData(prev => {
                    const updated = { ...prev, [memberId]: Math.max(0, count) };
                    // ローカルに保存
                    try {
                        const all = JSON.parse(localStorage.getItem('sise_member_usage') || '{}');
                        all[currentMonth] = updated;
                        localStorage.setItem('sise_member_usage', JSON.stringify(all));
                    } catch {}
                    return updated;
                });
            }, [currentMonth]);

            // Google Sheetsに保存
            const saveToSheet = useCallback(async (members) => {
                setSaving(true);
                try {
                    // ローカルに確実に保存
                    const all = JSON.parse(localStorage.getItem('sise_member_usage') || '{}');
                    all[currentMonth] = usageData;
                    localStorage.setItem('sise_member_usage', JSON.stringify(all));

                    if (MEMBER_USAGE_GAS_URL !== 'YOUR_USAGE_GAS_URL') {
                        const payload = Object.entries(usageData).map(([memberId, count]) => {
                            const member = members.find(m => m.id === memberId);
                            return {
                                memberId,
                                memberName: member?.name || '不明',
                                storeName: member?.storeName || '',
                                planName: member?.planName || '',
                                month: currentMonth,
                                count,
                                updatedAt: new Date().toISOString()
                            };
                        });
                        await fetch(MEMBER_USAGE_GAS_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'saveUsage', data: payload })
                        });
                    }
                    setLastSaved(new Date());
                } catch (e) {
                    console.error('Usage save error:', e);
                } finally {
                    setSaving(false);
                }
            }, [usageData, currentMonth]);

            const getUsage = useCallback((memberId) => {
                return usageData[memberId] || 0;
            }, [usageData]);

            return { usageData, updateUsage, saveToSheet, getUsage, saving, lastSaved, currentMonth };
        };

        // ========================================
        // 回数券管理（Google Sheets連携）
        // ========================================

        const TICKET_GAS_URL = localStorage.getItem('sise_ticket_gas_url') || 'YOUR_TICKET_GAS_URL';
        const TICKET_STORAGE_KEY = 'sise_ticket_data';

        const useTicketManagement = () => {
            // 回数券プラン（種類）
            const [ticketPlans, setTicketPlans] = useState([]);
            // 顧客回数券（購入記録）
            const [customerTickets, setCustomerTickets] = useState([]);
            const [saving, setSaving] = useState(false);
            const [lastSaved, setLastSaved] = useState(null);

            // ローカルストレージから読み込み
            useEffect(() => {
                try {
                    const stored = JSON.parse(localStorage.getItem(TICKET_STORAGE_KEY) || '{}');
                    setTicketPlans(stored.plans || [
                        { id: 'plan_1', name: '5回券', sessions: 5, price: 45000, validityDays: 90, active: true },
                        { id: 'plan_2', name: '10回券', sessions: 10, price: 80000, validityDays: 180, active: true },
                        { id: 'plan_3', name: '20回券', sessions: 20, price: 140000, validityDays: 365, active: true },
                    ]);
                    setCustomerTickets(stored.tickets || []);
                } catch { }

                // GASから読み込み
                if (TICKET_GAS_URL !== 'YOUR_TICKET_GAS_URL') {
                    fetch(TICKET_GAS_URL + '?action=getTickets')
                        .then(r => r.json())
                        .then(data => {
                            if (data && data.plans) setTicketPlans(data.plans);
                            if (data && data.tickets) setCustomerTickets(data.tickets);
                        })
                        .catch(() => {});
                }
            }, []);

            // ローカル保存
            const saveLocal = useCallback((plans, tickets) => {
                try {
                    localStorage.setItem(TICKET_STORAGE_KEY, JSON.stringify({ plans, tickets }));
                } catch {}
            }, []);

            // 回数券プラン管理
            const addPlan = useCallback((plan) => {
                const newPlan = { ...plan, id: 'plan_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) };
                setTicketPlans(prev => {
                    const updated = [...prev, newPlan];
                    saveLocal(updated, customerTickets);
                    return updated;
                });
                return newPlan;
            }, [customerTickets, saveLocal]);

            const updatePlan = useCallback((planId, updates) => {
                setTicketPlans(prev => {
                    const updated = prev.map(p => p.id === planId ? { ...p, ...updates } : p);
                    saveLocal(updated, customerTickets);
                    return updated;
                });
            }, [customerTickets, saveLocal]);

            const deletePlan = useCallback((planId) => {
                setTicketPlans(prev => {
                    const updated = prev.filter(p => p.id !== planId);
                    saveLocal(updated, customerTickets);
                    return updated;
                });
            }, [customerTickets, saveLocal]);

            // 顧客回数券管理
            const addCustomerTicket = useCallback((ticket) => {
                const plan = ticketPlans.find(p => p.id === ticket.planId);
                const purchaseDate = ticket.purchaseDate || new Date().toISOString().slice(0, 10);
                const expirationDate = ticket.expirationDate || (() => {
                    const d = new Date(purchaseDate);
                    d.setDate(d.getDate() + (plan?.validityDays || 180));
                    return d.toISOString().slice(0, 10);
                })();

                const newTicket = {
                    id: 'tkt_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                    customerName: ticket.customerName,
                    customerPhone: ticket.customerPhone || '',
                    planId: ticket.planId,
                    planName: plan?.name || ticket.planName || '',
                    totalSessions: plan?.sessions || ticket.totalSessions || 0,
                    remainingSessions: plan?.sessions || ticket.totalSessions || 0,
                    price: plan?.price || ticket.price || 0,
                    purchaseDate,
                    expirationDate,
                    storeName: ticket.storeName || '',
                    notes: ticket.notes || '',
                    usageHistory: [],
                    createdAt: new Date().toISOString(),
                };

                setCustomerTickets(prev => {
                    const updated = [newTicket, ...prev];
                    saveLocal(ticketPlans, updated);
                    return updated;
                });
                return newTicket;
            }, [ticketPlans, saveLocal]);

            const updateCustomerTicket = useCallback((ticketId, updates) => {
                setCustomerTickets(prev => {
                    const updated = prev.map(t => t.id === ticketId ? { ...t, ...updates } : t);
                    saveLocal(ticketPlans, updated);
                    return updated;
                });
            }, [ticketPlans, saveLocal]);

            const useSession = useCallback((ticketId) => {
                setCustomerTickets(prev => {
                    const updated = prev.map(t => {
                        if (t.id !== ticketId || t.remainingSessions <= 0) return t;
                        return {
                            ...t,
                            remainingSessions: t.remainingSessions - 1,
                            usageHistory: [...(t.usageHistory || []), { date: new Date().toISOString(), action: 'use' }],
                        };
                    });
                    saveLocal(ticketPlans, updated);
                    return updated;
                });
            }, [ticketPlans, saveLocal]);

            const undoSession = useCallback((ticketId) => {
                setCustomerTickets(prev => {
                    const updated = prev.map(t => {
                        if (t.id !== ticketId || t.remainingSessions >= t.totalSessions) return t;
                        return {
                            ...t,
                            remainingSessions: t.remainingSessions + 1,
                            usageHistory: [...(t.usageHistory || []), { date: new Date().toISOString(), action: 'undo' }],
                        };
                    });
                    saveLocal(ticketPlans, updated);
                    return updated;
                });
            }, [ticketPlans, saveLocal]);

            const deleteCustomerTicket = useCallback((ticketId) => {
                setCustomerTickets(prev => {
                    const updated = prev.filter(t => t.id !== ticketId);
                    saveLocal(ticketPlans, updated);
                    return updated;
                });
            }, [ticketPlans, saveLocal]);

            // Google Sheets に保存
            const saveToSheet = useCallback(async () => {
                setSaving(true);
                try {
                    saveLocal(ticketPlans, customerTickets);
                    if (TICKET_GAS_URL !== 'YOUR_TICKET_GAS_URL') {
                        await fetch(TICKET_GAS_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'saveTickets', plans: ticketPlans, tickets: customerTickets })
                        });
                    }
                    setLastSaved(new Date());
                } catch (e) {
                    console.error('Ticket save error:', e);
                } finally {
                    setSaving(false);
                }
            }, [ticketPlans, customerTickets, saveLocal]);

            // 集計
            const stats = useMemo(() => {
                const now = new Date();
                const active = customerTickets.filter(t => {
                    return t.remainingSessions > 0 && new Date(t.expirationDate) >= now;
                });
                const expiringSoon = customerTickets.filter(t => {
                    const exp = new Date(t.expirationDate);
                    const diff = (exp - now) / (1000 * 60 * 60 * 24);
                    return t.remainingSessions > 0 && diff >= 0 && diff <= 30;
                });
                const expired = customerTickets.filter(t => {
                    return t.remainingSessions > 0 && new Date(t.expirationDate) < now;
                });
                const completed = customerTickets.filter(t => t.remainingSessions <= 0);
                const totalRevenue = customerTickets.reduce((sum, t) => sum + (t.price || 0), 0);
                const totalRemaining = active.reduce((sum, t) => sum + t.remainingSessions, 0);
                return { active: active.length, expiringSoon: expiringSoon.length, expired: expired.length, completed: completed.length, totalRevenue, totalRemaining, total: customerTickets.length };
            }, [customerTickets]);

            return {
                ticketPlans, customerTickets, stats,
                addPlan, updatePlan, deletePlan,
                addCustomerTicket, updateCustomerTicket, useSession, undoSession, deleteCustomerTicket,
                saveToSheet, saving, lastSaved
            };
        };

                    await operateSubscription(member.id, action, member.storeId);

        const TicketManagementView = ({ ticketHook }) => {

                addPlan, updatePlan, deletePlan,
                addCustomerTicket, updateCustomerTicket, useSession, undoSession, deleteCustomerTicket,
                saveToSheet, saving, lastSaved
            } = ticketHook;

            const [activeTab, setActiveTab] = useState('tickets'); // 'tickets' | 'plans'
            const [showAddForm, setShowAddForm] = useState(false);
            const [showPlanForm, setShowPlanForm] = useState(false);
            const [editingPlan, setEditingPlan] = useState(null);
            const [selectedTicket, setSelectedTicket] = useState(null);
            const [filterStatus, setFilterStatus] = useState('active'); // 'all' | 'active' | 'expiring' | 'expired' | 'completed'
            const [searchQuery, setSearchQuery] = useState('');
            const [showSaved, setShowSaved] = useState(false);

            // 新規回数券フォーム
            const [newTicket, setNewTicket] = useState({
                customerName: '', customerPhone: '', planId: '', storeName: '', notes: '',
                purchaseDate: new Date().toISOString().slice(0, 10), expirationDate: ''
            });
            // プランフォーム
            const [planForm, setPlanForm] = useState({ name: '', sessions: '', price: '', validityDays: '' });

            // 日数計算
            const getDaysUntilExpiration = (expirationDate) => {
                const now = new Date();
                const exp = new Date(expirationDate);
                return Math.ceil((exp - now) / (1000 * 60 * 60 * 24));
            };

            // ステータス判定
            const getTicketStatus = (ticket) => {
                const days = getDaysUntilExpiration(ticket.expirationDate);
                if (ticket.remainingSessions <= 0) return 'completed';
                if (days < 0) return 'expired';
                if (days <= 30) return 'expiring';
                return 'active';
            };

            const getTicketStatusStyle = (status) => {
                switch (status) {
                    case 'active': return 'bg-green-100 text-green-700 border-green-200';
                    case 'expiring': return 'bg-amber-100 text-amber-700 border-amber-200';
                    case 'expired': return 'bg-red-100 text-red-700 border-red-200';
                    case 'completed': return 'bg-slate-100 text-slate-500 border-slate-200';
                    default: return 'bg-slate-100 text-slate-500';
                }
            };

            const getTicketStatusLabel = (status) => {
                switch (status) {
                    case 'active': return '有効';
                    case 'expiring': return '期限間近';
                    case 'expired': return '期限切れ';
                    case 'completed': return '消化済';
                    default: return status;
                }
            };

            // フィルタリング
            const filteredTickets = useMemo(() => {
                let list = customerTickets;
                if (filterStatus !== 'all') {
                    list = list.filter(t => getTicketStatus(t) === filterStatus);
                }
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    list = list.filter(t => t.customerName.toLowerCase().includes(q) || (t.customerPhone && t.customerPhone.includes(q)));
                }
                return list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            }, [customerTickets, filterStatus, searchQuery]);

            // プランが変わったら有効期限を自動計算
            const handlePlanChange = (planId) => {
                const plan = ticketPlans.find(p => p.id === planId);
                const purchase = newTicket.purchaseDate || new Date().toISOString().slice(0, 10);
                let expDate = '';
                if (plan) {
                    const d = new Date(purchase);
                    d.setDate(d.getDate() + plan.validityDays);
                    expDate = d.toISOString().slice(0, 10);
                }
                setNewTicket(prev => ({ ...prev, planId, expirationDate: expDate }));
            };

            // 回数券追加
            const handleAddTicket = () => {
                if (!newTicket.customerName.trim() || !newTicket.planId) return;
                addCustomerTicket(newTicket);
                setNewTicket({ customerName: '', customerPhone: '', planId: '', storeName: '', notes: '', purchaseDate: new Date().toISOString().slice(0, 10), expirationDate: '' });
                setShowAddForm(false);
            };

            // プラン追加/更新
            const handleSavePlan = () => {
                if (!planForm.name.trim() || !planForm.sessions || !planForm.price) return;
                const data = {
                    name: planForm.name.trim(),
                    sessions: parseInt(planForm.sessions),
                    price: parseInt(planForm.price),
                    validityDays: parseInt(planForm.validityDays) || 180,
                    active: true,
                };
                if (editingPlan) {
                    updatePlan(editingPlan.id, data);
                } else {
                    addPlan(data);
                }
                setPlanForm({ name: '', sessions: '', price: '', validityDays: '' });
                setShowPlanForm(false);
                setEditingPlan(null);
            };

            const handleSave = async () => {
                await saveToSheet();
                setShowSaved(true);
                setTimeout(() => setShowSaved(false), 3000);
            };

            // 残セッションの進捗パーセンテージ
            const getProgressPct = (ticket) => {
                if (ticket.totalSessions <= 0) return 0;
                return ((ticket.totalSessions - ticket.remainingSessions) / ticket.totalSessions) * 100;
            };

                <div className="space-y-5 md:space-y-6 animate-fade-in">

                        <button
                            onClick={handleSave}

                    {showSaved && (

                        <KpiCard title="残セッション" value={stats.totalRemaining} subValue="有効分の合計" icon="hash" gradientFrom="from-blue-400" gradientTo="to-blue-600" />
                        <KpiCard title="累計売上" value={formatCurrency(stats.totalRevenue)} subValue="回数券販売額" icon="wallet" gradientFrom="from-emerald-400" gradientTo="to-emerald-600" />
                    </div>

                    {/* タブ切り替え */}
                    <div className="flex gap-1 bg-slate-100/80 rounded-xl p-1">

                        </button>
                        <button onClick={() => setActiveTab('plans')} className={`flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all ${activeTab === 'plans' ? 'bg-white text-sise-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>

                        </button>
                    </div>

                    {/* ==================== 購入者一覧タブ ==================== */}
                    {activeTab === 'tickets' && (
                        <div className="space-y-4">

                                    className="flex items-center px-4 py-2.5 btn-gradient rounded-xl text-sm font-medium"

                                    <Icon name="plus" size={16} className="mr-1.5" />新規発行
                                </button>
                                <div className="relative flex-1 min-w-[140px]">
                                    <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />

                                        type="text"
                                        value={searchQuery}

            const [searchQuery, setSearchQuery] = useState('');
            const [showSaved, setShowSaved] = useState(false);

                let members = (memberData.members || []).filter(m => m.status === 'ACTIVE');

                    members = members.filter(m => m.name.toLowerCase().includes(q) || m.planName.toLowerCase().includes(q));

                return members;

                return activeMembers.reduce((sum, m) => sum + getUsage(m.id), 0);
            }, [activeMembers, getUsage]);

            const zeroUsageCount = activeMembers.filter(m => getUsage(m.id) === 0).length;

            const monthLabel = (() => {
                const [y, m] = currentMonth.split('-');
                return `${y}年${parseInt(m)}月`;
            })();

                            title="対象月"
                            value={monthLabel}
                            subValue="当月分の利用回数"
                            icon="calendar"
                            gradientFrom="from-blue-400" gradientTo="to-blue-600"
                        />
                        <KpiCard
                            title="合計利用回数"
                            value={totalUsage}
                            subValue={`${activeMembers.length}名のアクティブ会員`}
                            icon="bar-chart-3"
                            gradientFrom="from-sise-400" gradientTo="to-sise-600"
                        />
                        <KpiCard
                            title="平均利用回数"
                            value={avgUsage}
                            subValue="1人あたり"
                            icon="activity"
                            gradientFrom="from-violet-400" gradientTo="to-violet-600"
                        />
                        <KpiCard
                            title="未利用会員"
                            value={zeroUsageCount}
                            subValue={zeroUsageCount > 0 ? 'フォロー推奨' : '全員利用済み'}
                            icon="alert-circle"
                            gradientFrom={zeroUsageCount > 0 ? "from-amber-400" : "from-emerald-400"}
                            gradientTo={zeroUsageCount > 0 ? "to-amber-600" : "to-emerald-600"}
                        />

                    {/* 検索 */}
                    <div className="relative">
                        <Icon name="search" size={16} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                        <input
                            type="text"
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            placeholder="会員名で検索..."

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-4">
