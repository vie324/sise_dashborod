                            selectedStore={selectedStore}
                            setSelectedStore={setSelectedStore}
                        />;
                    case 'reports':
                        return <DailyReportListView reportData={reportData} />;
                    case 'members':
                        return <MemberManagementView memberData={memberData} refreshSquareData={refreshSquareData} operateSubscription={operateSubscription} activeStoreId={activeStoreId} manualMembersHook={manualMembersHook} />;
                    case 'cashbook':
                        return <CashbookView cashbookHook={cashbookHook} memberData={memberData} manualMembersHook={manualMembersHook} />;
                    case 'usage':
                        return <MemberUsageView memberData={memberData} usageHook={usageHook} />;
                    case 'tickets':
                        return <TicketManagementView ticketHook={ticketHook} />;
                    case 'marketing':
                        return <MarketingView marketingHook={marketingHook} />;
                    case 'settings':
                        return isStaffMode
                            ? <DashboardView memberData={memberData} reportData={reportData} selectedStore={selectedStore} setSelectedStore={setSelectedStore} />
                            : <SettingsView onSettingsSaved={() => { refreshReportData(); }} />;
                    default:
                        return <DashboardView
                            memberData={memberData}
                            reportData={reportData}
                            selectedStore={selectedStore}
                            setSelectedStore={setSelectedStore}
                        />;
                }
            };

            return (
                <div className="min-h-screen bg-slate-50 bg-mesh relative">
                    {/* 背景装飾オーブ */}
                    <div className="bg-orb bg-orb-1"></div>
                    <div className="bg-orb bg-orb-2"></div>
                    <div className="bg-orb bg-orb-3"></div>

                    {/* Header */}
                    <header className="fixed top-0 left-0 right-0 z-50 glass-panel safe-top">
                        <div className="flex items-center justify-between px-4 md:px-5 h-14 md:h-16">
                            <div className="flex items-center">
                                <button
                                    onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                                    className="lg:hidden p-2.5 rounded-xl hover:bg-sise-50 mr-1 transition-colors active:scale-90"
                                >
                                    <Icon name={isSidebarOpen ? "x" : "menu"} size={20} />
                                </button>
                                <div className="flex items-center">
                                    <div className="w-8 h-8 md:w-9 md:h-9 rounded-xl overflow-hidden shadow-lg shadow-sise-500/30 animate-glow-pulse flex-shrink-0">
                                        <img
                                            src="./images/logo.png"
                                            alt="si'se"
                                            className="w-full h-full object-contain"
                                            onError={(e) => {
                                                e.target.style.display = 'none';
                                                e.target.parentElement.classList.add('bg-gradient-to-br', 'from-sise-400', 'to-sise-600', 'flex', 'items-center', 'justify-center');
                                                e.target.parentElement.innerHTML = '<span class="text-white font-extrabold text-sm">S</span>';
                                            }}
                                        />
                                    </div>
                                    <div className="ml-2.5">
                                        <h1 className="text-sm md:text-base font-extrabold tracking-wide gradient-text">si'se</h1>
                                        <p className="text-[9px] text-sise-400 -mt-0.5 font-semibold tracking-[0.2em]">DASHBOARD</p>
                                    </div>
                                </div>
                            </div>
                            <div className="flex items-center gap-1">
                                {/* スタッフ表示 */}
                                {isStaffMode && (
                                    <div className="flex items-center px-2 md:px-3 py-1.5 bg-sise-50/80 border border-sise-200 rounded-xl hide-mobile">
                                        <Icon name={currentAccess.role === 'manager' ? 'shield' : 'user'} size={13} className="text-sise-500 mr-1" />
                                        <span className="text-xs font-semibold text-sise-700">{currentAccess.name}</span>
                                    </div>
                                )}
                                {/* 店舗セレクター */}
                                {(() => {
                                    const visibleStores = isStaffMode
                                        ? (memberData.stores || []).filter(s => currentAccess.storeIds.includes(s.id))
                                        : (memberData.stores || []);
                                    return visibleStores.length > 1 ? (
                                        <select
                                            value={activeStoreId}
                                            onChange={(e) => setActiveStoreId(e.target.value)}
                                            className="px-2 md:px-3 py-1.5 border border-sise-200 rounded-xl text-xs font-semibold focus:border-sise-400 focus:ring-2 focus:ring-sise-400/20 outline-none bg-sise-50/60 text-sise-700"
                                        >
                                            <option value="all">全店舗</option>
                                            {visibleStores.map(s => (
                                                <option key={s.id} value={s.id}>{s.name}</option>
                                            ))}
                                        </select>
                                    ) : null;
                                })()}
                                <button
                                    onClick={(e) => {
                                        const icon = e.currentTarget.querySelector('svg');
                                        if (icon) { icon.style.animation = 'spin 0.6s ease'; setTimeout(() => icon.style.animation = '', 600); }
                                        refreshReportData(); refreshSquareData();
                                    }}
                                    className="p-2.5 rounded-xl hover:bg-sise-50 text-slate-400 hover:text-sise-600 transition-all active:scale-90"
                                    title="データ更新"
                                >
                                    <Icon name="refresh-cw" size={18} />
                                </button>
                                <button
                                    onClick={() => setIsDarkMode(!isDarkMode)}
                                    className="p-2.5 rounded-xl hover:bg-sise-50 text-slate-400 hover:text-sise-600 transition-all active:scale-90 hide-mobile"
                                    title="ダークモード切り替え"
                                >
                                    <Icon name={isDarkMode ? 'sun' : 'moon'} size={18} />
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* プルトゥリフレッシュ インジケーター */}
                    <div className={`pull-indicator ${pullState.pulling ? 'visible' : ''} ${pullState.refreshing ? 'refreshing' : ''}`}
                        style={pullState.pulling ? {transform: `translateX(-50%) translateY(${Math.min(pullState.distance * 0.3, 18)}px)`, opacity: Math.min(pullState.distance / 60, 1)} : undefined}>
                        <div className={`w-9 h-9 rounded-full bg-white shadow-lg border border-sise-200 flex items-center justify-center ${pullState.refreshing ? 'animate-spin' : ''}`}>
                            <Icon name={pullState.refreshing ? 'loader' : 'arrow-down'} size={16} className="text-sise-500"
                                style={!pullState.refreshing ? {transform: `rotate(${Math.min(pullState.distance / 60 * 180, 180)}deg)`, transition: 'transform 0.1s'} : undefined} />
                        </div>
                    </div>

                    {/* Sidebar Overlay (Mobile) */}
                    {isSidebarOpen && (
                        <div
                            className="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 lg:hidden animate-fade-in"
                            onClick={() => setIsSidebarOpen(false)}
                        ></div>
                    )}

                    {/* Sidebar (Desktop) */}
                    <aside className={`fixed top-14 md:top-16 left-0 bottom-0 w-56 glass-panel z-40 transform transition-transform duration-300 ease-out lg:translate-x-0 ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <nav className="p-3 space-y-0.5 mt-2">
                            {navItems.map((item) => (
                                <button
                                    key={item.id}
                                    onClick={() => {
                                        setCurrentView(item.id);
                                        setIsSidebarOpen(false);
                                    }}
                                    className={`w-full flex items-center px-4 py-2.5 rounded-xl text-left text-sm font-semibold transition-all duration-200 ${
                                        currentView === item.id
                                            ? 'bg-gradient-to-r from-sise-500 to-sise-600 text-white shadow-lg shadow-sise-500/25 scale-[1.02]'
                                            : 'text-slate-500 hover:bg-sise-50 hover:text-sise-700 active:scale-[0.97]'
                                    }`}
                                >
                                    <Icon name={item.icon} size={18} className="mr-3" />
                                    {item.label}
                                </button>
                            ))}
                        </nav>

                        <div className="absolute bottom-0 left-0 right-0 p-4 border-t border-slate-200/30">
                            {isStaffMode && (
                                <div className="flex items-center mb-2 px-1">
                                    <div className={`w-7 h-7 rounded-lg flex items-center justify-center ${currentAccess.role === 'manager' ? 'bg-amber-50 text-amber-500' : 'bg-sise-50 text-sise-500'}`}>
                                        <Icon name={currentAccess.role === 'manager' ? 'shield' : 'user'} size={14} />
                                    </div>
                                    <div className="ml-2">
                                        <p className="text-xs font-semibold text-slate-700 leading-tight">{currentAccess.name}</p>
                                        <p className="text-[10px] text-slate-400">
                                            {currentAccess.role === 'manager' ? '店舗責任者' : 'スタッフ'}
                                        </p>
                                    </div>
                                </div>
                            )}
                            <p className="text-[10px] text-slate-400 tracking-wider font-medium">
                                LAST UPDATE: {reportData.lastUpdated
                                    ? reportData.lastUpdated.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })
                                    : '--:--'
                                }
                            </p>
                        </div>
                    </aside>

                    {/* Bottom Navigation (Mobile) */}
                    <nav className="bottom-nav hide-desktop">
                        <div
                            ref={(el) => {
                                if (el) {
                                    const active = el.querySelector('.bottom-nav-item.active');
                                    if (active) {
                                        const scrollLeft = active.offsetLeft - (el.offsetWidth / 2) + (active.offsetWidth / 2);
                                        el.scrollTo({ left: scrollLeft, behavior: 'smooth' });
                                    }
                                }
                            }}
                            className="flex overflow-x-auto"
                            style={{scrollbarWidth: 'none', msOverflowStyle: 'none', WebkitOverflowScrolling: 'touch', scrollSnapType: 'x proximity'}}
                        >
                            <style>{`.bottom-nav div::-webkit-scrollbar { display: none; }`}</style>
                            {navItems.map((item) => (
                                <button
                                    key={item.id}
                                    onClick={() => setCurrentView(item.id)}
                                    className={`bottom-nav-item ${currentView === item.id ? 'active' : ''}`}
                                >
                                    <span className="nav-icon-wrap transition-all duration-300">
                                        <Icon name={item.icon} size={20} />
                                    </span>
                                    <span className="mt-0.5 transition-all duration-200" style={{fontSize: '10px', fontWeight: currentView === item.id ? 700 : 500, letterSpacing: currentView === item.id ? '0.02em' : '0'}}>{item.mobileLabel}</span>
                                </button>
                            ))}
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="pt-14 md:pt-16 lg:pl-56 min-h-screen relative z-10">
                        <div className="px-3 py-2 md:p-5 lg:p-8 max-w-7xl mx-auto pb-24 md:pb-8">
                            <div key={currentView} className="view-transition">
                                {renderView()}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        // アプリケーションのレンダリング
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
