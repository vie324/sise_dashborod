        const SubscriptionLinkModal = ({ isOpen, onClose, activeStoreId, memberData }) => {
            const [plans, setPlans] = useState([]);
            const [selectedPlanId, setSelectedPlanId] = useState('');
            const [loading, setLoading] = useState(false);
            const [fetchingPlans, setFetchingPlans] = useState(false);
            const [generatedLink, setGeneratedLink] = useState(null);
            const [qrDataUrl, setQrDataUrl] = useState(null);
            const [error, setError] = useState(null);
            const [copied, setCopied] = useState(false);

            // プラン一覧を取得
            useEffect(() => {
                if (!isOpen) return;
                setGeneratedLink(null);
                setQrDataUrl(null);
                setError(null);
                setSelectedPlanId('');

                const fetchPlans = async () => {
                    setFetchingPlans(true);
                    try {
                        const headers = { 'Content-Type': 'application/json' };
                        if (activeStoreId && activeStoreId !== 'all') headers['X-Store-Id'] = activeStoreId;
                        const res = await fetch(`${SQUARE_PROXY_BASE}/catalog/list`, {
                            method: 'POST',
                            headers,
                            body: JSON.stringify({ types: ['SUBSCRIPTION_PLAN'] })
                        });
                        if (!res.ok) throw new Error('プラン取得に失敗しました');
                        const data = await res.json();
                        const objects = data.objects || [];

                        // プランとバリエーションを抽出
                        const planList = [];
                        objects.forEach(obj => {
                            if (obj.type === 'SUBSCRIPTION_PLAN' && obj.subscription_plan_data) {
                                const planData = obj.subscription_plan_data;
                                // バリエーションを取得
                                const variations = planData.subscription_plan_variations || [];
                                if (variations.length > 0) {
                                    variations.forEach(v => {
                                        const varData = v.subscription_plan_variation_data;
                                        const phases = varData?.phases || [];
                                        let price = 0;
                                        let cadence = 'MONTHLY';
                                        if (phases.length > 0) {
                                            const paidPhase = phases.find(p => p.pricing?.price_money?.amount > 0) || phases[0];
                                            price = paidPhase.pricing?.price_money?.amount || paidPhase.recurring_price_money?.amount || 0;
                                            cadence = paidPhase.cadence || 'MONTHLY';
                                        }
                                        planList.push({
                                            id: v.id,
                                            name: `${planData.name} - ${varData?.name || 'デフォルト'}`,
                                            price,
                                            cadence,
                                        });
                                    });
                                } else {
                                    // バリエーションが直接ない場合（別オブジェクトとして返る場合）
                                    planList.push({
                                        id: obj.id,
                                        name: planData.name,
                                        price: 0,
                                        cadence: 'MONTHLY',
                                    });
                                }
                            }
                            // SUBSCRIPTION_PLAN_VARIATIONが直接返る場合
                            if (obj.type === 'SUBSCRIPTION_PLAN_VARIATION' && obj.subscription_plan_variation_data) {
                                const varData = obj.subscription_plan_variation_data;
                                const phases = varData.phases || [];
                                let price = 0;
                                let cadence = 'MONTHLY';
                                if (phases.length > 0) {
                                    const paidPhase = phases.find(p => p.pricing?.price_money?.amount > 0) || phases[0];
                                    price = paidPhase.pricing?.price_money?.amount || paidPhase.recurring_price_money?.amount || 0;
                                    cadence = paidPhase.cadence || 'MONTHLY';
                                }
                                planList.push({
                                    id: obj.id,
                                    name: varData.name || obj.id,
                                    price,
                                    cadence,
                                });
                            }
                        });

                        // batch-retrieveでバリエーション取得（catalog/listで取れない場合のフォールバック）
                        if (planList.length === 0 && objects.length > 0) {
                            objects.forEach(obj => {
                                if (obj.subscription_plan_data) {
                                    planList.push({
                                        id: obj.id,
                                        name: obj.subscription_plan_data.name || obj.id,
                                        price: 0,
                                        cadence: 'MONTHLY',
                                    });
                                }
                            });
                        }

                        // memberDataからプランバリエーションIDを使ってフォールバック
                        if (planList.length === 0 && memberData && memberData.members) {
                            const planMap = new Map();
                            memberData.members.forEach(m => {
                                if (m.planVariationId && !planMap.has(m.planVariationId)) {
                                    planMap.set(m.planVariationId, {
                                        id: m.planVariationId,
                                        name: m.planName || 'プラン',
                                        price: m.monthlyPrice || 0,
                                        cadence: m.cadence || 'MONTHLY',
                                    });
                                }
                            });
                            planList.push(...planMap.values());
                        }

                        setPlans(planList);
                        if (planList.length > 0) setSelectedPlanId(planList[0].id);
                    } catch (e) {
                        setError(e.message);
                    } finally {
                        setFetchingPlans(false);
                    }
                };
                fetchPlans();
            }, [isOpen, activeStoreId]);

            // 契約リンク生成
            const generateLink = async () => {
                if (!selectedPlanId) return;
                setLoading(true);
                setError(null);
                setGeneratedLink(null);
                setQrDataUrl(null);

                try {
                    const headers = { 'Content-Type': 'application/json' };
                    if (activeStoreId && activeStoreId !== 'all') headers['X-Store-Id'] = activeStoreId;

                    const res = await fetch(`${SQUARE_PROXY_BASE}/online-checkout/payment-links`, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify({
                            idempotency_key: crypto.randomUUID(),
                            subscription_plan_id: selectedPlanId,
                        })
                    });

                    if (!res.ok) {
                        const errData = await res.json().catch(() => ({}));
                        const detail = errData.errors
                            ? errData.errors.map(e => e.detail || e.code).join(', ')
                            : JSON.stringify(errData);
                        throw new Error(detail);
                    }

                    const data = await res.json();
                    const link = data.payment_link;
                    if (!link || !link.url) throw new Error('リンクの生成に失敗しました');

                    setGeneratedLink({
                        url: link.url,
                        longUrl: link.long_url || link.url,
                        id: link.id,
                        createdAt: link.created_at,
                    });

                    // QRコード生成
                    if (window.QRCode) {
                        const qrUrl = await window.QRCode.toDataURL(link.url, {
                            width: 280,
                            margin: 2,
                            color: { dark: '#1a5136', light: '#ffffff' },
                            errorCorrectionLevel: 'M',
                        });
                        setQrDataUrl(qrUrl);
                    }
                } catch (e) {
                    setError(e.message);
                } finally {
                    setLoading(false);
                }
            };

            // URLコピー
            const copyUrl = async () => {
                if (!generatedLink) return;
                try {
                    await navigator.clipboard.writeText(generatedLink.url);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch (e) {
                    // フォールバック
                    const ta = document.createElement('textarea');
                    ta.value = generatedLink.url;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                }
            };

            // 頻度ラベル
            const cadenceLabel = (c) => {
                const map = { DAILY: '日次', WEEKLY: '週次', MONTHLY: '月額', QUARTERLY: '四半期', ANNUAL: '年額' };
                return map[c] || c || '月額';
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in" onClick={onClose}>
                    <div className="bg-white/95 backdrop-blur-xl rounded-2xl shadow-2xl max-w-lg w-full p-5 md:p-6 max-h-[90vh] overflow-y-auto animate-scale-in border border-slate-200/50" onClick={(e) => e.stopPropagation()}>
                        {/* ヘッダー */}
                        <div className="flex items-center justify-between mb-5">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-br from-sise-400 to-sise-600 rounded-xl flex items-center justify-center">
                                    <Icon name="link" size={20} className="text-white" />
                                </div>
                                <div>
                                    <h3 className="text-lg font-bold text-slate-900">サブスク契約リンク生成</h3>
                                    <p className="text-xs text-slate-400">契約用URL・QRコードを発行</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                                <Icon name="x" size={20} />
                            </button>
                        </div>

                        {/* プラン選択 */}
                        {fetchingPlans ? (
                            <div className="flex items-center justify-center py-8">
                                <Icon name="loader" size={24} className="animate-spin text-sise-500 mr-2" />
                                <span className="text-sm text-slate-500">プランを読み込み中...</span>
                            </div>
                        ) : plans.length === 0 ? (
                            <div className="text-center py-8">
                                <div className="w-14 h-14 bg-slate-100 rounded-2xl flex items-center justify-center mx-auto mb-3">
                                    <Icon name="alert-circle" size={24} className="text-slate-400" />
                                </div>
                                <p className="text-sm font-medium text-slate-600 mb-1">サブスクリプションプランが見つかりません</p>
                                <p className="text-xs text-slate-400">Squareダッシュボードでプランを作成してください</p>
                            </div>
                        ) : (
                            <>
                                {!generatedLink && (
                                    <div className="mb-5">
                                        <label className="block text-sm font-semibold text-slate-700 mb-2">プランを選択</label>
                                        <div className="space-y-2">
                                            {plans.map(plan => (
                                                <label
                                                    key={plan.id}
                                                    className={`flex items-center justify-between p-3 rounded-xl border-2 cursor-pointer transition-all ${
                                                        selectedPlanId === plan.id
                                                            ? 'border-sise-400 bg-sise-50/50'
                                                            : 'border-slate-200 hover:border-slate-300 bg-white'
                                                    }`}
                                                >
                                                    <div className="flex items-center gap-3">
                                                        <input
                                                            type="radio"
                                                            name="plan"
                                                            value={plan.id}
                                                            checked={selectedPlanId === plan.id}
                                                            onChange={() => setSelectedPlanId(plan.id)}
                                                            className="accent-sise-500"
                                                        />
                                                        <div>
                                                            <p className="font-medium text-slate-800 text-sm">{plan.name}</p>
                                                            <p className="text-xs text-slate-400">{cadenceLabel(plan.cadence)}</p>
                                                        </div>
                                                    </div>
                                                    {plan.price > 0 && (
                                                        <span className="font-bold text-sise-700 text-sm">
                                                            {Number(plan.price).toLocaleString()}円
                                                        </span>
                                                    )}
                                                </label>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* エラー表示 */}
                                {error && (
                                    <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-sm text-red-700">
                                        <Icon name="alert-circle" size={14} className="inline mr-1" />
                                        {error}
                                    </div>
                                )}

                                {/* 生成ボタン */}
                                {!generatedLink && (
                                    <button
                                        onClick={generateLink}
                                        disabled={loading || !selectedPlanId}
                                        className="w-full flex items-center justify-center gap-2 px-4 py-3 btn-gradient rounded-xl font-semibold text-sm transition-all disabled:opacity-50"
                                    >
                                        {loading ? (
                                            <>
                                                <Icon name="loader" size={16} className="animate-spin" />
                                                生成中...
                                            </>
                                        ) : (
                                            <>
                                                <Icon name="sparkles" size={16} />
                                                契約リンクを生成
                                            </>
                                        )}
                                    </button>
                                )}

                                {/* 生成結果 */}
                                {generatedLink && (
                                    <div className="space-y-4 animate-fade-in">
                                        {/* QRコード */}
                                        {qrDataUrl && (
                                            <div className="flex flex-col items-center py-4">
                                                <img src={qrDataUrl} alt="QR Code" className="w-56 h-56 rounded-xl shadow-lg border border-slate-100" />
                                                <p className="text-xs text-slate-400 mt-2">お客様にこのQRコードを読み取ってもらってください</p>
                                            </div>
                                        )}

                                        {/* URL表示 */}
                                        <div className="bg-slate-50 rounded-xl p-3 border border-slate-200">
                                            <label className="block text-xs font-semibold text-slate-500 mb-1.5">契約URL</label>
                                            <div className="flex items-center gap-2">
                                                <input
                                                    type="text"
                                                    readOnly
                                                    value={generatedLink.url}
                                                    className="flex-1 bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-700 select-all outline-none"
                                                    onClick={(e) => e.target.select()}
                                                />
                                                <button
                                                    onClick={copyUrl}
                                                    className={`flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium transition-all ${
                                                        copied
                                                            ? 'bg-green-100 text-green-700 border border-green-200'
                                                            : 'bg-sise-50 text-sise-700 border border-sise-200 hover:bg-sise-100'
                                                    }`}
                                                >
                                                    <Icon name={copied ? "check" : "copy"} size={14} />
                                                    {copied ? 'コピー済' : 'コピー'}
                                                </button>
                                            </div>
                                        </div>

                                        {/* アクションボタン */}
                                        <div className="flex gap-2">
                                            <button
                                                onClick={() => { setGeneratedLink(null); setQrDataUrl(null); setError(null); }}
                                                className="flex-1 flex items-center justify-center gap-1.5 px-3 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-medium transition-colors"
                                            >
                                                <Icon name="refresh-cw" size={14} />
                                                別のリンクを生成
                                            </button>
                                            {qrDataUrl && (
                                                <a
                                                    href={qrDataUrl}
                                                    download="subscription-qr.png"
                                                    className="flex-1 flex items-center justify-center gap-1.5 px-3 py-2.5 bg-sise-50 hover:bg-sise-100 text-sise-700 border border-sise-200 rounded-xl text-sm font-medium transition-colors"
                                                >
                                                    <Icon name="download" size={14} />
                                                    QR画像を保存
                                                </a>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                </div>
            );
        };

        const MemberManagementView = ({ memberData, refreshSquareData, operateSubscription, activeStoreId, manualMembersHook }) => {
            const [isRefreshing, setIsRefreshing] = useState(false);
            const [filterStatus, setFilterStatus] = useState('all'); // all, ACTIVE, CANCELED, PENDING
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedMember, setSelectedMember] = useState(null);
            const [actionLoading, setActionLoading] = useState(null); // 'cancel'|'pause'|'resume'
            const [actionMessage, setActionMessage] = useState(null); // { type, text }
            const [showSubscriptionLink, setShowSubscriptionLink] = useState(false);

            const handleRefresh = async () => {
                setIsRefreshing(true);
                await refreshSquareData();
                setIsRefreshing(false);
            };

            const handleAction = async (member, action) => {
                const labels = { cancel: '解約', pause: '一時停止', resume: '再開' };
                if (!confirm(`${member.name} のサブスクリプションを${labels[action]}しますか？`)) return;

                setActionLoading(action);
                setActionMessage(null);
                try {
                    await operateSubscription(member.id, action, member.storeId);
                    setActionMessage({ type: 'success', text: `${labels[action]}が完了しました` });
                    // データ更新
                    await refreshSquareData();
                    setSelectedMember(null);
                } catch (e) {
                    setActionMessage({ type: 'error', text: `${labels[action]}に失敗: ${e.message}` });
                } finally {
                    setActionLoading(null);
                }
            };

            // 月額単価（設定可能にする）
            const monthlyPrice = 10000;

            // LTV計算（平均継続月数を仮定）
            const avgRetentionMonths = memberData.churnRate > 0 ? Math.round(100 / memberData.churnRate) : 24;
            const estimatedLTV = monthlyPrice * avgRetentionMonths;

            // 会員フィルタリング
            const filteredMembers = useMemo(() => {
                let filtered = memberData.members || [];

                // ステータスフィルタ
                if (filterStatus !== 'all') {
                    filtered = filtered.filter(m => m.status === filterStatus);
                }

                // 検索クエリ
                if (searchQuery) {
                    const query = searchQuery.toLowerCase();
                    filtered = filtered.filter(m =>
                        m.name.toLowerCase().includes(query) ||
                        m.email.toLowerCase().includes(query) ||
                        m.phone.includes(query)
                    );
                }

                return filtered;
            }, [memberData.members, filterStatus, searchQuery]);

            // ステータスバッジの色
            const getStatusColor = (status) => {
                switch (status) {
                    case 'ACTIVE': return 'bg-green-100 text-green-700 border-green-200';
                    case 'CANCELED': return 'bg-red-100 text-red-700 border-red-200';
                    case 'PENDING': return 'bg-yellow-100 text-yellow-700 border-yellow-200';
                    case 'PAUSED': return 'bg-slate-100 text-slate-700 border-slate-200';
                    default: return 'bg-slate-100 text-slate-700 border-slate-200';
                }
            };

            // ステータスラベル
            const getStatusLabel = (status) => {
                switch (status) {
                    case 'ACTIVE': return 'アクティブ';
                    case 'CANCELED': return '退会';
                    case 'PENDING': return '保留中';
                    case 'PAUSED': return '一時停止';
                    default: return status;
                }
            };

            // 頻度ラベル
            const getCadenceLabel = (cadence) => {
                switch (cadence) {
                    case 'DAILY': return '日次';
                    case 'WEEKLY': return '週次';
                    case 'EVERY_TWO_WEEKS': return '隔週';
                    case 'MONTHLY': return '月額';
                    case 'EVERY_TWO_MONTHS': return '隔月';
                    case 'QUARTERLY': return '四半期';
                    case 'EVERY_FOUR_MONTHS': return '4ヶ月毎';
                    case 'EVERY_SIX_MONTHS': return '半年';
                    case 'ANNUAL': return '年額';
                    case 'EVERY_TWO_YEARS': return '2年毎';
                    default: return cadence || '月額';
                }
            };

            return (
                <div className="space-y-5 md:space-y-6 animate-fade-in">
                    <SectionHeader title="会員管理" subtitle="MEMBER MANAGEMENT" icon="users">
                        <div className="flex items-center gap-2">
                            {(!currentAccess || currentAccess.role === 'manager') && (
                                <button
                                    onClick={() => setShowSubscriptionLink(true)}
                                    className="flex items-center px-4 py-2.5 bg-gradient-to-r from-sise-500 to-sise-600 hover:from-sise-600 hover:to-sise-700 text-white rounded-xl font-medium text-sm transition-all shadow-md hover:shadow-lg"
                                >
                                    <Icon name="qr-code" size={16} className="mr-2" />
                                    契約リンク発行
                                </button>
                            )}
                            <button
                                onClick={handleRefresh}
                                disabled={isRefreshing}
                                className="flex items-center px-4 py-2.5 btn-gradient rounded-xl font-medium text-sm transition-all disabled:opacity-50"
                            >
                                <Icon name={isRefreshing ? "loader" : "refresh-cw"} size={16} className={`mr-2 ${isRefreshing ? 'animate-spin' : ''}`} />
                                {isRefreshing ? '更新中...' : 'データ更新'}
                            </button>
                        </div>
                    </SectionHeader>

                    {/* サブスク契約リンク生成モーダル */}
                    <SubscriptionLinkModal
                        isOpen={showSubscriptionLink}
                        onClose={() => setShowSubscriptionLink(false)}
                        activeStoreId={activeStoreId}
                        memberData={memberData}
                    />

                    {memberData.error && (
                        <div className="bg-red-50/80 backdrop-blur-sm border border-red-200 rounded-xl p-4">
                            <p className="text-red-700 text-sm">
                                <Icon name="alert-circle" size={16} className="inline mr-2" />
                                エラー: {memberData.error}
                            </p>
                        </div>
                    )}

                    {/* 会員サマリ */}
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-2.5 md:gap-4">
                        <KpiCard
                            title="アクティブ会員"
                            value={memberData.activeMembers}
                            subValue={`累計: ${memberData.totalMembers}人`}
                            icon="users"
                            gradientFrom="from-sise-400" gradientTo="to-sise-600"
                            loading={memberData.loading}
                        />
                        <KpiCard
                            title="月間想定売上"
                            value={formatCurrency(memberData.expectedRevenue)}
                            subValue={`@${formatCurrency(monthlyPrice)}/月`}
                            icon="trending-up"
                            gradientFrom="from-emerald-400" gradientTo="to-emerald-600"
                            loading={memberData.loading}
                        />
                        <KpiCard
                            title="今月の新規入会"
                            value={memberData.newMembersThisMonth}
                            subValue="新規獲得"
                            icon="user-plus"
                            gradientFrom="from-teal-400" gradientTo="to-teal-600"
                            loading={memberData.loading}
                        />
                        <KpiCard
                            title="退会率"
                            value={formatPercent(memberData.churnRate)}
                            subValue={`退会者: ${memberData.churnedMembers}人`}
                            icon="user-minus"
                            gradientFrom={memberData.churnRate > 5 ? "from-red-400" : "from-slate-400"}
                            gradientTo={memberData.churnRate > 5 ? "to-red-600" : "to-slate-500"}
                            loading={memberData.loading}
                        />
                    </div>

                    {/* 分析カード */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <Card>
                            <h3 className="text-base font-bold text-slate-800 mb-1">収益分析</h3>
                        <p className="text-xs text-slate-400 mb-3 tracking-wide">REVENUE ANALYSIS</p>
                            <div className="space-y-4">
                                <div className="flex justify-between items-center p-3 bg-slate-50 rounded-lg">
                                    <span className="text-slate-600">月額単価</span>
                                    <span className="font-bold text-slate-900">{formatCurrency(monthlyPrice)}</span>
                                </div>
                                <div className="flex justify-between items-center p-3 bg-slate-50 rounded-lg">
                                    <span className="text-slate-600">年間想定売上</span>
                                    <span className="font-bold text-green-600">{formatCurrency(memberData.expectedRevenue * 12)}</span>
                                </div>
                                <div className="flex justify-between items-center p-3 bg-slate-50 rounded-lg">
                                    <span className="text-slate-600">平均継続期間</span>
                                    <span className="font-bold text-slate-900">約{avgRetentionMonths}ヶ月</span>
                                </div>
                                <div className="flex justify-between items-center p-3 bg-sise-50 rounded-lg border border-sise-200">
                                    <span className="text-sise-700 font-medium">推定LTV</span>
                                    <span className="font-bold text-sise-900">{formatCurrency(estimatedLTV)}</span>
                                </div>
                            </div>
                        </Card>

                        <Card>
                            <h3 className="text-base font-bold text-slate-800 mb-1">KPIトレンド</h3>
                        <p className="text-xs text-slate-400 mb-3 tracking-wide">KEY METRICS</p>
                            <div className="space-y-4">
                                <div>
                                    <div className="flex justify-between text-sm mb-1">
                                        <span className="text-slate-600">会員維持率</span>
                                        <span className="font-semibold text-green-600">{formatPercent(100 - memberData.churnRate)}</span>
                                    </div>
                                    <div className="w-full bg-slate-200 rounded-full h-2">
                                        <div
                                            className="bg-gradient-to-r from-sise-400 to-sise-500 h-2 rounded-full transition-all"
                                            style={{ width: `${100 - memberData.churnRate}%` }}
                                        ></div>
                                    </div>
                                </div>
                                <div>
                                    <div className="flex justify-between text-sm mb-1">
                                        <span className="text-slate-600">目標会員数達成率</span>
                                        <span className="font-semibold text-sise-600">{formatPercent(memberData.activeMembers / 200 * 100)}</span>
                                    </div>
                                    <div className="w-full bg-slate-200 rounded-full h-2">
                                        <div
                                            className="bg-gradient-to-r from-sise-300 to-sise-500 h-2 rounded-full transition-all"
                                            style={{ width: `${Math.min(memberData.activeMembers / 200 * 100, 100)}%` }}
                                        ></div>
                                    </div>
                                    <p className="text-xs text-slate-500 mt-1">目標: 200人</p>
                                </div>
                            </div>
                        </Card>
                    </div>

                    {/* 月間入退会トレンドチャート */}
                    <Card className="stagger-5 animate-fade-in-up">
                        <h3 className="text-base font-bold text-slate-800 mb-1">月間入退会トレンド</h3>
                        <p className="text-xs text-slate-400 mb-4 tracking-wide">MONTHLY ENROLLMENT TREND</p>
                        {window.Recharts && (
                            <ResponsiveContainer width="100%" height={350}>
                                <ComposedChart data={memberData.monthlyTrend || []}>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                                    <XAxis dataKey="month" tick={{ fontSize: 11 }} />
                                    <YAxis yAxisId="left" tick={{ fontSize: 12 }} label={{ value: '人数', angle: -90, position: 'insideLeft', style: { fontSize: 11 } }} />
                                    <YAxis yAxisId="right" orientation="right" tick={{ fontSize: 12 }} label={{ value: '累積会員', angle: 90, position: 'insideRight', style: { fontSize: 11 } }} />
                                    <Tooltip
                                        contentStyle={{ backgroundColor: '#fff', borderColor: '#e2e8f0', borderRadius: '8px' }}

                return Math.ceil((exp - now) / (1000 * 60 * 60 * 24));
            };

                const days = getDaysUntilExpiration(ticket.expirationDate);

                if (days <= 30) return 'expiring';
                return 'active';

                switch (status) {
                    case 'active': return '有効';
                    case 'expiring': return '期限間近';
                    case 'expired': return '期限切れ';
                    case 'completed': return '消化済';

            // フィルタリング
            const filteredTickets = useMemo(() => {
                let list = customerTickets;
                if (filterStatus !== 'all') {
                    list = list.filter(t => getTicketStatus(t) === filterStatus);
                }
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    list = list.filter(t => t.customerName.toLowerCase().includes(q) || (t.customerPhone && t.customerPhone.includes(q)));
                }
                return list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            // プランが変わったら有効期限を自動計算
            const handlePlanChange = (planId) => {
                const plan = ticketPlans.find(p => p.id === planId);
                const purchase = newTicket.purchaseDate || new Date().toISOString().slice(0, 10);
                let expDate = '';
                if (plan) {
                    const d = new Date(purchase);
                    d.setDate(d.getDate() + plan.validityDays);
                    expDate = d.toISOString().slice(0, 10);
                }
                setNewTicket(prev => ({ ...prev, planId, expirationDate: expDate }));
            };

            // 回数券追加
            const handleAddTicket = () => {
                if (!newTicket.customerName.trim() || !newTicket.planId) return;
                addCustomerTicket(newTicket);
                setNewTicket({ customerName: '', customerPhone: '', planId: '', storeName: '', notes: '', purchaseDate: new Date().toISOString().slice(0, 10), expirationDate: '' });
                setShowAddForm(false);
            };

            // プラン追加/更新
            const handleSavePlan = () => {
                if (!planForm.name.trim() || !planForm.sessions || !planForm.price) return;
                const data = {
                    name: planForm.name.trim(),
                    sessions: parseInt(planForm.sessions),
                    price: parseInt(planForm.price),
                    validityDays: parseInt(planForm.validityDays) || 180,
                    active: true,
                };
                if (editingPlan) {
                    updatePlan(editingPlan.id, data);
                } else {
                    addPlan(data);
                }
                setPlanForm({ name: '', sessions: '', price: '', validityDays: '' });
                setShowPlanForm(false);
                setEditingPlan(null);
            };

            const handleSave = async () => {
                await saveToSheet();
                setShowSaved(true);
                setTimeout(() => setShowSaved(false), 3000);
            };

            // 残セッションの進捗パーセンテージ
            const getProgressPct = (ticket) => {
                if (ticket.totalSessions <= 0) return 0;
                return ((ticket.totalSessions - ticket.remainingSessions) / ticket.totalSessions) * 100;
            };

            return (
                <div className="space-y-5 md:space-y-6 animate-fade-in">
                    <SectionHeader title="回数券管理" subtitle="TICKET MANAGEMENT" icon="ticket">
                        <button
                            onClick={handleSave}

                            className="flex items-center px-4 py-2.5 btn-gradient rounded-xl font-medium text-sm transition-all disabled:opacity-50"

                    {showSaved && (

                        <KpiCard title="残セッション" value={stats.totalRemaining} subValue="有効分の合計" icon="hash" gradientFrom="from-blue-400" gradientTo="to-blue-600" />
                        <KpiCard title="累計売上" value={formatCurrency(stats.totalRevenue)} subValue="回数券販売額" icon="wallet" gradientFrom="from-emerald-400" gradientTo="to-emerald-600" />

                    <div className="flex gap-1 bg-slate-100 dark:bg-slate-800/60 rounded-2xl p-1.5">
                        <button onClick={() => setActiveTab('tickets')} className={`flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-xl text-sm font-semibold transition-all duration-200 ${activeTab === 'tickets' ? 'bg-white dark:bg-sise-900/60 text-sise-700 dark:text-sise-400 shadow-md shadow-sise-500/10' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 hover:bg-white/50 active:scale-95'}`}>
                            <Icon name="users" size={15} />
                            購入者一覧
                        </button>
                        <button onClick={() => setActiveTab('plans')} className={`flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-xl text-sm font-semibold transition-all duration-200 ${activeTab === 'plans' ? 'bg-white dark:bg-sise-900/60 text-sise-700 dark:text-sise-400 shadow-md shadow-sise-500/10' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 hover:bg-white/50 active:scale-95'}`}>
                            <Icon name="package" size={15} />

                        </button>
                    </div>

                    {/* ==================== 購入者一覧タブ ==================== */}
                    {activeTab === 'tickets' && (
                        <div className="space-y-4">

                            <div className="flex flex-wrap items-center gap-2">
                                <button
                                    onClick={() => setShowAddForm(true)}

                                        type="text"

                                        onChange={(e) => setSearchQuery(e.target.value)}

                                    </div>
                                </Card>

                            {/* 回数券カード一覧 */}

                                    return (
                                        <Card key={ticket.id} className={`!p-4 relative overflow-hidden hover:!transform-none ${status === 'expired' ? 'opacity-70' : ''}`}>
                                            {/* トップバー: ステータス */}
                                            <div className="absolute top-0 left-0 right-0 h-1" style={{ background: status === 'active' ? '#22c55e' : status === 'expiring' ? '#f59e0b' : status === 'expired' ? '#ef4444' : '#94a3b8' }}></div>

                                            <div className="flex items-start justify-between mt-1 mb-3">
                                                <div className="flex items-center flex-1 min-w-0">
                                                    <Avatar name={ticket.customerName} size={38} />
                                                    <div className="ml-2.5 flex-1 min-w-0">
                                                        <p className="font-bold text-slate-800 text-sm truncate">{ticket.customerName}</p>
                                                        <p className="text-xs text-slate-400 truncate">{ticket.planName}{ticket.storeName ? ` / ${ticket.storeName}` : ''}</p>
                                                    </div>
                                                </div>
                                                <span className={`text-[11px] font-semibold px-2.5 py-1 rounded-lg border flex-shrink-0 ${getTicketStatusStyle(status)}`}>
                                                    {getTicketStatusLabel(status)}
                                                </span>
                                            </div>

                                            {/* 残回数 */}
                                            <div className="bg-slate-50/80 rounded-xl p-3 mb-3">
                                                <div className="flex items-center justify-between mb-2">
                                                    <span className="text-xs text-slate-500 font-medium">残り回数</span>
                                                    <span className="text-lg font-extrabold text-slate-800">
                                                        <span className={status === 'active' ? 'text-sise-600' : status === 'expiring' ? 'text-amber-600' : 'text-slate-500'}>{ticket.remainingSessions}</span>
                                                        <span className="text-slate-400 text-sm font-medium"> / {ticket.totalSessions}</span>
                                                    </span>
                                                </div>
                                                <div className="w-full bg-slate-200 rounded-full h-2">
                                                    <div
                                                        className="h-2 rounded-full transition-all duration-500"
                                                        style={{ width: `${pct}%`, background: pct >= 100 ? '#94a3b8' : pct >= 70 ? '#f59e0b' : '#33a065' }}
                                                    ></div>
                                                </div>
                                            </div>

                                            {/* 情報 */}
                                            <div className="grid grid-cols-2 gap-2 text-xs mb-3">
                                                <div>
                                                    <span className="text-slate-400">購入日</span>
                                                    <p className="font-semibold text-slate-700">{ticket.purchaseDate}</p>
                                                </div>
                                                <div>
                                                    <span className="text-slate-400">有効期限</span>
                                                    <p className={`font-semibold ${days <= 30 && days >= 0 ? 'text-amber-600' : days < 0 ? 'text-red-500' : 'text-slate-700'}`}>
                                                        {ticket.expirationDate}

                                                        {days < 0 && <span className="ml-1">(期限切)</span>}
                                                    </p>
                                                </div>
                                                <div>
                                                    <span className="text-slate-400">金額</span>
                                                    <p className="font-semibold text-slate-700">{formatCurrency(ticket.price)}</p>
                                                </div>
                                                {ticket.customerPhone && (
                                                    <div>
                                                        <span className="text-slate-400">電話</span>
                                                        <p className="font-semibold text-slate-700">{ticket.customerPhone}</p>
                                                    </div>
                                                )}
                                            </div>
                                            {ticket.notes && (
                                                <p className="text-xs text-slate-400 bg-slate-50 rounded-lg px-2.5 py-1.5 mb-3">{ticket.notes}</p>
                                            )}

                                            {/* アクションボタン */}
                                            <div className="flex items-center gap-2">
                                                {status === 'active' || status === 'expiring' ? (
                                                    <>
                                                        <button
                                                            onClick={() => useSession(ticket.id)}
                                                            disabled={ticket.remainingSessions <= 0}
                                                            className="flex-1 flex items-center justify-center py-2.5 bg-sise-500 hover:bg-sise-600 text-white rounded-xl text-xs font-semibold transition-all disabled:opacity-40 active:scale-95"
                                                        >
                                                            <Icon name="minus-circle" size={14} className="mr-1" />1回消化
                                                        </button>
                                                        <button
                                                            onClick={() => undoSession(ticket.id)}
                                                            disabled={ticket.remainingSessions >= ticket.totalSessions}

                                                        >
                                                            <Icon name="undo-2" size={14} />
                                                        </button>
                                                    </>
                                                ) : (
                                                    <span className="flex-1 text-center text-xs text-slate-400 py-2">
                                                        {status === 'completed' ? '全回消化済み' : '有効期限切れ'}

                                                <button
                                                    onClick={() => { if (confirm(`${ticket.customerName}の回数券を削除しますか？`)) deleteCustomerTicket(ticket.id); }}

                                                >
                                                    <Icon name="trash-2" size={14} />
                                                </button>

                            </div>

                            {filteredTickets.length === 0 && (

                                        <Icon name="ticket" size={28} className="text-slate-300" />
                                    </div>
                                    <p className="font-medium">回数券データがありません</p>

                        <div className="space-y-4">

                                <button
                                    onClick={() => { setShowPlanForm(true); setEditingPlan(null); setPlanForm({ name: '', sessions: '', price: '', validityDays: '' }); }}

                                <Card className="!bg-sise-50/40 border-sise-200 animate-scale-in">
