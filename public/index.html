                const nextDay = getBillingDayForMonth(regDay, nextYear, nextM);
                nextRenewal = new Date(nextYear, nextM, nextDay);
                periodEnd = new Date(nextRenewal);
                periodEnd.setDate(periodEnd.getDate() - 1);
            } else {
                // 今月の更新日はまだ → 前月更新日〜今月更新日前日
                nextRenewal = thisMonthBillingDate;
                periodEnd = new Date(thisMonthBillingDate);
                periodEnd.setDate(periodEnd.getDate() - 1);
                const prevMonth = today.getMonth() - 1;
                const prevYear = prevMonth < 0 ? today.getFullYear() - 1 : today.getFullYear();
                const prevM = prevMonth < 0 ? 11 : prevMonth;
                const prevDay = getBillingDayForMonth(regDay, prevYear, prevM);
                periodStart = new Date(prevYear, prevM, prevDay);
            }

            // 期間のユニークキー（YYYY-MM-DD形式）
            const periodKey = periodStart.toISOString().slice(0, 10);
            // 次回更新までの残日数
            const daysUntilRenewal = Math.ceil((nextRenewal - today) / (1000 * 60 * 60 * 24));
            // 期間の合計日数
            const totalDaysInPeriod = Math.ceil((nextRenewal - periodStart) / (1000 * 60 * 60 * 24));
            // 経過日数
            const daysElapsed = Math.ceil((today - periodStart) / (1000 * 60 * 60 * 24));

            return {
                regDay,
                periodStart,
                periodEnd,
                nextRenewal,
                periodKey,
                daysUntilRenewal,
                totalDaysInPeriod,
                daysElapsed,
                progressPct: totalDaysInPeriod > 0 ? Math.min(100, (daysElapsed / totalDaysInPeriod) * 100) : 0,
            };
        };

        // 日付フォーマットヘルパー
        const formatDateShort = (date) => {
            if (!date) return '-';
            const d = date instanceof Date ? date : new Date(date);
            return `${d.getMonth() + 1}/${d.getDate()}`;
        };

        const MEMBER_USAGE_GAS_URL = localStorage.getItem('sise_usage_gas_url') || 'YOUR_USAGE_GAS_URL';

        // プラン別の月間利用上限設定
        const PLAN_LIMITS_STORAGE_KEY = 'sise_usage_plan_limits';
        const CARRYOVER_STORAGE_KEY = 'sise_usage_carryover';

        const useMemberUsage = () => {
            const [usageData, setUsageData] = useState({});
            const [saving, setSaving] = useState(false);
            const [lastSaved, setLastSaved] = useState(null);
            const [lastSynced, setLastSynced] = useState(null);
            // プラン別の月間上限（{ planName: maxSessions }）
            const [planLimits, setPlanLimits] = useState(() => {
                try { return JSON.parse(localStorage.getItem(PLAN_LIMITS_STORAGE_KEY) || '{}'); } catch(e) { return {}; }
            });
            // 繰越データ（{ memberId__periodKey: carryoverCount }）
            const [carryoverData, setCarryoverData] = useState(() => {
                try { return JSON.parse(localStorage.getItem(CARRYOVER_STORAGE_KEY) || '{}'); } catch(e) { return {}; }
            });

            const currentMonth = new Date().toISOString().slice(0, 7); // YYYY-MM

            // プラン上限を設定
            const setPlanLimit = useCallback((planName, maxSessions) => {
                setPlanLimits(prev => {
                    const updated = { ...prev, [planName]: maxSessions };
                    try { localStorage.setItem(PLAN_LIMITS_STORAGE_KEY, JSON.stringify(updated)); } catch(e) {}
                    return updated;
                });
            }, []);

            // 繰越を手動設定
            const setCarryover = useCallback((memberId, periodKey, count) => {
                const key = `${memberId}__${periodKey}`;
                setCarryoverData(prev => {
                    const updated = { ...prev, [key]: Math.max(0, count) };
                    try { localStorage.setItem(CARRYOVER_STORAGE_KEY, JSON.stringify(updated)); } catch(e) {}
                    return updated;
                });
            }, []);

            // 繰越数を取得
            const getCarryover = useCallback((memberId, periodKey) => {
                const key = `${memberId}__${periodKey}`;
                return carryoverData[key] || 0;
            }, [carryoverData]);

            // プラン上限を取得
            const getPlanLimit = useCallback((planName) => {
                return planLimits[planName] || 0;
            }, [planLimits]);

            // GASからデータを取得する関数
            const fetchFromGAS = useCallback(() => {
                if (MEMBER_USAGE_GAS_URL !== 'YOUR_USAGE_GAS_URL') {
                    return fetch(MEMBER_USAGE_GAS_URL + '?action=getUsage&month=' + currentMonth)
                        .then(r => r.json())
                        .then(data => {
                            if (data && data.usage) {
                                setUsageData(prev => {
                                    const merged = { ...prev, ...data.usage };
                                    // ローカルにも反映
                                    try {
                                        const all = JSON.parse(localStorage.getItem('sise_member_usage') || '{}');
                                        all[currentMonth] = merged;
                                        localStorage.setItem('sise_member_usage', JSON.stringify(all));
                                    } catch (e) {}
                                    return merged;
                                });
                                setLastSynced(new Date());
                            }
                        })
                        .catch(() => {});
                }
                return Promise.resolve();
            }, [currentMonth]);

            // ローカルストレージからロード + GAS初回読み込み
            useEffect(() => {
                try {
                    const stored = JSON.parse(localStorage.getItem('sise_member_usage') || '{}');
                    setUsageData(stored[currentMonth] || {});
                } catch (e) { setUsageData({}); }

                fetchFromGAS();
            }, [currentMonth, fetchFromGAS]);

            // 定期同期（60秒ごとにGASからデータ取得）
            useEffect(() => {
                if (MEMBER_USAGE_GAS_URL === 'YOUR_USAGE_GAS_URL') return;
                const interval = setInterval(() => {
                    fetchFromGAS();
                }, 60000);
                return () => clearInterval(interval);
            }, [fetchFromGAS]);

            // 利用回数を更新（期間キーに対応）+ GASへ即時同期
            const updateUsage = useCallback((memberId, count, periodKey) => {
                const key = periodKey ? `${memberId}__${periodKey}` : memberId;
                setUsageData(prev => {
                    const updated = { ...prev, [key]: Math.max(0, count) };
                    try {
                        const all = JSON.parse(localStorage.getItem('sise_member_usage') || '{}');
                        all[currentMonth] = updated;
                        localStorage.setItem('sise_member_usage', JSON.stringify(all));
                    } catch (e) {}
                    // GASへ即時同期（バックグラウンド）
                    if (MEMBER_USAGE_GAS_URL !== 'YOUR_USAGE_GAS_URL') {
                        fetch(MEMBER_USAGE_GAS_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                action: 'saveUsage',
                                data: [{ memberId, month: currentMonth, periodKey: periodKey || '', count: Math.max(0, count), updatedAt: new Date().toISOString() }]
                            })
                        }).catch(() => {});
                    }
                    return updated;
                });
            }, [currentMonth]);

            // Google Sheetsに保存
            const saveToSheet = useCallback(async (members) => {
                setSaving(true);
                try {
                    const all = JSON.parse(localStorage.getItem('sise_member_usage') || '{}');
                    all[currentMonth] = usageData;
                    localStorage.setItem('sise_member_usage', JSON.stringify(all));

                    if (MEMBER_USAGE_GAS_URL !== 'YOUR_USAGE_GAS_URL') {
                        const payload = Object.entries(usageData).map(([rawKey, count]) => {
                            const memberId = rawKey.includes('__') ? rawKey.split('__')[0] : rawKey;
                            const periodKey = rawKey.includes('__') ? rawKey.split('__')[1] : '';
                            const member = members.find(m => m.id === memberId);
                            return {
                                memberId,
                                memberName: member?.name || '不明',
                                storeName: member?.storeName || '',
                                planName: member?.planName || '',
                                month: currentMonth,
                                periodKey,
                                count,
                                updatedAt: new Date().toISOString()
                            };
                        });
                        await fetch(MEMBER_USAGE_GAS_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'saveUsage', data: payload })
                        });
                    }
                    setLastSaved(new Date());
                } catch (e) {
                    console.error('Usage save error:', e);
                } finally {
                    setSaving(false);
                }
            }, [usageData, currentMonth]);

            const getUsage = useCallback((memberId, periodKey) => {
                const key = periodKey ? `${memberId}__${periodKey}` : memberId;
                return usageData[key] || 0;
            }, [usageData]);

            // 手動同期ボタン用
            const syncFromGAS = useCallback(async () => {
                await fetchFromGAS();
            }, [fetchFromGAS]);

            return {
                usageData, updateUsage, saveToSheet, getUsage, saving, lastSaved, lastSynced, syncFromGAS, currentMonth,
                planLimits, setPlanLimit, getPlanLimit,
                carryoverData, setCarryover, getCarryover
            };
        };

        // ========================================
        // 回数券管理（Google Sheets連携）
        // ========================================

        const TICKET_GAS_URL = localStorage.getItem('sise_ticket_gas_url') || 'YOUR_TICKET_GAS_URL';
        const TICKET_STORAGE_KEY = 'sise_ticket_data';

        const useTicketManagement = () => {
            // 回数券プラン（種類）
            const [ticketPlans, setTicketPlans] = useState([]);
            // 顧客回数券（購入記録）
            const [customerTickets, setCustomerTickets] = useState([]);
            const [saving, setSaving] = useState(false);
            const [lastSaved, setLastSaved] = useState(null);
            const [lastSynced, setLastSynced] = useState(null);

            // GASからデータを取得する関数
            const fetchTicketsFromGAS = useCallback(() => {
                if (TICKET_GAS_URL !== 'YOUR_TICKET_GAS_URL') {
                    return fetch(TICKET_GAS_URL + '?action=getTickets')
                        .then(r => r.json())
                        .then(data => {
                            if (data && data.plans) {
                                setTicketPlans(data.plans);
                            }
                            if (data && data.tickets) {
                                setCustomerTickets(data.tickets);
                            }
                            if (data && (data.plans || data.tickets)) {
                                // ローカルにも反映
                                try {
                                    localStorage.setItem(TICKET_STORAGE_KEY, JSON.stringify({
                                        plans: data.plans || [],
                                        tickets: data.tickets || []
                                    }));
                                } catch (e) {}
                                setLastSynced(new Date());
                            }
                        })
                        .catch(() => {});
                }
                return Promise.resolve();
            }, []);

            // ローカルストレージから読み込み + GAS初回読み込み
            useEffect(() => {
                try {
                    const stored = JSON.parse(localStorage.getItem(TICKET_STORAGE_KEY) || '{}');
                    setTicketPlans(stored.plans || [
                        { id: 'plan_1', name: '5回券', sessions: 5, price: 45000, validityDays: 90, active: true },
                        { id: 'plan_2', name: '10回券', sessions: 10, price: 80000, validityDays: 180, active: true },
                        { id: 'plan_3', name: '20回券', sessions: 20, price: 140000, validityDays: 365, active: true },
                    ]);
                    setCustomerTickets(stored.tickets || []);
                } catch (e) { }

                fetchTicketsFromGAS();
            }, [fetchTicketsFromGAS]);

            // 定期同期（60秒ごとにGASからデータ取得）
            useEffect(() => {
                if (TICKET_GAS_URL === 'YOUR_TICKET_GAS_URL') return;
                const interval = setInterval(() => {
                    fetchTicketsFromGAS();
                }, 60000);
                return () => clearInterval(interval);
            }, [fetchTicketsFromGAS]);

            // ローカル保存
            const saveLocal = useCallback((plans, tickets) => {
                try {
                    localStorage.setItem(TICKET_STORAGE_KEY, JSON.stringify({ plans, tickets }));
                } catch (e) {}
            }, []);

            // 回数券プラン管理
            const addPlan = useCallback((plan) => {
                const newPlan = { ...plan, id: 'plan_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) };
                setTicketPlans(prev => {
                    const updated = [...prev, newPlan];
                    saveLocal(updated, customerTickets);
                    return updated;
                });
                return newPlan;
            }, [customerTickets, saveLocal]);

            const updatePlan = useCallback((planId, updates) => {
                setTicketPlans(prev => {
                    const updated = prev.map(p => p.id === planId ? { ...p, ...updates } : p);
                    saveLocal(updated, customerTickets);
                    return updated;
                });
            }, [customerTickets, saveLocal]);

            const deletePlan = useCallback((planId) => {
                setTicketPlans(prev => {
                    const updated = prev.filter(p => p.id !== planId);
                    saveLocal(updated, customerTickets);
                    return updated;
                });
            }, [customerTickets, saveLocal]);

            // 顧客回数券管理
            const addCustomerTicket = useCallback((ticket) => {
                const plan = ticketPlans.find(p => p.id === ticket.planId);
                const purchaseDate = ticket.purchaseDate || new Date().toISOString().slice(0, 10);
                const expirationDate = ticket.expirationDate || (() => {
                    const d = new Date(purchaseDate);
                    d.setDate(d.getDate() + (plan?.validityDays || 180));
                    return d.toISOString().slice(0, 10);
                })();

                const newTicket = {
                    id: 'tkt_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                    customerName: ticket.customerName,
                    customerPhone: ticket.customerPhone || '',
                    planId: ticket.planId,
                    planName: plan?.name || ticket.planName || '',
                    totalSessions: plan?.sessions || ticket.totalSessions || 0,
                    remainingSessions: plan?.sessions || ticket.totalSessions || 0,
                    price: plan?.price || ticket.price || 0,
                    purchaseDate,
                    expirationDate,
                    storeName: ticket.storeName || '',
                    notes: ticket.notes || '',
                    usageHistory: [],
                    createdAt: new Date().toISOString(),
                };

                setCustomerTickets(prev => {
                    const updated = [newTicket, ...prev];
                    saveLocal(ticketPlans, updated);
                    return updated;
                });
                return newTicket;
            }, [ticketPlans, saveLocal]);

            const updateCustomerTicket = useCallback((ticketId, updates) => {
                setCustomerTickets(prev => {
                    const updated = prev.map(t => t.id === ticketId ? { ...t, ...updates } : t);
                    saveLocal(ticketPlans, updated);
                    return updated;
                });
            }, [ticketPlans, saveLocal]);

            const useSession = useCallback((ticketId) => {
                setCustomerTickets(prev => {
                    const updated = prev.map(t => {
                        if (t.id !== ticketId || t.remainingSessions <= 0) return t;
                        return {
                            ...t,
                            remainingSessions: t.remainingSessions - 1,
                            usageHistory: [...(t.usageHistory || []), { date: new Date().toISOString(), action: 'use' }],
                        };
                    });
                    saveLocal(ticketPlans, updated);
                    return updated;
                });
            }, [ticketPlans, saveLocal]);

            const undoSession = useCallback((ticketId) => {
                setCustomerTickets(prev => {
                    const updated = prev.map(t => {
                        if (t.id !== ticketId || t.remainingSessions >= t.totalSessions) return t;
                        return {
                            ...t,
                            remainingSessions: t.remainingSessions + 1,
                            usageHistory: [...(t.usageHistory || []), { date: new Date().toISOString(), action: 'undo' }],
                        };
                    });
                    saveLocal(ticketPlans, updated);
                    return updated;
                });
            }, [ticketPlans, saveLocal]);

            const deleteCustomerTicket = useCallback((ticketId) => {
                setCustomerTickets(prev => {
                    const updated = prev.filter(t => t.id !== ticketId);
                    saveLocal(ticketPlans, updated);
                    return updated;
                });
            }, [ticketPlans, saveLocal]);

            // Google Sheets に保存
            const saveToSheet = useCallback(async () => {
                setSaving(true);
                try {
                    saveLocal(ticketPlans, customerTickets);
                    if (TICKET_GAS_URL !== 'YOUR_TICKET_GAS_URL') {
                        await fetch(TICKET_GAS_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'saveTickets', plans: ticketPlans, tickets: customerTickets })
                        });
                    }
                    setLastSaved(new Date());
                } catch (e) {
                    console.error('Ticket save error:', e);
                } finally {
                    setSaving(false);
                }
            }, [ticketPlans, customerTickets, saveLocal]);

            // 集計
            const stats = useMemo(() => {
                const now = new Date();
                const active = customerTickets.filter(t => {
                    return t.remainingSessions > 0 && new Date(t.expirationDate) >= now;
                });
                const expiringSoon = customerTickets.filter(t => {
                    const exp = new Date(t.expirationDate);
                    const diff = (exp - now) / (1000 * 60 * 60 * 24);
                    return t.remainingSessions > 0 && diff >= 0 && diff <= 30;
                });
                const expired = customerTickets.filter(t => {
                    return t.remainingSessions > 0 && new Date(t.expirationDate) < now;
                });
                const completed = customerTickets.filter(t => t.remainingSessions <= 0);
                const totalRevenue = customerTickets.reduce((sum, t) => sum + (t.price || 0), 0);
                const totalRemaining = active.reduce((sum, t) => sum + t.remainingSessions, 0);
                return { active: active.length, expiringSoon: expiringSoon.length, expired: expired.length, completed: completed.length, totalRevenue, totalRemaining, total: customerTickets.length };
            }, [customerTickets]);

            // 手動同期ボタン用
            const syncFromGAS = useCallback(async () => {
                await fetchTicketsFromGAS();
            }, [fetchTicketsFromGAS]);

            return {
                ticketPlans, customerTickets, stats,
                addPlan, updatePlan, deletePlan,
                addCustomerTicket, updateCustomerTicket, useSession, undoSession, deleteCustomerTicket,
                saveToSheet, saving, lastSaved, lastSynced, syncFromGAS
            };
        };

        // ========================================
        // QR・現金決済会員管理（手動会員管理）
        // ========================================

        const MANUAL_MEMBERS_STORAGE_KEY = 'sise_manual_members';
        const MANUAL_MEMBERS_GAS_URL = localStorage.getItem('sise_manual_members_gas_url') || 'YOUR_MANUAL_MEMBERS_GAS_URL';

        const useManualMembers = () => {
            const [manualMembers, setManualMembers] = useState([]);
            const [saving, setSaving] = useState(false);
            const [lastSynced, setLastSynced] = useState(null);

            // GASから取得
            const fetchFromGAS = useCallback(() => {
                if (MANUAL_MEMBERS_GAS_URL !== 'YOUR_MANUAL_MEMBERS_GAS_URL') {
                    return fetch(MANUAL_MEMBERS_GAS_URL + '?action=getManualMembers')
                        .then(r => r.json())
                        .then(data => {
                            if (data && data.members) {
                                setManualMembers(data.members);
                                try { localStorage.setItem(MANUAL_MEMBERS_STORAGE_KEY, JSON.stringify(data.members)); } catch(e) {}
                                setLastSynced(new Date());
                            }
                        })
                        .catch(() => {});
                }
                return Promise.resolve();
            }, []);

            // 初回ロード
            useEffect(() => {
                try {
                    const stored = JSON.parse(localStorage.getItem(MANUAL_MEMBERS_STORAGE_KEY) || '[]');
                    setManualMembers(stored);
                } catch (e) {}
                fetchFromGAS();
            }, [fetchFromGAS]);

            // 定期同期（60秒ごと）
            useEffect(() => {
                if (MANUAL_MEMBERS_GAS_URL === 'YOUR_MANUAL_MEMBERS_GAS_URL') return;
                const interval = setInterval(fetchFromGAS, 60000);
                return () => clearInterval(interval);
            }, [fetchFromGAS]);

            const saveLocal = useCallback((members) => {
                try { localStorage.setItem(MANUAL_MEMBERS_STORAGE_KEY, JSON.stringify(members)); } catch (e) {}
            }, []);

            // GASに保存
            const saveToGAS = useCallback(async (members) => {
                if (MANUAL_MEMBERS_GAS_URL !== 'YOUR_MANUAL_MEMBERS_GAS_URL') {
                    await fetch(MANUAL_MEMBERS_GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'saveManualMembers', members })
                    }).catch(() => {});
                }
            }, []);

            // 会員追加（入会）
            const addMember = useCallback((member) => {
                const newMember = {
                    id: 'manual_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                    name: member.name,
                    phone: member.phone || '',
                    email: member.email || '',
                    paymentMethod: member.paymentMethod || 'QR', // 'QR' | 'CASH'
                    planName: member.planName || '',
                    monthlyPrice: member.monthlyPrice || 0,
                    storeName: member.storeName || '',
                    status: 'ACTIVE',
                    startDate: member.startDate || new Date().toISOString().slice(0, 10),
                    canceledDate: null,
                    notes: member.notes || '',
                    history: [{ date: new Date().toISOString(), action: 'join', note: '入会' }],
                    createdAt: new Date().toISOString(),
                };
                setManualMembers(prev => {
                    const updated = [newMember, ...prev];
                    saveLocal(updated);
                    saveToGAS(updated);
                    return updated;
                });
                return newMember;
            }, [saveLocal, saveToGAS]);

            // 退会処理
            const cancelMember = useCallback((memberId, note) => {
                setManualMembers(prev => {
                    const updated = prev.map(m => {
                        if (m.id !== memberId) return m;
                        return {
                            ...m,
                            status: 'CANCELED',
                            canceledDate: new Date().toISOString().slice(0, 10),
                            history: [...(m.history || []), { date: new Date().toISOString(), action: 'cancel', note: note || '退会' }]
                        };
                    });
                    saveLocal(updated);
                    saveToGAS(updated);
                    return updated;
                });
            }, [saveLocal, saveToGAS]);

            // 再入会
            const reactivateMember = useCallback((memberId) => {
                setManualMembers(prev => {
                    const updated = prev.map(m => {
                        if (m.id !== memberId) return m;
                        return {
                            ...m,
                            status: 'ACTIVE',
                            canceledDate: null,
                            history: [...(m.history || []), { date: new Date().toISOString(), action: 'rejoin', note: '再入会' }]
                        };
                    });
                    saveLocal(updated);
                    saveToGAS(updated);
                    return updated;
                });
            }, [saveLocal, saveToGAS]);

            // プラン変更
            const changePlan = useCallback((memberId, newPlanName, newPrice) => {
                setManualMembers(prev => {
                    const updated = prev.map(m => {
                        if (m.id !== memberId) return m;
                        const oldPlan = m.planName;
                        return {
                            ...m,
                            planName: newPlanName,
                            monthlyPrice: newPrice != null ? newPrice : m.monthlyPrice,
                            history: [...(m.history || []), { date: new Date().toISOString(), action: 'plan_change', note: `${oldPlan} → ${newPlanName}` }]
                        };
                    });
                    saveLocal(updated);
                    saveToGAS(updated);
                    return updated;
                });
            }, [saveLocal, saveToGAS]);

            // 会員情報更新
            const updateMember = useCallback((memberId, updates) => {
                setManualMembers(prev => {
                    const updated = prev.map(m => m.id === memberId ? { ...m, ...updates } : m);
                    saveLocal(updated);
                    saveToGAS(updated);
                    return updated;
                });
            }, [saveLocal, saveToGAS]);

            // 会員削除
            const deleteMember = useCallback((memberId) => {
                setManualMembers(prev => {
                    const updated = prev.filter(m => m.id !== memberId);
                    saveLocal(updated);
                    saveToGAS(updated);
                    return updated;
                });
            }, [saveLocal, saveToGAS]);

            const syncFromGAS = useCallback(async () => { await fetchFromGAS(); }, [fetchFromGAS]);

            // 支払記録を追加
            const addPayment = useCallback((memberId, payment) => {
                setManualMembers(prev => {
                    const updated = prev.map(m => {
                        if (m.id !== memberId) return m;
                        const newPayment = {
                            id: 'pay_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
                            date: payment.date || new Date().toISOString().slice(0, 10),
                            amount: payment.amount || m.monthlyPrice || 0,
                            method: payment.method || m.paymentMethod || 'CASH',
                            note: payment.note || '',
                            createdAt: new Date().toISOString()
                        };
                        return { ...m, payments: [...(m.payments || []), newPayment] };
                    });
                    saveLocal(updated);
                    saveToGAS(updated);
                    return updated;
                });
            }, [saveLocal, saveToGAS]);

            // 支払記録を削除
            const removePayment = useCallback((memberId, paymentId) => {
                setManualMembers(prev => {
                    const updated = prev.map(m => {
                        if (m.id !== memberId) return m;
                        return { ...m, payments: (m.payments || []).filter(p => p.id !== paymentId) };
                    });
                    saveLocal(updated);
                    saveToGAS(updated);
                    return updated;
                });
            }, [saveLocal, saveToGAS]);

            return {
                manualMembers, addMember, cancelMember, reactivateMember,
                changePlan, updateMember, deleteMember, addPayment, removePayment,
                syncFromGAS, lastSynced, saving
            };
        };

        // ========================================
        // 出納帳（キャッシュブック）
        // ========================================

        const CASHBOOK_STORAGE_KEY = 'sise_cashbook';
        const CASHBOOK_GAS_URL = localStorage.getItem('sise_cashbook_gas_url') || 'YOUR_CASHBOOK_GAS_URL';

        const useCashbook = () => {
            const [entries, setEntries] = useState([]);
            const [saving, setSaving] = useState(false);

            // 初回ロード
            useEffect(() => {
                try {
                    const stored = JSON.parse(localStorage.getItem(CASHBOOK_STORAGE_KEY) || '[]');
                    setEntries(stored);
                } catch (e) {}
                if (CASHBOOK_GAS_URL !== 'YOUR_CASHBOOK_GAS_URL') {
                    fetch(CASHBOOK_GAS_URL + '?action=getCashbook')
                        .then(r => r.json())
                        .then(data => {
                            if (data && data.entries) {
                                setEntries(data.entries);
                                try { localStorage.setItem(CASHBOOK_STORAGE_KEY, JSON.stringify(data.entries)); } catch(e) {}
                            }
                        })
                        .catch(() => {});
                }
            }, []);

            const saveLocal = useCallback((data) => {
                try { localStorage.setItem(CASHBOOK_STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
            }, []);

            const saveToGAS = useCallback(async (data) => {
                if (CASHBOOK_GAS_URL !== 'YOUR_CASHBOOK_GAS_URL') {
                    await fetch(CASHBOOK_GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'saveCashbook', entries: data })
                    }).catch(() => {});
                }
            }, []);

            // エントリー追加
            const addEntry = useCallback((entry) => {
                const newEntry = {
                    id: 'cb_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
                    date: entry.date || new Date().toISOString().slice(0, 10),
                    type: entry.type || 'income', // 'income' | 'expense'
                    category: entry.category || '施術売上',
                    description: entry.description || '',
                    amount: parseInt(entry.amount) || 0,
                    customerName: entry.customerName || '',
                    treatmentCount: parseInt(entry.treatmentCount) || 0,
                    paymentMethod: entry.paymentMethod || 'CASH', // 'CASH' | 'QR' | 'CARD' | 'SQUARE'
                    memberId: entry.memberId || null,
                    notes: entry.notes || '',
                    createdAt: new Date().toISOString()
                };
                setEntries(prev => {
                    const updated = [newEntry, ...prev];
                    saveLocal(updated);
                    saveToGAS(updated);
                    return updated;
                });
                return newEntry;
            }, [saveLocal, saveToGAS]);

            // エントリー更新
            const updateEntry = useCallback((entryId, updates) => {
                setEntries(prev => {
                    const updated = prev.map(e => e.id === entryId ? { ...e, ...updates } : e);
                    saveLocal(updated);
                    saveToGAS(updated);
                    return updated;
                });
            }, [saveLocal, saveToGAS]);

            // エントリー削除
            const deleteEntry = useCallback((entryId) => {
                setEntries(prev => {
                    const updated = prev.filter(e => e.id !== entryId);
                    saveLocal(updated);
                    saveToGAS(updated);
                    return updated;
                });
            }, [saveLocal, saveToGAS]);

            return { entries, addEntry, updateEntry, deleteEntry, saving };
        };

        // ========================================
        // ダッシュボードメインビュー
        // ========================================

        // 目標プログレスリング
        const GoalRing = ({ value, max, size = 80, strokeWidth = 6, color = "#33a065", label, sublabel }) => {
            const radius = (size - strokeWidth) / 2;
            const circumference = 2 * Math.PI * radius;
            const progress = Math.min(value / (max || 1), 1);
            const offset = circumference * (1 - progress);
            return (
                <div className="flex flex-col items-center">
                    <svg width={size} height={size} className="transform -rotate-90">
                        <circle cx={size/2} cy={size/2} r={radius} fill="none" stroke="rgba(51,160,101,0.08)" strokeWidth={strokeWidth} />
                        <circle cx={size/2} cy={size/2} r={radius} fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round"
                            strokeDasharray={circumference} strokeDashoffset={offset}
                            className="usage-ring" style={{transition: 'stroke-dashoffset 1.2s cubic-bezier(0.16,1,0.3,1)'}} />
                    </svg>
                    <div className="absolute flex flex-col items-center justify-center" style={{width: size, height: size}}>
                        <span className="text-lg font-extrabold text-slate-900">{Math.round(progress * 100)}%</span>
                    </div>
                    {label && <p className="text-xs font-semibold text-slate-700 mt-1.5">{label}</p>}
                    {sublabel && <p className="text-[10px] text-slate-400">{sublabel}</p>}
                </div>
            );
        };

        const DashboardView = ({ memberData, reportData, selectedStore, setSelectedStore }) => {
            const [dateRange, setDateRange] = useState('month');

            if (!window.Recharts) return <div className="p-8 text-center">チャートを読み込み中...</div>;

            // 日報データの集計
            const aggregatedData = useMemo(() => {
                if (!reportData.reports || reportData.reports.length === 0) {
                    return {
                        totalNewVisits: 0, totalContracts: 0, totalTreatments: 0, conversionRate: 0,
                        byChannel: [], byStore: [], dailyTrend: [],
                        todayReports: [], todayNew: 0, todayContract: 0, todayTreatments: 0,
                        dailyNewTrend: [], dailyContractTrend: [], dailyTreatmentTrend: [],
                        bestChannel: null, topStore: null
                    };
                }

                let filtered = reportData.reports;
                if (selectedStore !== 'all') {
                    filtered = filtered.filter(r => r.store === selectedStore);
                }

                const now = new Date();
                const startDate = new Date();
                switch (dateRange) {
                    case 'week': startDate.setDate(now.getDate() - 7); break;
                    case 'month': startDate.setMonth(now.getMonth() - 1); break;
                    case 'quarter': startDate.setMonth(now.getMonth() - 3); break;
                }
                filtered = filtered.filter(r => new Date(r.timestamp) >= startDate);

                // 本日のレポート
                const todayStr = now.toISOString().slice(0, 10);
                const todayReports = reportData.reports.filter(r => r.timestamp && r.timestamp.startsWith(todayStr));
                const todayNew = todayReports.reduce((s, r) => s + (r.hpbNew||0) + (r.metaNew||0) + (r.referralNew||0) + (r.discountNew||0), 0);
                const todayContract = todayReports.reduce((s, r) => s + (r.hpbContract||0) + (r.metaContract||0) + (r.referralContract||0) + (r.discountContract||0), 0);
                const todayTreatments = todayReports.reduce((s, r) => s + (r.existingTreatments||0), 0);

                // チャネル別集計
                const channels = [
                    { name: 'HPB', newKey: 'hpbNew', contractKey: 'hpbContract', color: '#f97316', icon: 'globe' },
                    { name: 'Meta', newKey: 'metaNew', contractKey: 'metaContract', color: '#3b82f6', icon: 'facebook' },
                    { name: '紹介', newKey: 'referralNew', contractKey: 'referralContract', color: '#22c55e', icon: 'heart-handshake' },
                    { name: '割引集客', newKey: 'discountNew', contractKey: 'discountContract', color: '#a855f7', icon: 'tag' }
                ];
                const byChannel = channels.map(ch => {
                    const newCount = filtered.reduce((sum, r) => sum + (r[ch.newKey] || 0), 0);
                    const contractCount = filtered.reduce((sum, r) => sum + (r[ch.contractKey] || 0), 0);
                    return { name: ch.name, new: newCount, contract: contractCount,
                        rate: newCount > 0 ? (contractCount / newCount * 100).toFixed(1) : 0,
                        color: ch.color, icon: ch.icon };
                });

                // 店舗別集計
                const storeMap = {};
                filtered.forEach(r => {
                    if (!storeMap[r.store]) storeMap[r.store] = { store: r.store, new: 0, contract: 0, treatments: 0, reports: 0 };
                    storeMap[r.store].new += (r.hpbNew||0) + (r.metaNew||0) + (r.referralNew||0) + (r.discountNew||0);
                    storeMap[r.store].contract += (r.hpbContract||0) + (r.metaContract||0) + (r.referralContract||0) + (r.discountContract||0);
                    storeMap[r.store].treatments += r.existingTreatments || 0;
                    storeMap[r.store].reports++;
                });
                const byStore = Object.values(storeMap).sort((a, b) => (b.new + b.contract) - (a.new + a.contract));

                // 日別推移
                const dailyMap = {};
                filtered.forEach(r => {
                    const dateKey = new Date(r.timestamp).toLocaleDateString('ja-JP', { month: 'short', day: 'numeric' });
                    if (!dailyMap[dateKey]) dailyMap[dateKey] = { date: dateKey, new: 0, contract: 0, treatments: 0 };
                    dailyMap[dateKey].new += (r.hpbNew||0) + (r.metaNew||0) + (r.referralNew||0) + (r.discountNew||0);
                    dailyMap[dateKey].contract += (r.hpbContract||0) + (r.metaContract||0) + (r.referralContract||0) + (r.discountContract||0);
                    dailyMap[dateKey].treatments += r.existingTreatments || 0;
                });
                const dailyTrend = Object.values(dailyMap).slice(-14);

                // スパークライン用データ
                const dailyNewTrend = dailyTrend.map(d => d.new);
                const dailyContractTrend = dailyTrend.map(d => d.contract);
                const dailyTreatmentTrend = dailyTrend.map(d => d.treatments);

                const totalNew = byChannel.reduce((sum, ch) => sum + ch.new, 0);
                const totalContract = byChannel.reduce((sum, ch) => sum + ch.contract, 0);
                const totalTreatments = filtered.reduce((sum, r) => sum + (r.existingTreatments || 0), 0);
                const bestChannel = [...byChannel].sort((a, b) => parseFloat(b.rate) - parseFloat(a.rate))[0];
                const topStore = byStore[0] || null;

                return {
                    totalNewVisits: totalNew, totalContracts: totalContract, totalTreatments: totalTreatments,
                    conversionRate: totalNew > 0 ? (totalContract / totalNew * 100) : 0,
                    byChannel, byStore, dailyTrend,
                    todayReports, todayNew, todayContract, todayTreatments,
                    dailyNewTrend, dailyContractTrend, dailyTreatmentTrend,
                    bestChannel, topStore
                };
            }, [reportData.reports, selectedStore, dateRange]);

            const storeColors = ['#33a065', '#3b82f6', '#f97316', '#a855f7', '#ec4899'];
            const tooltipStyle = { backgroundColor: 'rgba(255,255,255,0.95)', borderColor: '#e2e8f0', borderRadius: '16px', boxShadow: '0 12px 40px -8px rgba(0,0,0,0.1)', padding: '12px 16px' };
            const isMobile = typeof window !== 'undefined' && window.innerWidth < 768;
            const chartHeight = isMobile ? 200 : 260;
            const barChartHeight = isMobile ? 190 : 240;

            return (
                <div className="space-y-4 md:space-y-5">
                    {/* フィルターバー */}
                    <Card className="!p-3 md:!p-4">
                        <div className="flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-2">
                                <Icon name="building-2" size={16} className="text-sise-500 hide-mobile" />
                                <select value={selectedStore} onChange={(e) => setSelectedStore(e.target.value)}
                                    className="px-3 py-2 border border-slate-200 rounded-xl text-sm focus:border-sise-500 focus:ring-2 focus:ring-sise-500/20 outline-none bg-white/80">
                                    <option value="all">全店舗</option>
                                    {(currentAccess ? serverStores.filter(s => currentAccess.storeIds.includes(s.id)) : serverStores).map(s =>
                                        <option key={s.id} value={s.name}>{s.name}</option>
                                    )}
                                </select>
                            </div>
                            <div className="flex items-center gap-1.5">
                                {['week', 'month', 'quarter'].map(range => (
                                    <button key={range} onClick={() => setDateRange(range)}
                                        className={`px-3 md:px-4 py-2 rounded-xl text-xs md:text-sm font-semibold transition-all duration-300 ${
                                            dateRange === range ? 'btn-gradient' : 'bg-slate-100/80 text-slate-500 hover:bg-slate-200/80 hover:text-slate-700'
                                        }`}>
                                        {range === 'week' ? '1週間' : range === 'month' ? '1ヶ月' : '3ヶ月'}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </Card>

                    {/* 本日のハイライト */}
                    {aggregatedData.todayReports.length > 0 && (
                        <div className="today-card p-4 md:p-5 animate-slide-up-fade">
                            <div className="flex flex-wrap items-center justify-between gap-3 ml-3">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 text-white flex items-center justify-center shadow-lg">
                                        <Icon name="sun" size={20} />
                                    </div>
                                    <div>
                                        <h3 className="text-base font-bold text-slate-900">本日のサマリー</h3>
                                        <p className="text-[10px] text-slate-500">{new Date().toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short' })} ・ {aggregatedData.todayReports.length}件の日報</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-4 md:gap-6 ml-3">
                                    <div className="text-center">
                                        <p className="text-xl md:text-2xl font-extrabold text-blue-600">{aggregatedData.todayNew}</p>
                                        <p className="text-[10px] text-slate-500 font-medium">新規</p>
                                    </div>
                                    <div className="text-center">
                                        <p className="text-xl md:text-2xl font-extrabold text-emerald-600">{aggregatedData.todayContract}</p>
                                        <p className="text-[10px] text-slate-500 font-medium">契約</p>
                                    </div>
                                    <div className="text-center">
                                        <p className="text-xl md:text-2xl font-extrabold text-orange-600">{aggregatedData.todayTreatments}</p>
                                        <p className="text-[10px] text-slate-500 font-medium">施術</p>
                                    </div>
                                    {aggregatedData.todayNew > 0 && (
                                        <div className="text-center hide-mobile">
                                            <p className="text-xl md:text-2xl font-extrabold text-teal-600">{(aggregatedData.todayContract / aggregatedData.todayNew * 100).toFixed(0)}%</p>
                                            <p className="text-[10px] text-slate-500 font-medium">成約率</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Square会員データ KPIカード */}
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-2.5 md:gap-4">
                        <KpiCard title="アクティブ会員" value={formatNumber(memberData.activeMembers)}
                            subValue={`総会員: ${formatNumber(memberData.totalMembers)}人`} trend={null} icon="users"
                            gradientFrom="from-sise-400" gradientTo="to-sise-600" accentColor="#33a065" loading={memberData.loading} />
                        <KpiCard title="想定月間売上" value={formatCurrency(memberData.expectedRevenue)}
                            subValue="サブスク収益" trend={null} icon="wallet"
                            gradientFrom="from-emerald-400" gradientTo="to-emerald-600" accentColor="#059669" loading={memberData.loading} />
                        <KpiCard title="新規入会" value={formatNumber(memberData.newMembersThisMonth)}
                            subValue="今月の入会者" trend={null} icon="user-plus"
                            gradientFrom="from-blue-400" gradientTo="to-blue-600" accentColor="#3b82f6" loading={memberData.loading} />
                        <KpiCard title="退会率" value={formatPercent(memberData.churnRate)}
                            subValue={`退会者: ${memberData.churnedMembers}人`} trend={null} icon="user-minus"
                            gradientFrom={memberData.churnRate > 5 ? "from-red-400" : "from-slate-400"}
                            gradientTo={memberData.churnRate > 5 ? "to-red-600" : "to-slate-500"}
                            accentColor={memberData.churnRate > 5 ? "#ef4444" : "#64748b"} loading={memberData.loading} />
                    </div>

                    {/* 日報集計 KPIカード（スパークライン付き） */}
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-2.5 md:gap-4">
                        <KpiCard title="新規来店数" value={formatNumber(aggregatedData.totalNewVisits)}
                            subValue="全チャネル合計" trend={null} icon="user-check"
                            gradientFrom="from-orange-400" gradientTo="to-orange-600"
                            sparkData={aggregatedData.dailyNewTrend} accentColor="#f97316" loading={reportData.loading} />
                        <KpiCard title="契約数" value={formatNumber(aggregatedData.totalContracts)}
                            subValue="新規契約" trend={null} icon="file-signature"
                            gradientFrom="from-violet-400" gradientTo="to-violet-600"
                            sparkData={aggregatedData.dailyContractTrend} accentColor="#8b5cf6" loading={reportData.loading} />
                        <KpiCard title="成約率" value={formatPercent(aggregatedData.conversionRate)}
                            subValue="新規 → 契約" trend={null} icon="target"
                            gradientFrom="from-teal-400" gradientTo="to-teal-600" accentColor="#14b8a6" loading={reportData.loading} />
                        <KpiCard title="既存施術数" value={formatNumber(aggregatedData.totalTreatments)}
                            subValue="リピーター対応" trend={null} icon="heart-handshake"
                            gradientFrom="from-rose-400" gradientTo="to-rose-600"
                            sparkData={aggregatedData.dailyTreatmentTrend} accentColor="#f43f5e" loading={reportData.loading} />
                    </div>

                    {/* チャート + チャネルカード */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-5">
                        {/* 日別推移チャート */}
                        <Card>
                            <div className="flex items-center justify-between mb-4">
                                <div>
                                    <h3 className="text-base font-bold text-slate-800">日別推移</h3>
                                    <p className="text-[10px] text-sise-500 tracking-widest font-semibold">DAILY TREND</p>
                                </div>
                                <div className="flex items-center gap-3 text-[10px]">
                                    <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-sky-500"></span>新規</span>
                                    <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-green-500"></span>契約</span>
                                    <span className="flex items-center gap-1"><span className="w-2.5 h-0.5 bg-orange-500" style={{borderTop:'2px dashed #f97316',width:12}}></span>施術</span>
                                </div>
                            </div>
                            <ResponsiveContainer width="100%" height={chartHeight}>
                                <ComposedChart data={aggregatedData.dailyTrend}>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#e8f0ec" vertical={false} />
                                    <XAxis dataKey="date" tick={{ fontSize: 10, fill: '#94a3b8' }} axisLine={false} tickLine={false} />
                                    <YAxis tick={{ fontSize: 10, fill: '#94a3b8' }} axisLine={false} tickLine={false} width={30} />
                                    <Tooltip contentStyle={tooltipStyle} />
                                    <defs>
                                        <linearGradient id="areaBlue" x1="0" y1="0" x2="0" y2="1">
                                            <stop offset="0%" stopColor="#0ea5e9" stopOpacity={0.25} />
                                            <stop offset="100%" stopColor="#0ea5e9" stopOpacity={0} />
                                        </linearGradient>
                                        <linearGradient id="areaGreen" x1="0" y1="0" x2="0" y2="1">
                                            <stop offset="0%" stopColor="#22c55e" stopOpacity={0.25} />
                                            <stop offset="100%" stopColor="#22c55e" stopOpacity={0} />
                                        </linearGradient>
                                    </defs>
                                    <Area type="monotone" dataKey="new" name="新規" stroke="#0ea5e9" strokeWidth={2.5} fill="url(#areaBlue)" dot={{ r: 3, fill: '#0ea5e9', strokeWidth: 0 }} activeDot={{ r: 5, fill: '#0ea5e9', stroke: '#fff', strokeWidth: 2 }} />
                                    <Area type="monotone" dataKey="contract" name="契約" stroke="#22c55e" strokeWidth={2.5} fill="url(#areaGreen)" dot={{ r: 3, fill: '#22c55e', strokeWidth: 0 }} activeDot={{ r: 5, fill: '#22c55e', stroke: '#fff', strokeWidth: 2 }} />
                                    <Line type="monotone" dataKey="treatments" name="施術" stroke="#f97316" strokeWidth={2} dot={false} strokeDasharray="6 4" />
                                </ComposedChart>
                            </ResponsiveContainer>
                        </Card>

                        {/* チャネル別カード */}
                        <Card>
                            <h3 className="text-base font-bold text-slate-800 mb-1">チャネル別パフォーマンス</h3>
                            <p className="text-[10px] text-sise-500 mb-4 tracking-widest font-semibold">CHANNEL BREAKDOWN</p>
                            <div className="space-y-3">
                                {aggregatedData.byChannel.map((ch) => {
                                    const rate = parseFloat(ch.rate) || 0;
                                    return (
                                        <div key={ch.name} className="group/ch rounded-xl p-3 hover:bg-slate-50/80 transition-all duration-300">
                                            <div className="flex items-center justify-between mb-2">
                                                <div className="flex items-center gap-2.5">
                                                    <div className="w-8 h-8 rounded-lg flex items-center justify-center" style={{backgroundColor: ch.color + '18'}}>
                                                        <Icon name={ch.icon} size={15} color={ch.color} />
                                                    </div>
                                                    <div>
                                                        <span className="font-semibold text-sm text-slate-800">{ch.name}</span>
                                                        <div className="flex items-center gap-2 text-[10px] text-slate-400">
                                                            <span>新規 {ch.new}</span>
                                                            <span>契約 {ch.contract}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                                <span className={`text-lg font-extrabold ${rate >= 50 ? 'text-emerald-600' : rate >= 30 ? 'text-amber-600' : 'text-slate-400'}`}>
                                                    {ch.rate}%
                                                </span>
                                            </div>
                                            <div className="progress-bar-animated">
                                                <div className="bar" style={{width: `${Math.min(rate, 100)}%`, background: `linear-gradient(90deg, ${ch.color}, ${ch.color}cc)`}}></div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </Card>
                    </div>

                    {/* チャネル別棒グラフ + 店舗ランキング */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-5">
                        {/* チャネル別棒グラフ */}
                        <Card>
                            <div className="flex items-center justify-between mb-4">
                                <div>
                                    <h3 className="text-base font-bold text-slate-800">新規 vs 契約</h3>
                                    <p className="text-[10px] text-sise-500 tracking-widest font-semibold">NEW vs CONTRACT</p>
                                </div>
                            </div>
                            <ResponsiveContainer width="100%" height={barChartHeight}>
                                <BarChart data={aggregatedData.byChannel} barGap={6} barCategoryGap="20%">
                                    <CartesianGrid strokeDasharray="3 3" stroke="#e8f0ec" vertical={false} />
                                    <XAxis dataKey="name" tick={{ fontSize: 11, fill: '#64748b' }} axisLine={false} tickLine={false} />
                                    <YAxis tick={{ fontSize: 10, fill: '#94a3b8' }} axisLine={false} tickLine={false} width={25} />
                                    <Tooltip contentStyle={tooltipStyle} formatter={(v, n) => [v + '人', n === 'new' ? '新規' : '契約']} />
                                    <defs>
                                        <linearGradient id="barGradientBlue" x1="0" y1="0" x2="0" y2="1">
                                            <stop offset="0%" stopColor="#38bdf8" /><stop offset="100%" stopColor="#0ea5e9" />
                                        </linearGradient>
                                        <linearGradient id="barGradientGreen" x1="0" y1="0" x2="0" y2="1">
                                            <stop offset="0%" stopColor="#4ade80" /><stop offset="100%" stopColor="#22c55e" />
                                        </linearGradient>
                                    </defs>
                                    <Bar dataKey="new" name="new" fill="url(#barGradientBlue)" radius={[6, 6, 0, 0]} />
                                    <Bar dataKey="contract" name="contract" fill="url(#barGradientGreen)" radius={[6, 6, 0, 0]} />
                                </BarChart>
                            </ResponsiveContainer>
                        </Card>

                        {/* 店舗ランキング */}
                        {aggregatedData.byStore.length > 0 && (
                            <Card>
                                <div className="flex items-center justify-between mb-4">
                                    <div>
                                        <h3 className="text-base font-bold text-slate-800">店舗ランキング</h3>
                                        <p className="text-[10px] text-sise-500 tracking-widest font-semibold">STORE RANKING</p>
                                    </div>
                                    {aggregatedData.topStore && (
                                        <span className="flex items-center gap-1 text-xs font-semibold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full">
                                            <Icon name="trophy" size={12} /> {aggregatedData.topStore.store}
                                        </span>
                                    )}
                                </div>
                                <div className="space-y-3">
                                    {aggregatedData.byStore.map((store, i) => {
                                        const maxTotal = Math.max(...aggregatedData.byStore.map(s => s.new + s.contract + s.treatments));
                                        const total = store.new + store.contract + store.treatments;
                                        const pct = maxTotal > 0 ? (total / maxTotal * 100) : 0;
                                        return (
                                            <div key={store.store} className="group/store">
                                                <div className="flex items-center justify-between mb-1.5">
                                                    <div className="flex items-center gap-2">
                                                        <span className={`w-6 h-6 rounded-lg flex items-center justify-center text-[10px] font-bold text-white ${i === 0 ? 'bg-gradient-to-br from-amber-400 to-orange-500' : i === 1 ? 'bg-gradient-to-br from-slate-300 to-slate-400' : i === 2 ? 'bg-gradient-to-br from-amber-600 to-amber-700' : 'bg-slate-200 text-slate-500'}`}>
                                                            {i + 1}

                                                        <span className="font-semibold text-sm text-slate-800">{store.store}</span>

        // ========================================
        // サブスク契約リンク生成モーダル
